name: BoringCache benchmark provider
description: Calls the reviewed BoringCache One release and preserves its public evidence outputs.
inputs:
  mode:
    description: Product adapter declared by the case plan.
    required: true
  working-directory:
    description: Directory containing the product plan.
    default: '.'
  trust-policy:
    description: Declared restore or publication behavior for this observation.
    default: auto
  cli-version:
    description: Optional exact CLI release or canary; empty uses config/cli.json.
    default: ''
  cli-platform:
    description: Optional canonical CLI package platform.
    default: ''
  cache-profiles:
    description: Declared product cache profiles.
    default: ''
  diagnostics:
    description: Public Action diagnostic level.
    default: auto
  fail-on-cache-miss:
    description: Require an existing cache seed for this observation.
    default: 'false'
outputs:
  cache-hit:
    description: Cache outcome emitted by the public product Action.
    value: ${{ steps.provider.outputs.cache-hit }}
  evidence-path:
    description: Product evidence file retained by the case reporter.
    value: ${{ steps.provider.outputs.evidence-path }}
runs:
  using: composite
  steps:
    - id: cli
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        [[ -n "$CLI_VERSION" ]] || CLI_VERSION="$(ruby scripts/benchmark-cli.rb version)"
        echo "version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
    # Register first so retention runs after the product's post step.
    - id: retention
      uses: ./.github/actions/retain-product-evidence
    - id: provider
      uses: boringcache/one@696d081c557c070471a175d72aa67d27709a3f31 # v1.40.0
      with:
        mode: ${{ inputs.mode }}
        working-directory: ${{ inputs.working-directory }}
        trust-policy: ${{ inputs.trust-policy }}
        cli-version: ${{ steps.cli.outputs.version }}
        cli-platform: ${{ inputs.cli-platform }}
        cache-profiles: ${{ inputs.cache-profiles }}
        diagnostics: ${{ inputs.diagnostics }}
        fail-on-cache-error: true
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss == 'true' }}
    - name: Register the original product evidence
      if: always()
      shell: bash
      env:
        EVIDENCE_PATH: ${{ steps.provider.outputs.evidence-path }}
        REGISTRY_PATH: ${{ steps.retention.outputs.registry-path }}
      run: printf '%s\n' "$EVIDENCE_PATH" > "$REGISTRY_PATH"
