name: Build with the declared Docker cache provider
description: Measures the same cache publication policy and image output for both providers.
inputs:
  strategy:
    required: true
  phase:
    required: true
  publish-on-warm:
    default: 'false'
  cache-scope:
    required: true
  cli-version:
    default: ''
  cli-platform:
    default: ''
  buildkit-image:
    default: ''
  context:
    required: true
  file:
    required: true
  platforms:
    default: ''
  target:
    default: ''
  tags:
    default: ''
  push:
    default: 'false'
  load:
    default: 'false'
  build-args:
    default: ''
  provenance:
    default: ''
  sbom:
    default: 'false'
  secrets:
    default: ''
  no-cache:
    default: 'false'
outputs:
  setup-seconds:
    value: ${{ steps.build_timer.outputs.setup_seconds }}
    description: Provider setup duration.
  build-seconds:
    value: ${{ steps.build_timing.outputs.build_seconds }}
    description: Build, image output and declared cache publication duration.
  cache-hit:
    value: ${{ steps.publish.outputs.cache-hit || steps.restore.outputs.cache-hit }}
    description: Product-reported cache outcome, when measured.
  evidence-path:
    value: ${{ steps.publish.outputs.evidence-path || steps.restore.outputs.evidence-path }}
    description: Original product evidence file.
runs:
  using: composite
  steps:
    - name: Resolve the shared cache publication policy
      id: policy
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        PUBLISH_ON_WARM: ${{ inputs.publish-on-warm }}
      run: ruby ./scripts/benchmark-phase.rb policy
    - name: Start the provider setup timer
      id: setup_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Set up the Actions Cache builder
      if: inputs.strategy == 'actions-cache'
      uses: ./.github/actions/setup-docker
    - name: Start the build timer
      id: build_timer
      shell: bash
      env:
        SETUP_STARTED_AT: ${{ steps.setup_timer.outputs.started_at }}
      run: |
        now="$(date +%s)"
        echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
        echo "started_at=$now" >> "$GITHUB_OUTPUT"
    - name: Build with Actions Cache
      if: inputs.strategy == 'actions-cache'
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      env:
        DOCKER_BUILD_SUMMARY: 'false'
        DOCKER_BUILD_RECORD_UPLOAD: 'false'
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        target: ${{ inputs.target }}
        tags: ${{ inputs.tags }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.load == 'true' }}
        build-args: ${{ inputs.build-args }}
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom == 'true' }}
        secrets: ${{ inputs.secrets }}
        no-cache: ${{ inputs.no-cache == 'true' }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: ${{ steps.policy.outputs.publish_cache == 'true' && format('type=gha,scope={0},mode=max', inputs.cache-scope) || '' }}
    - name: Build and publish with BoringCache
      id: publish
      if: inputs.strategy == 'boringcache' && steps.policy.outputs.publish_cache == 'true'
      uses: ./.github/actions/boringcache
      env:
        BORINGCACHE_MANAGED_BUILDKIT_IMAGE: ${{ inputs.buildkit-image }}
      with:
        mode: docker
        cli-version: ${{ inputs.cli-version }}
        cli-platform: ${{ inputs.cli-platform }}
        trust-policy: publish
        fail-on-cache-miss: ${{ steps.policy.outputs.require_hit }}
    - name: Build from the BoringCache seed
      id: restore
      if: inputs.strategy == 'boringcache' && steps.policy.outputs.publish_cache == 'false'
      uses: ./.github/actions/boringcache
      env:
        BORINGCACHE_MANAGED_BUILDKIT_IMAGE: ${{ inputs.buildkit-image }}
      with:
        mode: docker
        cli-version: ${{ inputs.cli-version }}
        cli-platform: ${{ inputs.cli-platform }}
        trust-policy: restore
        fail-on-cache-miss: ${{ steps.policy.outputs.require_hit }}
    - name: Capture the build timing
      id: build_timing
      shell: bash
      env:
        BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
      run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
