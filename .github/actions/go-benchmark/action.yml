---
name: Run a Go benchmark phase
description: Prepares a pinned Go workload and invokes the shared native cache phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  go_version:
    required: true
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.cache.outputs.cache_scope }}"
runs:
  using: composite
  steps:
  - id: source
    uses: "./.github/actions/prepare-native"
    with:
      phase: "${{ inputs.phase }}"
  - name: Set up Go
    uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
    with:
      go-version: "${{ inputs.go_version }}"
      cache: false
  - id: cache
    uses: "./.github/actions/native-cache-benchmark"
    with:
      strategy: "${{ inputs.strategy }}"
      cache_lane: "${{ inputs.cache_lane }}"
      phase: "${{ inputs.phase }}"
      benchmark_id: "${{ inputs.benchmark_id }}"
      cli_version: "${{ inputs.cli_version }}"
      mode: go
      cache_path: ".go/build-cache"
      workflow_started_at: "${{ steps.source.outputs.workflow_started_at }}"
    env:
      GOCACHE: "${{ github.workspace }}/.go/build-cache"
