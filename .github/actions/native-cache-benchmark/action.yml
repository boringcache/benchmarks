---
name: Run a native cache phase
description: Selects the provider, measures the declared command, verifies outputs
  and retains phase evidence.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  mode:
    required: true
  cache_path:
    required: true
  workflow_started_at:
    required: true
  configure_script:
    default: ''
  command_mode:
    default: ''
  working_directory:
    default: upstream
  cache_profiles:
    default: ''
  prepare_script:
    default: ''
  dependency_token:
    default: ''
  report_variant:
    default: ''
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.scope.outputs.cache_scope }}"
runs:
  using: composite
  steps:
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      CACHE_LANE: "${{ inputs.cache_lane }}"
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      CACHE_MODE: "${{ inputs.command_mode || inputs.mode }}"
    run: |
      set -euo pipefail
      cache_scope="$(ruby ./scripts/benchmark-phase.rb scope)"
      ruby ./scripts/scope-case-cache.rb "$cache_scope"
      source_sha="$(git rev-parse HEAD:upstream)"
      echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      echo "cache_key=${CACHE_MODE}-${cache_scope}-${source_sha}" >> "$GITHUB_OUTPUT"
      ruby -rjson -e 'puts "source_repository=#{JSON.parse(File.read("benchmark-context.json")).fetch("source").fetch("repository")}"' >> "$GITHUB_OUTPUT"
      echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
  - name: Start the provider setup timer
    id: setup_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Select the runner cache provider
    shell: bash
    env:
      CACHE_PROVIDER: ${{ inputs.strategy }}
      CACHE_MODE: ${{ inputs.command_mode || inputs.mode }}
      CACHE_PHASE: ${{ inputs.phase }}
    run: ruby ./scripts/depot-cache.rb
  - name: Restore the GitHub Actions cache
    if: (inputs.strategy == 'actions-cache' || inputs.strategy == 'depot-actions-cache') && inputs.phase == 'publish'
    uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ inputs.cache_path }}"
      key: "${{ steps.scope.outputs.cache_key }}"
      restore-keys: "${{ inputs.command_mode || inputs.mode }}-${{ steps.scope.outputs.cache_scope
        }}-"
    id: actions_cache_0
  - name: Restore the exact GitHub Actions cache
    if: (inputs.strategy == 'actions-cache' || inputs.strategy == 'depot-actions-cache') && inputs.phase == 'warm'
    uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ inputs.cache_path }}"
      key: "${{ steps.scope.outputs.cache_key }}"
      fail-on-cache-miss: true
    id: actions_cache_1
  - name: Publish with BoringCache
    id: boringcache-publish
    if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
    uses: "./.github/actions/boringcache"
    with:
      cli-version: "${{ inputs.cli_version }}"
      mode: "${{ inputs.mode }}"
      trust-policy: publish
      working-directory: "${{ inputs.working_directory }}"
      cache-profiles: "${{ inputs.cache_profiles }}"
  - name: Restore with BoringCache
    id: boringcache-restore
    if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
    uses: "./.github/actions/boringcache"
    with:
      cli-version: "${{ inputs.cli_version }}"
      mode: "${{ inputs.mode }}"
      trust-policy: restore
      working-directory: "${{ inputs.working_directory }}"
      fail-on-cache-miss: true
      cache-profiles: "${{ inputs.cache_profiles }}"
  - name: Configure the native comparator
    if: inputs.configure_script != '' && inputs.strategy != 'depot-cache'
    shell: bash
    env:
      CONFIGURE_SCRIPT: "${{ inputs.configure_script }}"
      CACHE_STRATEGY: "${{ inputs.strategy }}"
    run: bash "$CONFIGURE_SCRIPT" "$CACHE_STRATEGY"
  - name: Capture cache setup timing
    id: setup_timing
    shell: bash
    env:
      SETUP_STARTED_AT: "${{ steps.setup_timer.outputs.started_at }}"
    run: |
      set -euo pipefail
      now="$(date +%s)"
      echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
  - name: Prepare workload dependencies outside measurement
    if: inputs.prepare_script != ''
    shell: bash
    env:
      PREPARE_SCRIPT: "${{ inputs.prepare_script }}"
      GITHUB_TOKEN: "${{ inputs.dependency_token }}"
    run: ruby "$PREPARE_SCRIPT"
  - name: Start the build timer
    id: build_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Run the declared product-plan command
    id: build
    shell: bash
    env:
      BENCHMARK_MODE: "${{ inputs.command_mode || inputs.mode }}"
    run: ruby ./scripts/run-benchmark-plan.rb "$BENCHMARK_MODE" --working-directory
      upstream
  - name: Capture the build timing
    if: always() && steps.build_timer.outcome == 'success'
    id: build_timing
    shell: bash
    env:
      BUILD_STARTED_AT: "${{ steps.build_timer.outputs.started_at }}"
    run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
  - name: Verify workload outputs
    id: verify
    shell: bash
    run: ruby ./scripts/verify-output.rb
  - name: Publish the GitHub Actions cache after measurement
    if: (inputs.strategy == 'actions-cache' || inputs.strategy == 'depot-actions-cache') && inputs.phase == 'publish' && steps.actions_cache_0.outputs.cache-hit != 'true'
    uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ inputs.cache_path }}"
      key: "${{ steps.scope.outputs.cache_key }}"
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase
        == 'warm' && 'warm' || 'cold' }}"
      WORKFLOW_STARTED_AT: "${{ inputs.workflow_started_at }}"
      SETUP_SECONDS: "${{ steps.setup_timing.outputs.setup_seconds }}"
      BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
      CACHE_HIT: "${{ steps.boringcache-publish.outputs.cache-hit || steps.boringcache-restore.outputs.cache-hit
        || steps.actions_cache_0.outputs.cache-hit || steps.actions_cache_1.outputs.cache-hit
        }}"
      EVIDENCE_PATH: "${{ steps.boringcache-publish.outputs.evidence-path || steps.boringcache-restore.outputs.evidence-path
        }}"
      STORAGE_KEY: "${{ steps.scope.outputs.cache_key }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_REPOSITORY: "${{ steps.scope.outputs.source_repository }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
      BENCHMARK_MODE: "${{ inputs.mode }}"
      REPORT_VARIANT: "${{ inputs.report_variant }}"
    run: |
      set -euo pipefail
      if [[ "$BENCHMARK_MODE" == nx && -f nx-cache-state.json ]]; then
        CACHE_HIT="$(ruby -rjson -e 'puts JSON.parse(File.read("nx-cache-state.json")).fetch("hit")')"
      fi
      ruby ./scripts/benchmark-report.rb phase --verified-output \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --variant "$REPORT_VARIANT" --mode "$BENCHMARK_MODE" \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository "$SOURCE_REPOSITORY" \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH"
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane
        }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm'
        && 'warm' || 'cold' }}
      path: benchmark-results/
      if-no-files-found: error
  - name: Retain available timing and verification state
    if: always()
    shell: bash
    env:
      BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
      SETUP_SECONDS: "${{ steps.setup_timing.outputs.setup_seconds }}"
      VERIFIED: "${{ steps.verify.outcome }}"
    run: |
      ruby -rjson -e '
        timing = {"build_seconds" => ENV["BUILD_SECONDS"], "restore_or_setup_seconds" => ENV["SETUP_SECONDS"]}
          .transform_values { |value| value.to_s.empty? ? nil : Float(value) }.compact
        File.write("benchmark-partial.json", JSON.generate({"timing" => timing, "verification" => ENV["VERIFIED"] == "success"}))'
