name: Bench phase
description: Prepare, time, build and record one phase of one case, lane and runner.

inputs:
  case:
    required: true
  lane:
    required: true
  runner:
    required: true
  phase:
    required: true
  run-id:
    required: true
  setup:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        bundler-cache: true

    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install: false
        cache: false

    - shell: bash
      env:
        CASE: ${{ inputs.case }}
        LANE: ${{ inputs.lane }}
        RUNNER: ${{ inputs.runner }}
        PHASE: ${{ inputs.phase }}
        RUN_ID: ${{ inputs.run-id }}
      run: |
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        {
          echo "BENCH_CASE=$CASE"
          echo "BENCH_LANE=$LANE"
          echo "BENCH_RUNNER=$RUNNER"
          echo "BENCH_PHASE=$PHASE"
          echo "BENCH_RUN_ID=$RUN_ID"
          echo "BENCH_WORK=$HOME/w"
          echo "BENCH_RESULTS=$GITHUB_WORKSPACE/results"
          echo "MISE_TRUSTED_CONFIG_PATHS=$HOME/w"
          echo "MISE_YES=1"
        } >> "$GITHUB_ENV"

    - if: contains(inputs.setup, 'buildx')
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: contains(inputs.setup, 'actions-runtime')
      uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

    - if: contains(inputs.setup, 'depot')
      uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

    - if: contains(inputs.setup, 'vercel')
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      with:
        team: ${{ env.TURBO_TEAM_ID }}
    
    - if: contains(inputs.setup, 'namespace')
      uses: namespacelabs/nscloud-setup@df198f982fcecfb8264bea3f1274b56a61b6dfdc # v0
    
    - if: contains(inputs.setup, 'namespace')
      uses: namespacelabs/nscloud-setup-buildx-action@d059ed7184f0bc7c8b27e8810cea153d02bcc6dd # v0
    
    - if: contains(inputs.setup, 'ghcr')
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - if: contains(inputs.setup, 'buildx') || contains(inputs.setup, 'namespace')
      shell: bash
      run: docker buildx ls

    - id: prepare
      shell: bash
      run: bundle exec bin/bench prepare "$BENCH_CASE" --lane "$BENCH_LANE" --phase "$BENCH_PHASE" --run-id "$BENCH_RUN_ID" --github

    - if: steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.provider == 'boringcache'
      shell: bash
      env:
        VERSION: v${{ steps.prepare.outputs.boringcache_version }}
      run: |
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) asset=boringcache-linux-amd64 ;;
          Linux-aarch64) asset=boringcache-linux-arm64 ;;
          Darwin-*) asset=boringcache-macos-universal ;;
        esac
        dir="$RUNNER_TEMP/boringcache-cli"
        mkdir -p "$dir"
        cd "$dir"
        curl --fail --silent --show-error --location --retry 3 --remote-name-all \
          "https://github.com/boringcache/cli/releases/download/$VERSION/$asset" \
          "https://github.com/boringcache/cli/releases/download/$VERSION/SHA256SUMS"
        grep " $asset\$" SHA256SUMS | shasum -a 256 --check
        install -m 0755 "$asset" "$dir/boringcache"
        echo "$dir" >> "$GITHUB_PATH"

    - if: steps.prepare.outputs.ready == 'true'
      shell: bash
      run: bundle exec bin/bench start "$BENCH_CASE" --lane "$BENCH_LANE"

    - if: steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.provider != 'boringcache' && steps.prepare.outputs.cache_paths != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache_paths }}
        key: ${{ steps.prepare.outputs.cache_key }}
        restore-keys: ${{ steps.prepare.outputs.restore_key }}

    - id: build
      if: steps.prepare.outputs.ready == 'true'
      continue-on-error: true
      shell: bash
      env:
        PROVIDER: ${{ steps.prepare.outputs.provider }}
      run: |
        if [ "$PROVIDER" = boringcache ]; then
          boringcache ci run --oidc-provider github-actions -- bundle exec bin/bench build "$BENCH_CASE" --lane "$BENCH_LANE"
        else
          bundle exec bin/bench build "$BENCH_CASE" --lane "$BENCH_LANE"
        fi

    - if: steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.provider != 'boringcache' && steps.prepare.outputs.cache_paths != '' && inputs.phase != 'warm'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache_paths }}
        key: ${{ steps.prepare.outputs.cache_key }}

    - if: steps.prepare.outputs.ready == 'true'
      shell: bash
      env:
        BUILD_FAILED: ${{ steps.build.outcome == 'failure' }}
      run: bundle exec bin/bench record "$BENCH_CASE" --lane "$BENCH_LANE" --exit-status "$([ "$BUILD_FAILED" = true ] && echo 1 || echo 0)"

    - if: always() && steps.prepare.outputs.ready == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: results-${{ steps.prepare.outputs.cache_key }}-${{ inputs.phase }}-${{ github.run_attempt }}
        path: results
        if-no-files-found: warn
