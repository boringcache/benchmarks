name: Prepare benchmark case
description: Installs the shared harness dependencies and prepares declared source and plans.
inputs:
  case-id:
    description: Reviewed case ID from the registry.
    required: true
  native-lane:
    description: Optional fresh or rolling native comparison lane.
    default: ''
  suffix:
    description: Optional diagnostic result suffix.
    default: ''
  variant:
    description: Reviewed native workload variant.
    default: ''
runs:
  using: composite
  steps:
    - name: Set up benchmark Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        working-directory: .harness
    - name: Install benchmark dependencies
      shell: bash
      working-directory: .harness
      run: bundle install --jobs 4 --retry 2
    - name: Prepare declared source and plans
      shell: bash
      env:
        BENCHMARK_CASE_ID: ${{ inputs.case-id }}
        NATIVE_LANE: ${{ inputs.native-lane }}
        BENCHMARK_ID_SUFFIX: ${{ inputs.suffix }}
        BENCHMARK_VARIANT: ${{ inputs.variant }}
        BUNDLE_GEMFILE: ${{ github.workspace }}/.harness/Gemfile
      run: |
        ruby .harness/scripts/benchmark-identity.rb
        args=()
        if [[ -n "$NATIVE_LANE" ]]; then
          args+=(--native-lane "$NATIVE_LANE" --suffix "$BENCHMARK_ID_SUFFIX")
          if [[ -n "$BENCHMARK_VARIANT" ]]; then
            args+=(--variant "$BENCHMARK_VARIANT")
          fi
        fi
        ruby .harness/bin/bench prepare "$BENCHMARK_CASE_ID" --directory "$GITHUB_WORKSPACE" "${args[@]}"
    - name: Install the GitHub artifact client
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/actions/retain-product-evidence
