---
name: Prepare native benchmark source
description: Checks the pinned source and recipe outside the provider timer.
inputs:
  phase:
    required: true
outputs:
  workflow_started_at:
    description: Workflow context timer start
    value: "${{ steps.workflow_timer.outputs.started_at }}"
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Checkout pinned upstream source
    shell: bash
    run: |
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
  - name: Verify the upstream benchmark recipe
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean upstream source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
