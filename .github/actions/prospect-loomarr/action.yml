name: Prepare loomarr
description: Prepare the upstream four-ABI Android workload without a build cache.
inputs:
  node-version:
    description: Exact Node version for the pinned producer comparison
    default: '22.22.3'
  compiler-cache:
    description: Install the pinned C/C++ compiler cache for the separate combined case
    default: 'false'
runs:
  using: composite
  steps:
  - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
    with:
      distribution: temurin
      java-version: '21'
  - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
  - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
    with:
      node-version: ${{ inputs.node-version }}
  - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
    with:
      go-version: 1.27.0
      cache: false
  - name: Install ccache 4.14
    if: inputs.compiler-cache == 'true'
    shell: bash
    run: |-
      archive="$RUNNER_TEMP/ccache-4.14.tar.xz"
      curl --fail --location --retry 3 https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-linux-x86_64-glibc.tar.xz --output "$archive"
      echo "45a91165db7092e67c6208ada03f54700e684c4cd3735f9031de95669ed9272c  $archive" | sha256sum --check
      mkdir -p "$RUNNER_TEMP/ccache-bin"
      tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/ccache-bin"
      echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
      rm "$archive"
      archive="$RUNNER_TEMP/ccache-storage-http-0.9.tar.gz"
      curl --fail --location --retry 3 https://github.com/ccache/ccache-storage-http-go/releases/download/v0.9/ccache-storage-http-go-0.9-linux-amd64.tar.gz --output "$archive"
      echo "875dbf6d575d06e4c4492f1ba639beb68530bc23382031a6bacc767cded9f463  $archive" | sha256sum --check
      tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/ccache-bin"
      rm "$archive"
  - name: Record compiler-cache runner resources
    if: inputs.compiler-cache == 'true'
    shell: bash
    run: |-
      mkdir -p "$RUNNER_TEMP/prospect-evidence"
      {
        ccache --version
        nproc
        lscpu
        free -h
        df -h
      } > "$RUNNER_TEMP/prospect-evidence/runner-resources.txt"
  - name: Install the pinned frontend and generate upstream clients
    shell: bash
    working-directory: source
    run: |-
      corepack enable
      make fe-install
      make fe-codegen
  - name: Verify the affected Android and CI contracts
    shell: bash
    working-directory: source
    run: |-
      bash scripts/ci-impact-test.sh
      node --test web/scripts/with-memory-safe-android-build.test.cjs
      go test -race ./internal/releaseverify
      make ci-lint
