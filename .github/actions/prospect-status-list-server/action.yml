name: Prepare status-list-server
description: Prepare the unchanged upstream workload without a build cache.
runs:
  using: composite
  steps:
  - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
    with:
      toolchain: 1.98.1
  - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
    with:
      tool: sccache@0.17.0,nextest@0.9.101
  - name: Install upstream native dependencies
    shell: bash
    run: |-
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends cmake golang-go
  - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
