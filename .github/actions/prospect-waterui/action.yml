name: Prepare waterui
description: Prepare the unchanged upstream workload without a build cache.
runs:
  using: composite
  steps:
  - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
    with:
      toolchain: 1.98.1
  - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
    with:
      tool: sccache@0.17.0,nextest@0.9.101
  - name: Install upstream native dependencies
    shell: bash
    run: |-
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends nasm libasound2-dev libva-dev libfontconfig1-dev libgbm-dev libegl-dev libxcb1-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libgtk-4-dev libpipewire-0.3-dev libudev-dev mesa-vulkan-drivers libvulkan1
