name: Native REAPI benchmark
description: Runs native managed BoringCache adapters and the bazel-remote comparator.
inputs:
  case-id:
    required: true
  provider:
    required: true
  phase:
    required: true
  cli-version:
    required: true
  lane:
    default: fresh
runs:
  using: composite
  steps:
    - name: Verify the source recipe
      shell: bash
      run: ruby scripts/verify-upstream-recipe.rb .
    - name: Install workload tools
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        cache: false
    - name: Install cache binaries
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLI_RELEASE: ${{ inputs.cli-version }}
        PROVIDER: ${{ inputs.provider }}
      run: ruby scripts/reapi-setup.rb install
    - name: Prepare workload dependencies
      shell: bash
      run: ruby scripts/reapi-setup.rb prepare
    - name: Restore the comparator store
      if: inputs.provider == 'bazel-remote' && inputs.phase == 'warm'
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: reapi-store-${{ inputs.case-id }}
        path: reapi-store
    - name: Restore the rolling comparator store
      if: inputs.provider == 'bazel-remote' && inputs.lane == 'rolling'
      id: rolling-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: reapi-store
        key: reapi-${{ inputs.case-id }}-${{ env.BENCHMARK_ROLLING_SCOPE || env.BENCHMARK_SERIES_ID || github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          reapi-${{ inputs.case-id }}-${{ env.BENCHMARK_ROLLING_SCOPE || env.BENCHMARK_SERIES_ID || github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Record the restored comparator seed
      if: inputs.provider == 'bazel-remote' && inputs.lane == 'rolling'
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.case-id }}
        RESTORED_CACHE_KEY: ${{ steps.rolling-cache.outputs.cache-matched-key }}
      run: ruby scripts/reapi-setup.rb rolling-seed
    - name: Download cold output checks
      if: inputs.phase == 'warm'
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        name: reapi-${{ inputs.case-id }}-${{ inputs.provider }}-cold
        path: cold-checks
    - name: Select the runner cache provider
      shell: bash
      env:
        CACHE_PROVIDER: ${{ inputs.provider }}
        CACHE_MODE: ${{ inputs.case-id == 'stackstorm-pants' && 'pants' || 'moon' }}
        CACHE_PHASE: ${{ inputs.phase }}
      run: ruby ./scripts/depot-cache.rb
    - name: Run BoringCache with workload identity
      if: inputs.provider == 'boringcache'
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        PROVIDER: ${{ inputs.provider }}
        BENCHMARK_ID: ${{ inputs.case-id }}
        CACHE_LANE: ${{ inputs.lane }}
        BORINGCACHE_WORKSPACE: boringcache/benchmarks
      run: boringcache ci run --oidc-provider github-actions -- ruby scripts/reapi-client.rb build
    - name: Run the declared remote-cache comparator
      if: inputs.provider == 'bazel-remote' || inputs.provider == 'depot-cache'
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        PROVIDER: ${{ inputs.provider }}
        BENCHMARK_ID: ${{ inputs.case-id }}
        CACHE_LANE: ${{ inputs.lane }}
      run: ruby scripts/reapi-client.rb build
    - name: Verify outputs and record measurements
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        PROVIDER: ${{ inputs.provider }}
        BENCHMARK_ID: ${{ inputs.case-id }}
        CACHE_LANE: ${{ inputs.lane }}
      run: |
        ruby scripts/reapi-client.rb verify
        if [[ "$PROVIDER" == boringcache ]]; then
          BORINGCACHE_WORKSPACE=boringcache/benchmarks boringcache ci run --oidc-provider github-actions -- ruby scripts/reapi-setup.rb report
        else
          ruby scripts/reapi-setup.rb report
        fi
    - name: Record the verified comparator source
      if: inputs.provider == 'bazel-remote' && inputs.lane == 'rolling'
      shell: bash
      run: ruby scripts/reapi-setup.rb publish-seed
    - name: Publish the verified rolling comparator store
      if: inputs.provider == 'bazel-remote' && inputs.lane == 'rolling'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: reapi-store
        key: ${{ steps.rolling-cache.outputs.cache-primary-key }}
    - name: Retain the comparator store
      if: inputs.provider == 'bazel-remote' && inputs.phase == 'cold'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: reapi-store-${{ inputs.case-id }}
        path: reapi-store/
        compression-level: 0
        if-no-files-found: error
    - name: Retain native checks and logs
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: reapi-${{ inputs.case-id }}-${{ inputs.provider }}-${{ inputs.phase }}
        path: reapi-evidence/
        if-no-files-found: error
    - name: Retain phase measurements
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: phase-${{ inputs.case-id }}-${{ inputs.provider }}-${{ inputs.lane }}-${{ inputs.phase }}
        path: benchmark-results/
        if-no-files-found: error
