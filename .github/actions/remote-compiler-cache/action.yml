name: Run a remote compiler-cache command
description: Executes the declared Cargo command and retains native compiler statistics.
inputs:
  operation:
    default: cargo
  phase:
    default: publish
outputs:
  cache-hit:
    description: Whether native compiler statistics record a cache hit.
    value: ${{ steps.stats.outputs.cache_hit }}
runs:
  using: composite
  steps:
    - name: Configure the selected native compiler cache
      shell: bash
      env:
        CACHE_PROVIDER: depot-cache
        CACHE_MODE: sccache
        CACHE_PHASE: ${{ inputs.phase }}
      run: ruby ./scripts/depot-cache.rb
    - name: Reset compiler statistics
      shell: bash
      run: |
        sccache --stop-server || true
        sccache --start-server
        sccache --zero-stats
    - name: Run the declared Cargo command
      shell: bash
      run: ruby ./scripts/run-benchmark-plan.rb cargo --working-directory upstream
    - name: Retain native compiler statistics
      id: stats
      if: always()
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        [[ "$OPERATION" =~ ^[a-z]+$ ]] || exit 1
        mkdir -p benchmark-results/sccache
        sccache --show-stats --stats-format json > "benchmark-results/sccache/${OPERATION}.json"
        ruby -rjson -e 'value=JSON.parse(File.read("benchmark-results/sccache/#{ENV.fetch("OPERATION")}.json")); hits=value.fetch("stats").fetch("cache_hits").fetch("counts").values.sum; File.open(ENV.fetch("GITHUB_OUTPUT"),"a") { |file| file.puts("cache_hit=#{hits.positive?}") }'
