name: Retain runner and builder environment
description: Records machine resources and Docker endpoints for a runner experiment.
inputs:
  phase:
    required: true
  provider:
    required: true
  runner:
    required: true
runs:
  using: composite
  steps:
    - name: Record environment
      shell: bash
      run: |
        mkdir -p runner-evidence
        { nproc; lscpu; free -b; } > runner-evidence/machine.txt
        if [[ -f /sys/fs/cgroup/cpu.max ]]; then
          cat /sys/fs/cgroup/cpu.max > runner-evidence/cpu-quota.txt
        fi
        docker info > runner-evidence/docker.txt 2>&1 || true
        docker buildx ls > runner-evidence/builders.txt 2>&1 || true
    - name: Retain environment
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: environment-${{ inputs.provider }}-${{ inputs.phase }}-${{ inputs.runner }}
        path: runner-evidence/
        if-no-files-found: error
