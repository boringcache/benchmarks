name: Check benchmark dispatch window
on:
  workflow_call:
    outputs:
      open:
        value: ${{ jobs.window.outputs.open }}
permissions:
  contents: read
jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      open: ${{ steps.window.outputs.open }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      - id: window
        env:
          BENCHMARK_CADENCE_UNTIL: ${{ vars.BENCHMARK_CADENCE_UNTIL }}
        run: ruby scripts/cadence-window.rb
