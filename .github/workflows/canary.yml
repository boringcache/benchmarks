name: Dispatch CLI Canary Cases
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact published CLI canary; empty uses the reviewed benchmark pin
        type: string
        default: ''
      dry_run:
        description: Validate the dispatch without starting builds.
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: benchmark-canary-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || vars.BENCHMARK_CADENCE_ACTIVE == 'true'
    uses: ./.github/workflows/fresh-cadence.yml
    with:
      channel: canary
      cadence: nightly
      cli_version: ${{ inputs.cli_version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
