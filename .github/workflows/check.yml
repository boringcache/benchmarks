name: Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "lib/**"
      - "test/bench/**"
      - "tools/**"
      - "*.toml"
      - "throughput/*.toml"
      - "deps/*.toml"
      - "Gemfile*"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - run: bundle exec ruby -Ilib -e 'Dir["test/bench/*_test.rb"].each { require_relative it }'
      - run: bundle exec bin/bench check
      - name: Check workflows
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
