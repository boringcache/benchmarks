name: 'chroma: Chroma Docker Benchmark'
run-name: "${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary'
  || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual
  dispatch ({0})', github.ref_name)) }}"
concurrency:
  group: benchmark-provider-comparisons
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  packages: write
env:
  BORINGCACHE_NO_GIT: 'true'
  BENCHMARK_ID: "${{ format('chroma{0}', inputs.benchmark_id_suffix) }}"
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  commit:
    name: "${{ matrix.provider }} Chroma commit"
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: GitHub Actions
          strategy: actions-cache
        - provider: BoringCache
          strategy: boringcache
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Set up benchmark Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.4.4
        working-directory: ".harness"
    - name: Install benchmark dependencies
      working-directory: ".harness"
      run: bundle install --jobs 4 --retry 2
    - name: Prepare declared case
      env:
        BENCHMARK_CASE_ID: chroma
        BUNDLE_GEMFILE: "${{ github.workspace }}/.harness/Gemfile"
      run: ruby .harness/bin/bench prepare "$BENCHMARK_CASE_ID" --directory "$GITHUB_WORKSPACE"
    - uses: "./.github/actions/chroma-docker-benchmark"
      with:
        strategy: "${{ matrix.strategy }}"
        cache_lane: rolling
        phase: publish
        benchmark_id: "${{ format('chroma{0}', inputs.benchmark_id_suffix) }}"
        push_image: 'true'
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  report:
    name: Chroma Docker rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Set up benchmark Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.4.4
        working-directory: ".harness"
    - name: Install benchmark dependencies
      working-directory: ".harness"
      run: bundle install --jobs 4 --retry 2
    - name: Prepare declared case
      env:
        BENCHMARK_CASE_ID: chroma
        BUNDLE_GEMFILE: "${{ github.workspace }}/.harness/Gemfile"
      run: ruby .harness/bin/bench prepare "$BENCHMARK_CASE_ID" --directory "$GITHUB_WORKSPACE"
    - name: Download the benchmark phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-${{ env.BENCHMARK_ID }}-*
        path: phase-evidence
    - name: Publish the Chroma Docker benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "Chroma Docker rolling benchmark" \
          --input-dir phase-evidence \
          --output-dir benchmark-results
    - name: Retain the BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-boringcache-rolling
        path: benchmark-results/${{ env.BENCHMARK_ID }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-actions-cache-rolling
        path: benchmark-results/${{ env.BENCHMARK_ID }}-actions-cache-rolling.json
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
'on':
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: Optional managed BoringCache BuildKit image.
        required: false
        type: string
        default: ''
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        description: Optional suffix for an isolated comparison run.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
  push:
    branches:
    - main
    paths:
    - cases/chroma/**
    - adapters/**
    - scripts/canonical/**
    - ".github/workflows/chroma-chroma-benchmark.yml"
