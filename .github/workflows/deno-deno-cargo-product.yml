---
name: 'deno: Deno Cargo product run'
run-name: "${{ format('Deno Cargo fresh | {0} | CLI {1}', inputs.cache_profile ||
  'cargo-product', inputs.cli_version || 'Action default') }}"
permissions:
  actions: read
  contents: read
env:
  CACHE_SCOPE: r${{ github.run_id }}-a${{ github.run_attempt }}
  CACHE_PROFILE: "${{ inputs.cache_profile || 'cargo-product' }}"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: 0
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  publish-base:
    name: BoringCache Deno Cargo cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-24.04' }}"
    timeout-minutes: 240
    outputs:
      base_sha: "${{ steps.source.outputs.DENO_BASE_SHA }}"
      head_sha: "${{ steps.source.outputs.DENO_HEAD_SHA }}"
    steps:
    - name: Configure git
      run: |
        git config --global core.symlinks true
        git config --global fetch.parallel 32
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: deno
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned Deno base
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.DENO_BASE_SHA }}"
        path: upstream
        fetch-depth: 5
        submodules: false
        persist-credentials: false
    - name: Prepare base source
      run: "./scripts/prepare-source.sh base"
    - name: Clone submodule ./tests/util/std
      run: git -C upstream submodule update --init --recursive --depth=1 -- ./tests/util/std
    - name: Verify Deno Linux release recipe
      run: "./scripts/verify-upstream-recipe.rb upstream"
    - name: Install Deno snapshot minifier runtime
      uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
      with:
        deno-version: v2.x
    - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
      run: "./scripts/preinstall-deno-rustup.sh"
    - name: Expose Deno's pinned toolchain file
      run: ln -s upstream/rust-toolchain.toml rust-toolchain.toml
    - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Log versions
      run: |
        echo '*** Python'
        command -v python && python --version || echo 'No python found or bad executable'
        echo '*** Rust'
        command -v rustc && rustc --version || echo 'No rustc found or bad executable'
        echo '*** Cargo'
        command -v cargo && cargo --version || echo 'No cargo found or bad executable'
        echo '*** Deno'
        command -v deno && deno --version || echo 'No deno found or bad executable'
        echo '*** Node'
        command -v node && node --version || echo 'No node found or bad executable'
        echo '*** Installed packages'
        command -v dpkg && dpkg -l || echo 'No dpkg found or bad executable'
    - name: Configure Deno Linux build environment
      run: "./scripts/setup-deno-linux.sh"
    - name: Select Cargo cache layers
      run: ruby ./scripts/select-deno-cargo-profile.rb "$CACHE_PROFILE"
    - name: Scope the fresh Cargo product cohort
      run: ruby ./scripts/scope-boringcache-run.rb "$CACHE_SCOPE" "$CACHE_PROFILE"
    - name: Configure canary build
      run: echo "DENO_CANARY=true" >> "$GITHUB_ENV"
    - name: Configure frame-pointer panic traces
      run: "./scripts/configure-deno-frame-pointers.sh"
    - name: Require a clean product starting point
      run: |
        test ! -e upstream/target
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Report disk before release build
      run: df -h
    - name: Start build and reuse timing
      id: proof_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Build Deno release binaries through boringcache cargo
      id: build_primary
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: publish
        mode: cargo
        working-directory: upstream
        fail-on-cache-error: true
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'
    - name: Select Deno's denort_desktop release command
      run: "./scripts/select-deno-cargo-phase.rb desktop"
    - name: Build denort_desktop through boringcache cargo
      id: build_desktop
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: publish
        mode: cargo
        working-directory: upstream
        fail-on-cache-error: true
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'
    - name: Capture build and reuse timing
      id: proof_timing
      run: echo "seconds=$(( $(date +%s) - ${{ steps.proof_timer.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Report disk after release build
      run: df -h
    - name: Verify the Deno base build
      run: |
        set -euo pipefail
        test -x upstream/target/release/deno
        test -x upstream/target/release/denort
        test -x upstream/target/release/test_server
        test -s upstream/target/release/libdenort.so
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
        cp "${{ steps.build_primary.outputs.evidence-path }}" /tmp/deno-base-primary-action.json
        cp "${{ steps.build_desktop.outputs.evidence-path }}" /tmp/deno-base-desktop-action.json
    - name: Write verified case records
      env:
        PROOF_SECONDS: "${{ steps.proof_timing.outputs.seconds }}"
        EVIDENCE_PATH: "${{ steps.build_primary.outputs.evidence-path }}"
        CACHE_HIT: "${{ steps.build_primary.outputs.cache-hit }}"
      run: |
        set -euo pipefail
        source_sha="$(git -C upstream rev-parse HEAD)"
        variant="$CACHE_PROFILE"
          ruby ./scripts/benchmark-report.rb phase \
            --benchmark deno-cargo --strategy boringcache --mode cargo \
            --lane fresh --phase cold --variant "$variant" \
            --build-seconds "$PROOF_SECONDS" --cache-hit "$CACHE_HIT" --verified-output \
            --source-repository "$(git -C upstream remote get-url origin | sed -E 's#https://github.com/##; s#\.git$##')" \
            --source-sha "$source_sha" --evidence "$EVIDENCE_PATH"
    - name: Upload base evidence
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: deno-cargo-product-base
        path: |
          /tmp/deno-base-*.json
          benchmark-results/*.json
        if-no-files-found: error
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-24.04' }}"
  consume-head:
    name: BoringCache Deno Cargo changed source
    needs: publish-base
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-24.04' }}"
    timeout-minutes: 240
    steps:
    - name: Configure git
      run: |
        git config --global core.symlinks true
        git config --global fetch.parallel 32
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: deno
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned Deno head
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}"
        ref: "${{ needs.publish-base.outputs.head_sha }}"
        path: upstream
        fetch-depth: 5
        submodules: false
        persist-credentials: false
    - name: Prepare adjacent head source
      run: |
        ./scripts/prepare-source.sh head
        test "$(git -C upstream rev-parse HEAD^)" = "${{ needs.publish-base.outputs.base_sha }}"
    - name: Clone submodule ./tests/util/std
      run: git -C upstream submodule update --init --recursive --depth=1 -- ./tests/util/std
    - name: Verify Deno Linux release recipe
      run: "./scripts/verify-upstream-recipe.rb upstream"
    - name: Install Deno snapshot minifier runtime
      uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
      with:
        deno-version: v2.x
    - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
      run: "./scripts/preinstall-deno-rustup.sh"
    - name: Expose Deno's pinned toolchain file
      run: ln -s upstream/rust-toolchain.toml rust-toolchain.toml
    - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Log versions
      run: |
        echo '*** Python'
        command -v python && python --version || echo 'No python found or bad executable'
        echo '*** Rust'
        command -v rustc && rustc --version || echo 'No rustc found or bad executable'
        echo '*** Cargo'
        command -v cargo && cargo --version || echo 'No cargo found or bad executable'
        echo '*** Deno'
        command -v deno && deno --version || echo 'No deno found or bad executable'
        echo '*** Node'
        command -v node && node --version || echo 'No node found or bad executable'
        echo '*** Installed packages'
        command -v dpkg && dpkg -l || echo 'No dpkg found or bad executable'
    - name: Configure Deno Linux build environment
      run: "./scripts/setup-deno-linux.sh"
    - name: Select Cargo cache layers
      run: ruby ./scripts/select-deno-cargo-profile.rb "$CACHE_PROFILE"
    - name: Scope the base Cargo product cohort
      run: ruby ./scripts/scope-boringcache-run.rb "$CACHE_SCOPE" "$CACHE_PROFILE"
    - name: Configure canary build
      run: echo "DENO_CANARY=true" >> "$GITHUB_ENV"
    - name: Configure frame-pointer panic traces
      run: "./scripts/configure-deno-frame-pointers.sh"
    - name: Require an empty destination
      run: |
        test ! -e upstream/target
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Report disk before release build
      run: df -h
    - name: Start build and reuse timing
      id: proof_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore and build Deno release binaries through boringcache cargo
      id: build_primary
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: restore
        mode: cargo
        working-directory: upstream
        fail-on-cache-error: true
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'
    - name: Select Deno's denort_desktop release command
      run: "./scripts/select-deno-cargo-phase.rb desktop"
    - name: Build denort_desktop through boringcache cargo
      id: build_desktop
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: restore
        mode: cargo
        working-directory: upstream
        fail-on-cache-error: true
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'
    - name: Capture build and reuse timing
      id: proof_timing
      run: echo "seconds=$(( $(date +%s) - ${{ steps.proof_timer.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Report disk after release build
      run: df -h
    - name: Verify the Deno head build
      run: |
        set -euo pipefail
        test -x upstream/target/release/deno
        test -x upstream/target/release/denort
        test -x upstream/target/release/test_server
        test -s upstream/target/release/libdenort.so
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
        cp "${{ steps.build_primary.outputs.evidence-path }}" /tmp/deno-head-primary-action.json
        cp "${{ steps.build_desktop.outputs.evidence-path }}" /tmp/deno-head-desktop-action.json
    - name: Write verified case records
      env:
        PROOF_SECONDS: "${{ steps.proof_timing.outputs.seconds }}"
        EVIDENCE_PATH: "${{ steps.build_primary.outputs.evidence-path }}"
        CACHE_HIT: "${{ steps.build_primary.outputs.cache-hit }}"
      run: |
        set -euo pipefail
        source_sha="$(git -C upstream rev-parse HEAD)"
        variant="$CACHE_PROFILE"
          ruby ./scripts/benchmark-report.rb phase \
            --benchmark deno-cargo --strategy boringcache --mode cargo \
            --lane rolling --phase commit --variant "$variant" \
            --build-seconds "$PROOF_SECONDS" --cache-hit "$CACHE_HIT" --verified-output \
            --source-repository "$(git -C upstream remote get-url origin | sed -E 's#https://github.com/##; s#\.git$##')" \
            --source-sha "$source_sha" --evidence "$EVIDENCE_PATH"
    - name: Publish product summary
      run: |
        {
          echo "## Deno Cargo product run"
          echo "- Cache profile: ${CACHE_PROFILE}"
          echo "- Base cache scope: ${CACHE_SCOPE}"
          echo
          echo "- CLI override: \`${{ inputs.cli_version || 'Action default' }}\`"
          echo "- Source: \`${{ needs.publish-base.outputs.base_sha }}\` → \`${{ needs.publish-base.outputs.head_sha }}\`"
          echo "- Primary target available before the adjacent build: \`${{ steps.build_primary.outputs.cache-hit }}\`"
          echo "- Desktop target available before the adjacent build: \`${{ steps.build_desktop.outputs.cache-hit }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload head evidence
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: deno-cargo-product-head
        path: |
          /tmp/deno-head-*.json
          benchmark-results/*.json
        if-no-files-found: error
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-24.04' }}"
'on':
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      cache_profile:
        description: Cargo product caches or native compiler cache only.
        required: false
        type: choice
        options:
        - cargo-product
        - compiler-only
        default: cargo-product
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
