---
name: 'deno: Deno Cargo rolling run'
run-name: "${{ github.event_name == 'push' && 'Deno Cargo rolling pinned source update'
  || format('Deno Cargo rolling {0} | {1} to {2}', inputs.cache_profile || 'cargo-product',
  inputs.base_sha, inputs.head_sha) }}"
permissions:
  actions: read
  contents: read
concurrency:
  group: benchmark-deno-cargo-rolling-chain
  cancel-in-progress: false
  queue: max
env:
  CACHE_PROFILE: "${{ inputs.cache_profile || 'cargo-product' }}"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: 0
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  source:
    name: Resolve Deno source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: "${{ steps.source.outputs.DENO_BASE_SHA }}"
      head_sha: "${{ steps.source.outputs.DENO_HEAD_SHA }}"
      cache_scope: "${{ steps.scope.outputs.cache_scope }}"
      source_repository: "${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: deno
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Name the rolling cohort
      id: scope
      run: |
        set -euo pipefail
        ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        ref_slug="${ref_slug#-}"
        ref_slug="${ref_slug%-}"
        ref_slug="${ref_slug:-main}"
        echo "cache_scope=rolling-${ref_slug}" >> "$GITHUB_OUTPUT"
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-24.04
  advance:
    name: BoringCache Deno Cargo commit
    needs: source
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-24.04' }}"
    timeout-minutes: 240
    env:
      RESOLVED_BASE_SHA: "${{ github.event_name == 'push' && needs.source.outputs.base_sha
        || inputs.base_sha }}"
      RESOLVED_HEAD_SHA: "${{ github.event_name == 'push' && needs.source.outputs.head_sha
        || inputs.head_sha }}"
      RESOLVED_CACHE_SCOPE: "${{ github.event_name == 'push' && needs.source.outputs.cache_scope
        || inputs.cache_scope }}"
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-24.04' }}"
    steps:
    - name: Start the workflow timer
      id: workflow_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Configure git
      run: |
        git config --global core.symlinks true
        git config --global fetch.parallel 32
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: deno
    - name: Read pinned toolchain
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout adjacent Deno head
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.DENO_SOURCE_REPOSITORY }}"
        ref: "${{ env.RESOLVED_HEAD_SHA }}"
        path: upstream
        fetch-depth: 5
        submodules: false
        persist-credentials: false
    - name: Require one-commit source cadence
      run: |
        set -euo pipefail
        test "$(git -C upstream rev-parse HEAD)" = "$RESOLVED_HEAD_SHA"
        test "$(git -C upstream rev-parse HEAD^)" = "$RESOLVED_BASE_SHA"
        git -C upstream clean -fdx
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Clone submodule ./tests/util/std
      run: git -C upstream submodule update --init --recursive --depth=1 -- ./tests/util/std
    - name: Verify Deno Linux release recipe
      run: "./scripts/verify-upstream-recipe.rb upstream"
    - name: Install Deno snapshot minifier runtime
      uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
      with:
        deno-version: v2.x
    - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
      run: "./scripts/preinstall-deno-rustup.sh"
    - name: Expose Deno's pinned toolchain file
      run: ln -s upstream/rust-toolchain.toml rust-toolchain.toml
    - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Log versions
      run: |
        echo '*** Python'
        command -v python && python --version || echo 'No python found or bad executable'
        echo '*** Rust'
        command -v rustc && rustc --version || echo 'No rustc found or bad executable'
        echo '*** Cargo'
        command -v cargo && cargo --version || echo 'No cargo found or bad executable'
        echo '*** Deno'
        command -v deno && deno --version || echo 'No deno found or bad executable'
        echo '*** Node'
        command -v node && node --version || echo 'No node found or bad executable'
    - name: Configure Deno Linux build environment
      run: "./scripts/setup-deno-linux.sh"
    - name: Select Cargo cache layers
      run: ruby ./scripts/select-deno-cargo-profile.rb "$CACHE_PROFILE"
    - name: Scope the persistent Cargo product chain
      run: ruby ./scripts/scope-boringcache-run.rb "$RESOLVED_CACHE_SCOPE" "$CACHE_PROFILE"
    - name: Configure canary build
      run: echo "DENO_CANARY=true" >> "$GITHUB_ENV"
    - name: Configure frame-pointer panic traces
      run: "./scripts/configure-deno-frame-pointers.sh"
    - name: Require an empty destination
      run: test ! -e upstream/target
    - name: Report disk before release build
      run: df -h
    - name: Start the build timer
      id: build_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Build Deno release binaries through the Cargo product
      id: build_primary
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: publish
        mode: cargo
        working-directory: upstream
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'
    - name: Select Deno's denort_desktop release command
      run: "./scripts/select-deno-cargo-phase.rb desktop"
    - name: Build denort_desktop through the Cargo product
      id: build_desktop
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: publish
        mode: cargo
        working-directory: upstream
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'
    - name: Capture the build timing
      id: build_timing
      env:
        BUILD_STARTED_AT: "${{ steps.build_timer.outputs.started_at }}"
      run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
    - name: Report disk after release build
      run: df -h
    - name: Verify the Deno build
      run: |
        set -euo pipefail
        test -x upstream/target/release/deno
        test -x upstream/target/release/denort
        test -x upstream/target/release/test_server
        test -s upstream/target/release/libdenort.so
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
        cp "${{ steps.build_primary.outputs.evidence-path }}" /tmp/deno-chain-primary-action.json
        cp "${{ steps.build_desktop.outputs.evidence-path }}" /tmp/deno-chain-desktop-action.json
    - name: Write the benchmark phase evidence
      env:
        WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
        BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
        CACHE_HIT: "${{ steps.build_primary.outputs.cache-hit }}"
        EVIDENCE_PATH: "${{ steps.build_primary.outputs.evidence-path }}"
        GITHUB_TOKEN: "${{ github.token }}"
        SOURCE_REPOSITORY: "${{ needs.source.outputs.source_repository }}"
        SOURCE_SHA: "${{ env.RESOLVED_HEAD_SHA }}"
      run: |
        set -euo pipefail
        ruby ./scripts/benchmark-report.rb phase \
          --benchmark deno-cargo \
          --strategy boringcache \
          --lane rolling \
          --phase commit \
          --mode cargo --variant "$CACHE_PROFILE" \
          --build-seconds "$BUILD_SECONDS" --verified-output \
          --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
          --cache-hit "$CACHE_HIT" \
          --source-repository "$SOURCE_REPOSITORY" \
          --source-sha "$SOURCE_SHA" \
          --evidence "$EVIDENCE_PATH"
    - name: Publish the Deno Cargo rolling benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "Deno Cargo rolling benchmark" \
          --input-dir benchmark-results \
          --output-dir benchmark-results
    - name: Retain the Deno Cargo rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-deno-cargo-boringcache-rolling
        path: benchmark-results/deno-cargo-boringcache-rolling.json
        if-no-files-found: error
    - name: Publish rolling run summary
      run: |
        {
          echo "## Deno Cargo rolling run"
          echo "- Cache profile: ${CACHE_PROFILE}"
          echo
          echo "- CLI: \`${{ inputs.cli_version }}\`"
          echo "- Source: \`${RESOLVED_BASE_SHA}\` → \`${RESOLVED_HEAD_SHA}\`"
          echo "- Primary target available before the adjacent build: \`${{ steps.build_primary.outputs.cache-hit }}\`"
          echo "- Desktop target available before the adjacent build: \`${{ steps.build_desktop.outputs.cache-hit }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Retain product evidence
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: deno-cargo-rolling-${{ env.RESOLVED_HEAD_SHA }}
        path: "/tmp/deno-chain-*-action.json"
        if-no-files-found: error
    permissions:
      actions: read
      contents: read
      id-token: write
'on':
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      cache_scope:
        description: Base cache scope published from base_sha; the compiler-only suffix
          is added automatically.
        required: true
        type: string
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Immediate child commit to build and publish as the next seed.
        required: true
        type: string
      cache_profile:
        description: Cargo product caches or native compiler cache only.
        required: false
        type: choice
        options:
        - cargo-product
        - compiler-only
        default: cargo-product
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
