name: Dependency cache update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: run (every runner, recorded) or preflight (GitHub runner only, not recorded)
        type: choice
        options: [run, preflight]
        default: run
      step:
        description: index of the dependency update pair in deps/plan.toml
        type: number
        default: 0
      case:
        description: only this case, for example discourse-bundler (optional)
        type: string
        default: ""

run-name: Dependency cache update step ${{ inputs.step }}${{ inputs.case && format(' {0}', inputs.case) || '' }}${{ inputs.mode == 'preflight' && ' (preflight)' || '' }}

concurrency:
  group: cache-deps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      seed: ${{ steps.matrix.outputs.seed }}
      update: ${{ steps.matrix.outputs.update }}
      verify: ${{ steps.matrix.outputs.verify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            deps
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - id: matrix
        env:
          RUN_ID: ${{ github.run_id }}
          STEP: ${{ inputs.step }}
          PREFLIGHT: ${{ inputs.mode == 'preflight' && 'true' || '' }}
          CASE: ${{ inputs.case }}
        run: bundle exec ruby scripts/deps.rb matrix --run-id "$RUN_ID" --step "$STEP" ${PREFLIGHT:+--preflight} ${CASE:+--case "$CASE"} >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/throughput-cleanup
        with:
          prefix: deps-

  seed:
    needs: plan
    name: "seed: ${{ matrix.case }} · ${{ matrix.machine }} · ${{ matrix.lane }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions: &lane_permissions
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.seed) }}
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
      - uses: ./.github/actions/deps
        with:
          job: ${{ toJSON(matrix) }}

  update:
    needs: [plan, seed]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: "update: ${{ matrix.case }} · ${{ matrix.machine }} · ${{ matrix.lane }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions: *lane_permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.update) }}
    steps: *steps

  verify:
    needs: [plan, update]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: "verify: ${{ matrix.case }} · ${{ matrix.machine }} · ${{ matrix.lane }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    permissions: *lane_permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.verify) }}
    steps: *steps

  cleanup:
    needs: [plan, seed, update, verify]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
      - uses: ./.github/actions/throughput-cleanup
        with:
          prefix: deps-${{ github.run_id }}-

  publish:
    needs: [plan, seed, update, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' && inputs.mode == 'run' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deps-*
          merge-multiple: true
          path: deps/results/${{ github.run_id }}
      - env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deps/results
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Record dependency cache update run $RUN_ID"
          for attempt in 1 2 3 4 5; do
            git push --quiet origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase --quiet origin main
          done
          exit 1
