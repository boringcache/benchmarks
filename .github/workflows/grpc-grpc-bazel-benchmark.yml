---
name: 'grpc: gRPC Bazel Benchmark'
run-name: "gRPC Rolling | ${{ inputs.cli_version }}"
permissions:
  contents: read
  actions: read
concurrency:
  group: benchmark-rolling-grpc-${{ inputs.cache_scope || inputs.series_id || github.ref_name }}
  cancel-in-progress: false
  queue: max
env:
  BENCHMARK_OBSERVATION: "${{ inputs.observation || 'changed-source' }}"
  BORINGCACHE_NO_GIT: 'true'
  BAZEL_OUTPUT_USER_ROOT: "/tmp/boringcache-grpc-bazel/output-root"
  BAZEL_OUTPUT_BASE: "/tmp/boringcache-grpc-bazel/output-base"
  BAZEL_DISK_CACHE: "/tmp/boringcache-grpc-bazel/disk-cache"
  BENCHMARK_ID: "${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}"
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
  BENCHMARK_ROLLING_SCOPE: "${{ inputs.cache_scope }}"
jobs:
  commit:
    name: "${{ matrix.provider }} gRPC Bazel commit"
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: GitHub Actions
          strategy: actions-cache
        - provider: BuildBuddy
          strategy: buildbuddy
        - provider: NativeLink (R2)
          strategy: nativelink
        - provider: BoringCache
          strategy: boringcache
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: grpc
    - uses: "./.github/actions/grpc-bazel-benchmark"
      with:
        strategy: "${{ matrix.strategy }}"
        cache_lane: rolling
        phase: publish
        benchmark_id: "${{ format('grpc-bazel{0}', inputs.benchmark_id_suffix) }}"
        cli_version: "${{ inputs.cli_version }}"
        r2_access_key_id: "${{ matrix.strategy == 'nativelink' && secrets.NATIVELINK_R2_ACCESS_KEY_ID || '' }}"
        r2_secret_access_key: "${{ matrix.strategy == 'nativelink' && secrets.NATIVELINK_R2_SECRET_ACCESS_KEY || '' }}"
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      BUILDBUDDY_API_KEY: "${{ matrix.strategy == 'buildbuddy' && secrets.BUILDBUDDY_API_KEY || '' }}"
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  report:
    name: gRPC Bazel rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: grpc
    - name: Download the benchmark phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-${{ env.BENCHMARK_ID }}-*
        path: phase-evidence
    - name: Publish the gRPC Bazel benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "gRPC Bazel rolling benchmark" \
          --input-dir phase-evidence \
          --output-dir benchmark-results
    - name: Retain the BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-boringcache-rolling
        path: benchmark-results/${{ env.BENCHMARK_ID }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-actions-cache-rolling
        path: benchmark-results/${{ env.BENCHMARK_ID }}-actions-cache-rolling.json
        if-no-files-found: error
    - name: Retain the NativeLink rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-nativelink-rolling
        path: benchmark-results/${{ env.BENCHMARK_ID }}-nativelink-rolling.json
        if-no-files-found: error
    - name: Retain the BuildBuddy rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-buildbuddy-rolling
        path: benchmark-results/${{ env.BENCHMARK_ID }}-buildbuddy-rolling.json
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
'on':
  workflow_dispatch:
    inputs:
      observation:
        description: Seed, identical-source replay, or changed-source build.
        type: string
        default: changed-source
      cache_scope:
        description: Persistent rolling cohort; scheduled runs retain main.
        required: false
        type: string
        default: ''
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        description: Optional suffix for isolated comparison runs.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
