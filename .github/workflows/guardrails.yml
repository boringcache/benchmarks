name: "Benchmark Guardrails"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/guardrails.yml"
      - "README.md"
      - "scripts/**"
      - "test/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/guardrails.yml"
      - "README.md"
      - "scripts/**"
      - "test/**"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark aggregate repo
        uses: actions/checkout@v6
        with:
          path: benchmarks

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"

      - name: Checkout standalone benchmark repos
        working-directory: benchmarks
        env:
          GH_TOKEN: ${{ secrets.BENCHMARKS_READ_TOKEN || github.token }}
          STANDALONE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          BENCHMARK_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p ../benchmarks-repos

          checkout_repo() {
            local repo="$1"
            local target="$2"

            if [[ -n "$STANDALONE_REF" ]]; then
              echo "Trying coordinated branch ${STANDALONE_REF} in ${repo}"
              if gh repo clone "$repo" "$target" -- --branch "$STANDALONE_REF" --single-branch --depth 1; then
                return 0
              fi
              rm -rf -- "$target"
              echo "Falling back to the default branch in ${repo}"
            fi

            gh repo clone "$repo" "$target" -- --depth 1
          }

          gh repo list "$BENCHMARK_OWNER" --limit 300 --json name,nameWithOwner,isArchived,isFork \
            --jq '.[] | select((.name | startswith("benchmark-")) and (.isArchived | not) and (.isFork | not)) | .nameWithOwner' \
            | sort | while IFS= read -r repo; do
            target="../benchmarks-repos/${repo##*/}"
            echo "Checking out ${repo} -> ${target}"
            checkout_repo "$repo" "$target"
          done

      - name: Run benchmark tests
        working-directory: benchmarks
        run: |
          set -euo pipefail
          ruby test/publish_index_test.rb
          ruby test/benchmark_reporting_test.rb
          ruby test/benchmark_registry_alignment_test.rb
          ruby test/benchmark_workflow_guardrails_test.rb
          ruby test/benchmark_report_contract_test.rb
          ruby test/public_benchmark_proof_test.rb
