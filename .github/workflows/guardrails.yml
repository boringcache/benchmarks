---
name: Benchmark Guardrails
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
    - run: bundle install --jobs 4 --retry 2
    - name: Validate cases and suites
      run: bundle exec ruby bin/bench check
    - name: Check publication registry
      run: bundle exec ruby scripts/check-registry-alignment.rb
    - name: Check execution contracts
      run: bundle exec ruby scripts/check-workflow-guardrails.rb
    - name: Check report contracts
      run: bundle exec ruby scripts/check-report-contract.rb
    - name: Run Ruby tests
      run: bundle exec ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require_relative
        file }'
    - uses: ./.github/actions/setup-node
      with:
        node-version: '24'
    - name: Install and audit evidence upload dependencies
      working-directory: .github/actions/retain-product-evidence
      run: |
        npm ci --ignore-scripts
        npm audit --omit=dev
    - name: Check product evidence retention
      run: node --test test/product_evidence_test.cjs
    - name: Lint workflows
      run: |-
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        bundle exec ruby scripts/lint-workflows.rb "$(go env GOPATH)/bin/actionlint"
  runtime:
    name: Prepare harness on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: .harness
        persist-credentials: false
    - uses: ./.harness/.github/actions/prepare-case
      with:
        case-id: obs-studio
    - name: Check the prepared harness and case
      env:
        BUNDLE_GEMFILE: ${{ github.workspace }}/.harness/Gemfile
      run: |
        ruby --version
        bundle exec ruby .harness/bin/bench check obs-studio
        test -f benchmark-context.json
  connect-ci:
    if: github.event_name == 'workflow_dispatch' && inputs.connect_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Install signature verification prerequisite
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - name: Install the released CLI through the official installer
      env:
        BORINGCACHE_VERIFY_SIGNATURE: '1'
      run: |-
        curl -fsSL https://install.boringcache.com/install.sh | sh
        boringcache --version
    - name: Connect GitHub OIDC
      run: boringcache ci connect --oidc-provider github-actions < /dev/null
  qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'hugo-go'
      && !inputs.connect_ci
    uses: "./.github/workflows/native-fresh-benchmark.yml"
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    with:
      case_id: hugo-go
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ inputs.series_id }}"
      sample: "${{ inputs.sample }}"
  qualification-deno:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'deno' && !inputs.connect_ci
    uses: "./.github/workflows/deno-deno-cargo-product.yml"
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      cli_version: "${{ inputs.cli_version }}"
      cache_profile: cargo-product
      series_id: "${{ inputs.series_id }}"
      sample: "${{ inputs.sample }}"
  qualification-docker:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'docker' && !inputs.connect_ci
    uses: "./.github/workflows/docker-cache-proofs.yml"
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    with:
      case_id: cloudcost-exporter-amd64
      ref_key: main
      cache_lane: fresh
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ inputs.series_id }}"
      sample: "${{ inputs.sample }}"
'on':
  workflow_dispatch:
    inputs:
      connect_ci:
        description: Connect this repository to the existing BoringCache workspace
        type: boolean
        default: false
      qualification:
        description: Bounded case qualification using the shared executor
        type: choice
        options:
        - none
        - hugo-go
        - deno
        - docker
        default: none
      cli_version:
        description: Optional exact released CLI or canary
        type: string
        default: ''
      runner_label:
        description: Optional main-branch runner
        type: string
        default: ''
      series_id:
        description: Predeclared series ID
        type: string
        default: ''
      sample:
        description: Declared observation number
        type: string
        default: '1'
  pull_request:
  push:
    branches:
    - main
