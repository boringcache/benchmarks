---
name: Benchmark Guardrails
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.4.4
    - run: bundle install --jobs 4 --retry 2
    - name: Validate cases and suites
      run: bundle exec ruby bin/bench check
    - name: Check publication registry
      run: bundle exec ruby scripts/check-registry-alignment.rb
    - name: Check execution contracts
      run: bundle exec ruby scripts/check-workflow-guardrails.rb
    - name: Check report contracts
      run: bundle exec ruby scripts/check-report-contract.rb
    - name: Run Ruby tests
      run: bundle exec ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require_relative
        file }'
    - name: Lint workflows
      run: |-
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        bundle exec ruby scripts/lint-workflows.rb "$(go env GOPATH)/bin/actionlint"
  connect-ci:
    if: github.event_name == 'workflow_dispatch' && inputs.connect_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Install signature verification prerequisite
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - name: Install the released CLI through the official installer
      env:
        BORINGCACHE_VERIFY_SIGNATURE: '1'
      run: |-
        curl -fsSL https://install.boringcache.com/install.sh | sh
        boringcache --version
    - name: Connect GitHub OIDC
      run: boringcache ci connect --oidc-provider github-actions < /dev/null
  qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'hugo-go'
      && !inputs.connect_ci
    uses: "./.github/workflows/native-fresh-benchmark.yml"
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      case_id: hugo-go
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ inputs.series_id }}"
      sample: "${{ inputs.sample }}"
'on':
  workflow_dispatch:
    inputs:
      connect_ci:
        description: Connect this repository to the existing BoringCache workspace
        type: boolean
        default: false
      qualification:
        description: Bounded case qualification using the shared executor
        type: choice
        options:
        - none
        - hugo-go
        default: none
      cli_version:
        description: Optional exact released CLI or canary
        type: string
        default: ''
      runner_label:
        description: Optional main-branch runner
        type: string
        default: ''
      series_id:
        description: Predeclared series ID
        type: string
        default: ''
      sample:
        description: Declared observation number
        type: string
        default: '1'
  pull_request:
  push:
    branches:
    - main
