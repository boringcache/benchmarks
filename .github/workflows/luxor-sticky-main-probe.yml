name: Luxor sticky disk default-branch probe

on:
  push:
    branches: [main]
    paths: [.github/workflows/luxor-sticky-main-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luxor-sticky-main-probe

jobs:
  write:
    name: luxor sticky disk write
    runs-on: luxor-ubuntu-small-2c-4g
    timeout-minutes: 10
    outputs:
      marker: ${{ steps.mark.outputs.marker }}
    steps:
      - id: disk
        uses: LuxorLabs/stickydisk@3a52fa83275bcafc0953ab1afed6ca137718eced # v1.0.10
        with:
          key: main-publish-probe
          path: ~/.cache/main-publish-probe
      - id: mark
        env:
          MOUNTED: ${{ steps.disk.outputs.mounted }}
          SOURCE: ${{ steps.disk.outputs.source }}
          GENERATION: ${{ steps.disk.outputs.generation }}
        run: |
          dir="$HOME/.cache/main-publish-probe"
          echo "ref=$GITHUB_REF event=$GITHUB_EVENT_NAME mounted=$MOUNTED source=$SOURCE generation=$GENERATION"
          findmnt -T "$dir" || true
          ls -la "$dir"
          cat "$dir/marker" 2>/dev/null || echo "no earlier marker"
          marker="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "$marker" > "$dir/marker"
          sync
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      - if: always()
        run: |
          for file in "$RUNNER_TEMP"/_runner_file_commands/step_summary_*; do
            [ -s "$file" ] && { echo "== $(basename "$file")"; cat "$file"; }
          done
          true

  read:
    name: luxor sticky disk read
    needs: write
    runs-on: luxor-ubuntu-small-2c-4g
    timeout-minutes: 10
    steps:
      - id: disk
        uses: LuxorLabs/stickydisk@3a52fa83275bcafc0953ab1afed6ca137718eced # v1.0.10
        with:
          key: main-publish-probe
          path: ~/.cache/main-publish-probe
          commit: never
      - env:
          MOUNTED: ${{ steps.disk.outputs.mounted }}
          SOURCE: ${{ steps.disk.outputs.source }}
          GENERATION: ${{ steps.disk.outputs.generation }}
          EXPECTED: ${{ needs.write.outputs.marker }}
        run: |
          dir="$HOME/.cache/main-publish-probe"
          echo "ref=$GITHUB_REF event=$GITHUB_EVENT_NAME mounted=$MOUNTED source=$SOURCE generation=$GENERATION"
          ls -la "$dir"
          found=$(cat "$dir/marker" 2>/dev/null || true)
          echo "expected=$EXPECTED found=${found:-none}"
          if [ "$found" = "$EXPECTED" ]; then
            echo "The disk written by the previous job on the default branch was published."
          else
            echo "::warning::The read job did not see the marker written by the previous job."
          fi

      - if: always()
        run: |
          for file in "$RUNNER_TEMP"/_runner_file_commands/step_summary_*; do
            [ -s "$file" ] && { echo "== $(basename "$file")"; cat "$file"; }
          done
          true
