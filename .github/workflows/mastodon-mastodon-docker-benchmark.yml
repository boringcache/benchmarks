---
name: 'mastodon: Mastodon Docker Benchmark'
run-name: "${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary'
  || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual
  dispatch ({0})', github.ref_name)) }}"
concurrency:
  group: benchmark-provider-comparisons
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  actions: read
  packages: write
env:
  BORINGCACHE_NO_GIT: 'true'
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  commit:
    name: "${{ matrix.provider }} ${{ matrix.case }} commit"
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: GitHub Actions
          case: Mastodon server
          strategy: actions-cache
          workload: server
          benchmark_id: mastodon
          docker_tool_cache: false
        - provider: BoringCache
          case: Mastodon server
          strategy: boringcache
          workload: server
          benchmark_id: mastodon
          docker_tool_cache: false
        - provider: BoringCache
          case: Mastodon server sccache
          strategy: boringcache
          workload: server
          benchmark_id: mastodon-sccache
          docker_tool_cache: true
        - provider: GitHub Actions
          case: Mastodon streaming
          strategy: actions-cache
          workload: streaming
          benchmark_id: mastodon-streaming
          docker_tool_cache: false
        - provider: BoringCache
          case: Mastodon streaming
          strategy: boringcache
          workload: streaming
          benchmark_id: mastodon-streaming
          docker_tool_cache: false
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: mastodon
    - uses: "./.github/actions/mastodon-docker-benchmark"
      with:
        strategy: "${{ matrix.strategy }}"
        workload: "${{ matrix.workload }}"
        cache_lane: rolling
        phase: publish
        benchmark_id: "${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix)
          }}"
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
        docker_tool_cache: "${{ matrix.docker_tool_cache }}"
        upstream_ref: "${{ inputs.upstream_ref }}"
        push_image: 'true'
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  report:
    name: Mastodon Docker rolling report
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: mastodon
    - name: Download the benchmark phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-*
        path: phase-evidence
    - name: Publish the Mastodon Docker benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "Mastodon Docker rolling benchmark" \
          --input-dir phase-evidence \
          --output-dir benchmark-results
    - name: Retain the mastodon BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-mastodon${{ inputs.benchmark_id_suffix }}-boringcache-rolling
        path: benchmark-results/mastodon${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the mastodon GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-mastodon${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
        path: benchmark-results/mastodon${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
        if-no-files-found: error
    - name: Retain the mastodon-sccache BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-mastodon-sccache${{ inputs.benchmark_id_suffix }}-boringcache-rolling
        path: benchmark-results/mastodon-sccache${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the mastodon-streaming BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-mastodon-streaming${{ inputs.benchmark_id_suffix }}-boringcache-rolling
        path: benchmark-results/mastodon-streaming${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the mastodon-streaming GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-mastodon-streaming${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
        path: benchmark-results/mastodon-streaming${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
'on':
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: Optional managed BoringCache BuildKit image.
        required: false
        type: string
        default: ''
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        description: Optional suffix for isolated comparison runs.
        required: false
        type: string
        default: ''
      upstream_ref:
        description: Optional Mastodon ref or SHA instead of the pinned submodule
          commit.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
