name: 'n8n: n8n Docker Benchmark'
run-name: "${{ format('Benchmark {0} | {1}', inputs.cli_version != '' && 'Canary'
  || 'Rolling', github.event_name == 'push' && 'Upstream update' || format('Manual
  dispatch ({0})', github.ref_name)) }}"
concurrency:
  group: benchmark-provider-comparisons
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  packages: write
env:
  BORINGCACHE_NO_GIT: 'true'
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  publish:
    name: "${{ matrix.provider }} ${{ matrix.case_name }} commit"
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - provider: GitHub Actions
          strategy: actions-cache
          case_name: n8n
          benchmark_id: n8n-docker
          dockerfile_path: upstream/docker/images/n8n/Dockerfile
          image: n8n-benchmark
        - provider: GitHub Actions
          strategy: actions-cache
          case_name: runners
          benchmark_id: n8n-runners
          dockerfile_path: upstream/docker/images/runners/Dockerfile
          image: n8n-runners-benchmark
        - provider: GitHub Actions
          strategy: actions-cache
          case_name: distroless
          benchmark_id: n8n-runners-distroless
          dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
          image: n8n-runners-distroless-benchmark
        - provider: BoringCache
          strategy: boringcache
          case_name: n8n
          benchmark_id: n8n-docker
          dockerfile_path: upstream/docker/images/n8n/Dockerfile
          image: n8n-benchmark
        - provider: BoringCache
          strategy: boringcache
          case_name: runners
          benchmark_id: n8n-runners
          dockerfile_path: upstream/docker/images/runners/Dockerfile
          image: n8n-runners-benchmark
        - provider: BoringCache
          strategy: boringcache
          case_name: distroless
          benchmark_id: n8n-runners-distroless
          dockerfile_path: upstream/docker/images/runners/Dockerfile.distroless
          image: n8n-runners-distroless-benchmark
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Set up benchmark Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.4.4
        working-directory: ".harness"
    - name: Install benchmark dependencies
      working-directory: ".harness"
      run: bundle install --jobs 4 --retry 2
    - name: Prepare declared case
      env:
        BENCHMARK_CASE_ID: n8n
        BUNDLE_GEMFILE: "${{ github.workspace }}/.harness/Gemfile"
      run: ruby .harness/bin/bench prepare "$BENCHMARK_CASE_ID" --directory "$GITHUB_WORKSPACE"
    - uses: "./.github/actions/n8n-docker-benchmark"
      with:
        strategy: "${{ matrix.strategy }}"
        cache_lane: rolling
        phase: publish
        benchmark_id: "${{ format('{0}{1}', matrix.benchmark_id, inputs.benchmark_id_suffix)
          }}"
        push_image: 'true'
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
        dockerfile_path: "${{ matrix.dockerfile_path }}"
        image: "${{ matrix.image }}"
        node_version: 26.7.0
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  report:
    name: n8n Docker rolling report
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Set up benchmark Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        ruby-version: 3.4.4
        working-directory: ".harness"
    - name: Install benchmark dependencies
      working-directory: ".harness"
      run: bundle install --jobs 4 --retry 2
    - name: Prepare declared case
      env:
        BENCHMARK_CASE_ID: n8n
        BUNDLE_GEMFILE: "${{ github.workspace }}/.harness/Gemfile"
      run: ruby .harness/bin/bench prepare "$BENCHMARK_CASE_ID" --directory "$GITHUB_WORKSPACE"
    - name: Download the benchmark phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-*
        path: phase-evidence
    - name: Publish the n8n Docker benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "n8n Docker rolling benchmark" \
          --input-dir phase-evidence \
          --output-dir benchmark-results
    - name: Retain the n8n-docker BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-n8n-docker${{ inputs.benchmark_id_suffix }}-boringcache-rolling
        path: benchmark-results/n8n-docker${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the n8n-docker GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-n8n-docker${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
        path: benchmark-results/n8n-docker${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
        if-no-files-found: error
    - name: Retain the n8n-runners BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-n8n-runners${{ inputs.benchmark_id_suffix }}-boringcache-rolling
        path: benchmark-results/n8n-runners${{ inputs.benchmark_id_suffix }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the n8n-runners GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-n8n-runners${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
        path: benchmark-results/n8n-runners${{ inputs.benchmark_id_suffix }}-actions-cache-rolling.json
        if-no-files-found: error
    - name: Retain the n8n-runners-distroless BoringCache rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-n8n-runners-distroless${{ inputs.benchmark_id_suffix }}-boringcache-rolling
        path: benchmark-results/n8n-runners-distroless${{ inputs.benchmark_id_suffix
          }}-boringcache-rolling.json
        if-no-files-found: error
    - name: Retain the n8n-runners-distroless GitHub Actions rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-n8n-runners-distroless${{ inputs.benchmark_id_suffix }}-actions-cache-rolling
        path: benchmark-results/n8n-runners-distroless${{ inputs.benchmark_id_suffix
          }}-actions-cache-rolling.json
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
'on':
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: Optional managed BoringCache BuildKit image.
        required: false
        type: string
        default: ''
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        description: Optional suffix for an isolated comparison run.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
  push:
    branches:
    - main
    paths:
    - cases/n8n/**
    - adapters/**
    - scripts/canonical/**
    - ".github/workflows/n8n-n8n-docker-benchmark.yml"
