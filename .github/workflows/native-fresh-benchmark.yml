---
name: Native comparison fresh
run-name: "${{ inputs.case_id }} ${{ inputs.cadence == 'nightly' && 'Nightly' || 'Fresh' }} | ${{ inputs.cli_version }}"
permissions:
  contents: read
  actions: read
  packages: read
env:
  BORINGCACHE_EPHEMERAL_PRIVILEGED_RUNNER: ${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/benchmark-') && inputs.expected_identity != '' && fromJSON(inputs.expected_identity).harness_sha == github.sha)) && contains(fromJSON('["depot-ubuntu-24.04-4","depot-ubuntu-24.04-8","namespace-profile-buildkit-4c","namespace-profile-buildkit-8c"]'), inputs.runner_label) && '1' || '' }}
  BENCHMARK_EXPECTED_IDENTITY: "${{ inputs.expected_identity }}"
  BORINGCACHE_NO_GIT: 'true'
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  cold:
    name: "${{ matrix.provider }} ${{ inputs.case_id }} cold"
    if: inputs.runner_label == '' || (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/benchmark-') && inputs.expected_identity != '' && fromJSON(inputs.expected_identity).harness_sha == github.sha)))
    runs-on: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/benchmark-') && inputs.expected_identity != '' && fromJSON(inputs.expected_identity).harness_sha == github.sha))
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 120
    outputs:
      cache_scope: "${{ steps.benchmark.outputs.cache_scope }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.provider == 'boringcache' && '[{"provider":"BoringCache","strategy":"boringcache"}]' || inputs.provider == 'actions-cache' && '[{"provider":"GitHub Actions","strategy":"actions-cache"}]' || '[{"provider":"GitHub Actions","strategy":"actions-cache"},{"provider":"BoringCache","strategy":"boringcache"}]') }}
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: "${{ inputs.case_id }}"
        native-lane: fresh
        suffix: "${{ inputs.benchmark_id_suffix }}"
        variant: "${{ inputs.variant }}"
    - id: benchmark
      uses: "./.github/actions/benchmark-phase"
      with:
        strategy: "${{ matrix.strategy }}"
        cache_lane: fresh
        phase: publish
        benchmark_id: "${{ env.BENCHMARK_ID }}"
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
        cli_platform: "${{ inputs.cli_platform }}"
        report_variant: "${{ inputs.variant }}"
    - name: Retain the runner and builder environment
      if: always() && inputs.runner_label != ''
      uses: ./.harness/.github/actions/runner-evidence
      with:
        phase: cold
        provider: ${{ matrix.strategy }}
        runner: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/benchmark-') && inputs.expected_identity != '' && fromJSON(inputs.expected_identity).harness_sha == github.sha)) && inputs.runner_label || 'ubuntu-latest' }}"
  warm:
    name: "${{ matrix.provider }} ${{ inputs.case_id }} warm"
    needs: cold
    runs-on: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/benchmark-') && inputs.expected_identity != '' && fromJSON(inputs.expected_identity).harness_sha == github.sha))
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.provider == 'boringcache' && '[{"provider":"BoringCache","strategy":"boringcache"}]' || inputs.provider == 'actions-cache' && '[{"provider":"GitHub Actions","strategy":"actions-cache"}]' || '[{"provider":"GitHub Actions","strategy":"actions-cache"},{"provider":"BoringCache","strategy":"boringcache"}]') }}
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: "${{ inputs.case_id }}"
        native-lane: fresh
        suffix: "${{ inputs.benchmark_id_suffix }}"
        variant: "${{ inputs.variant }}"
    - uses: "./.github/actions/benchmark-phase"
      with:
        strategy: "${{ matrix.strategy }}"
        cache_lane: fresh
        phase: warm
        cache_scope: "${{ needs.cold.outputs.cache_scope }}"
        benchmark_id: "${{ env.BENCHMARK_ID }}"
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
        cli_platform: "${{ inputs.cli_platform }}"
        report_variant: "${{ inputs.variant }}"
    - name: Retain the runner and builder environment
      if: always() && inputs.runner_label != ''
      uses: ./.harness/.github/actions/runner-evidence
      with:
        phase: warm
        provider: ${{ matrix.strategy }}
        runner: ${{ inputs.runner_label }}
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || (startsWith(github.ref, 'refs/tags/benchmark-') && inputs.expected_identity != '' && fromJSON(inputs.expected_identity).harness_sha == github.sha)) && inputs.runner_label || 'ubuntu-latest' }}"
  report:
    name: "${{ inputs.case_id }} fresh report"
    needs:
    - cold
    - warm
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        working-directory: ".harness"
    - run: bundle install --jobs 4 --retry 2
      working-directory: ".harness"
    - name: Download the benchmark phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-*
        path: phase-evidence
    - name: Download phase outcomes
      if: always()
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: outcome-*
        path: phase-evidence
    - name: Download post-publication storage measurements
      if: always()
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: storage-*
        path: phase-evidence
    - name: Generate the benchmark report
      if: always()
      env:
        GH_TOKEN: "${{ github.token }}"
        CASE_ID: "${{ inputs.case_id }}"
        PROVIDER: "${{ inputs.provider }}"
        JOB_PREFIX: "${{ inputs.job_prefix }}"
        VARIANT: "${{ inputs.variant }}"
        BENCHMARK_SUFFIX: "${{ inputs.benchmark_id_suffix }}"
        BUNDLE_GEMFILE: "${{ github.workspace }}/.harness/Gemfile"
      run: ruby .harness/scripts/fresh-report.rb report
    - name: Retain run manifest and report
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: fresh-run-report-${{ inputs.case_id }}${{ inputs.benchmark_id_suffix }}${{ inputs.variant != '' && format('-{0}',
          inputs.variant) || '' }}
        path: benchmark-results/
        if-no-files-found: error
    - name: Retain the BoringCache fresh result
      if: always() && hashFiles('benchmark-results/*-boringcache*-fresh.json') !=
        ''
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-boringcache${{ env.BENCHMARK_VARIANT_SUFFIX
          }}-fresh
        path: benchmark-results/${{ env.BENCHMARK_ID }}-boringcache${{ env.BENCHMARK_VARIANT_SUFFIX
          }}-fresh.json
        if-no-files-found: error
    - name: Retain the GitHub Actions fresh result
      if: always() && hashFiles('benchmark-results/*-actions-cache*-fresh.json') !=
        ''
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-${{ env.BENCHMARK_ID }}-actions-cache${{ env.BENCHMARK_VARIANT_SUFFIX
          }}-fresh
        path: benchmark-results/${{ env.BENCHMARK_ID }}-actions-cache${{ env.BENCHMARK_VARIANT_SUFFIX
          }}-fresh.json
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
'on':
  workflow_dispatch:
    inputs:
      provider:
        description: Run both providers or one diagnostic arm.
        type: choice
        options: [both, boringcache, actions-cache]
        default: both
      expected_identity:
        description: Frozen scheduled harness and case identity; checked before preparation.
        type: string
        required: false
        default: ''
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
      case_id:
        description: Reviewed case ID
        required: true
        type: string
      buildkit_image:
        description: Optional managed BuildKit image
        required: false
        type: string
        default: ''
      cli_platform:
        description: Optional CLI package platform
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        description: Optional diagnostic result suffix
        required: false
        type: string
        default: ''
      variant:
        type: string
        required: false
        default: ''
        description: Reviewed native workload variant; required when the case declares
          variants.
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
  workflow_call:
    inputs:
      job_prefix:
        description: Parent project job label used to reconcile only this selection.
        type: string
        default: ''
      provider:
        description: both, boringcache, or actions-cache.
        type: string
        default: both
      expected_identity:
        description: Frozen scheduled harness and case identity; checked before preparation.
        type: string
        required: false
        default: ''
      cli_version:
        required: false
        type: string
        default: ''
      runner_label:
        required: false
        type: string
        default: ''
      series_id:
        type: string
        required: false
        default: ''
      sample:
        type: string
        required: false
        default: '1'
      case_id:
        required: true
        type: string
      buildkit_image:
        required: false
        type: string
        default: ''
      cli_platform:
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        required: false
        type: string
        default: ''
      variant:
        type: string
        required: false
        default: ''
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
