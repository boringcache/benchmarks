name: Canary Benchmarks
run-name: Canary benchmark results
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-canary-results
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
    - run: bundle install --jobs 4 --retry 2
    - name: Check repository canaries
      env:
        CADENCE_ACTIVE: ${{ vars.BENCHMARK_CADENCE_ACTIVE }}
      run: |
        if [[ "$CADENCE_ACTIVE" == true ]]; then
          failed=0
          for channel in canary stable; do
            bundle exec ruby scripts/benchmark-cadence.rb --collect --channel "$channel" \
              --summary "$RUNNER_TEMP/$channel-summary.md" \
              --output "$RUNNER_TEMP/benchmark-outcomes-$channel.json" || failed=1
            cat "$RUNNER_TEMP/$channel-summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
        else
          bundle exec ruby scripts/nightly-canaries.rb --collect --summary "$GITHUB_STEP_SUMMARY" --output "$RUNNER_TEMP/benchmark-outcomes.json"
        fi
    - name: Retain collected outcomes
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-outcomes
        path: ${{ runner.temp }}/benchmark-outcomes*.json
        if-no-files-found: error
'on':
  schedule:
  - cron: 47 * * * *
  workflow_dispatch:
