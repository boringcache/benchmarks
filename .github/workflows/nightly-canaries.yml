name: Benchmark cadence monitor
run-name: Benchmark cadence results
permissions:
  contents: read
  actions: read
concurrency:
  group: nightly-canary-results
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
    - run: bundle install --jobs 4 --retry 2
    - name: Check repository canaries
      run: |
        failed=0
        for cadence in daily weekly; do
          bundle exec ruby scripts/benchmark-cadence.rb --collect --cadence "$cadence" \
            --summary "$RUNNER_TEMP/$cadence-summary.md" \
            --output "$RUNNER_TEMP/benchmark-outcomes-$cadence.json" || failed=1
          cat "$RUNNER_TEMP/$cadence-summary.md" >> "$GITHUB_STEP_SUMMARY"
        done
        bundle exec ruby scripts/rolling-monitor.rb \
          --summary "$RUNNER_TEMP/rolling-summary.md" \
          --output "$RUNNER_TEMP/benchmark-outcomes-rolling.json" || failed=1
        cat "$RUNNER_TEMP/rolling-summary.md" >> "$GITHUB_STEP_SUMMARY"
        exit "$failed"
    - name: Retain collected outcomes
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-outcomes
        path: ${{ runner.temp }}/benchmark-outcomes*.json
        if-no-files-found: error
'on':
  schedule:
  - cron: 47 * * * *
  workflow_dispatch:
