---
name: OBS Studio comparison rolling
run-name: obs-studio ${{ inputs.cache_tool }} rolling ${{ inputs.series_id }} sample
  ${{ inputs.sample }}
'on':
  workflow_dispatch:
    inputs:
      cache_tool:
        type: choice
        options:
        - ccache
        - xcode
        - all
        default: all
      cli_version:
        type: string
        default: ''
      series_id:
        type: string
        default: ''
      sample:
        type: string
        default: '1'
      cache_scope:
        type: string
        default: ''
      base_sha:
        type: string
        default: ''
      head_sha:
        type: string
        default: ''
      runner_label:
        type: string
        default: ''
permissions:
  actions: read
  contents: read
env:
  BENCHMARK_ID: obs-studio-compiler-cache
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
  CACHE_COHORT: "${{ inputs.cache_scope || inputs.series_id || github.ref_name }}"
concurrency:
  group: benchmark-obs-rolling-${{ inputs.cache_scope || inputs.series_id || github.ref_name
    }}
  cancel-in-progress: false
  queue: max
jobs:
  actions-cache-ccache:
    name: GitHub Actions obs-studio ccache commit
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-26.04' }}"
    timeout-minutes: 120
    env:
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_BASEDIR: "${{ github.workspace }}/upstream"
      CCACHE_NOHASHDIR: '1'
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: "${{ github.workspace }}/.ccache-stats.log"
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-26.04' }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare rolling source
      run: "./scripts/prepare-source.sh rolling"
    - name: Install the upstream Linux build shell
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
        brew install --quiet zsh
    - name: Install the benchmark ccache release
      run: "./scripts/install-ccache.sh"
    - name: Start cache restore timing
      id: restore_start
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore ccache directory
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |-
          .ccache
          .rolling-seed.json
        key: gha-obs-ccache-${{ env.CACHE_COHORT }}-${{ runner.os }}-${{ runner.arch
          }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: gha-obs-ccache-${{ env.CACHE_COHORT }}-${{ runner.os }}-${{
          runner.arch }}-
      id: cache-restore
    - name: Capture cache restore timing
      id: restore
      run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Retain the previous cache source
      run: if [[ -f .rolling-seed.json ]]; then cp .rolling-seed.json benchmark-results/previous-cache-source.json;
        fi
    - name: Build rolling commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/ccache-actions-cache-rolling-timing.json -- ruby ./scripts/run-benchmark-plan.rb ccache --working-directory upstream \
          2>&1 | tee benchmark-results/ccache-actions-cache-rolling.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/ccache-actions-cache-rolling-timing.json >> "$GITHUB_OUTPUT"
    - name: Capture and verify ccache evidence
      run: |
        ccache --print-log-stats --format=json > benchmark-results/ccache-actions-cache-rolling-native.json
        ./scripts/verify_ccache_evidence.rb \
          --path benchmark-results/ccache-actions-cache-rolling-native.json \
          --phase commit \
          --strategy actions-cache
    - name: Record the verified cache source
      env:
        SOURCE_SHA: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
      run: 'ruby -rjson -e ''File.write(".rolling-seed.json", JSON.pretty_generate({source_sha:
        ENV.fetch("SOURCE_SHA"), run_id: ENV.fetch("GITHUB_RUN_ID"), run_attempt:
        ENV.fetch("GITHUB_RUN_ATTEMPT")}))'''
    - name: Publish the verified ccache cache
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: "${{ steps.cache-restore.outputs.cache-primary-key }}"
        path: |-
          .ccache
          .rolling-seed.json
    - name: Write rolling result
      env:
        GITHUB_TOKEN: "${{ github.token }}"
        RESTORED_CACHE_HIT: "${{ steps.cache-restore.outputs.cache-matched-key !=
          '' }}"
      run: |
        ./scripts/write_phase_result.rb \
          --surface ccache \
          --strategy actions-cache \
          --phase rolling --continuous --cache-hit "$RESTORED_CACHE_HIT" \
          --source-sha "${{ steps.source.outputs.OBS_HEAD_SHA }}" \
          --restore-seconds "${{ steps.restore.outputs.seconds }}" \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --cache-key "${{ steps.cache-restore.outputs.cache-matched-key }}" \
          --native-evidence benchmark-results/ccache-actions-cache-rolling-native.json
    - name: Upload rolling result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-obs-studio-actions-cache-ccache-rolling-commit
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: inputs.cache_tool != 'xcode' && (inputs.runner_label == '' || github.ref_name
      == 'main')
  actions-cache-xcode:
    name: GitHub Actions obs-studio xcode commit
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODE_CAS_PATH: "${{ github.workspace }}/.xcode-compilation-cache"
      OBS_BASELINE_DERIVED_DATA_PATH: "${{ github.workspace }}/.xcode-derived-data"
      BENCHMARK_RUNNER_CLASS: macos-26
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare rolling source
      run: "./scripts/prepare-source.sh rolling"
    - name: Start cache restore timing
      id: restore_start
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore Xcode compilation cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |-
          .xcode-compilation-cache
          .rolling-seed.json
        key: gha-obs-xcode-${{ env.CACHE_COHORT }}-${{ runner.os }}-${{ runner.arch
          }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: gha-obs-xcode-${{ env.CACHE_COHORT }}-${{ runner.os }}-${{ runner.arch
          }}-
      id: cache-restore
    - name: Capture cache restore timing
      id: restore
      run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Retain the previous cache source
      run: if [[ -f .rolling-seed.json ]]; then cp .rolling-seed.json benchmark-results/previous-cache-source.json;
        fi
    - name: Select upstream's pinned Xcode
      run: sudo xcode-select --switch "${{ steps.source.outputs.OBS_XCODE_PATH }}"
    - name: Build rolling commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/xcode-actions-cache-rolling-timing.json -- ruby ./scripts/run-benchmark-plan.rb xcode --working-directory upstream \
          2>&1 | tee benchmark-results/xcode-actions-cache-rolling.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/xcode-actions-cache-rolling-timing.json >> "$GITHUB_OUTPUT"
    - name: Require native Xcode build evidence
      run: "./scripts/verify_xcode_build_log.rb benchmark-results/xcode-actions-cache-rolling.log"
    - name: Record the verified cache source
      env:
        SOURCE_SHA: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
      run: 'ruby -rjson -e ''File.write(".rolling-seed.json", JSON.pretty_generate({source_sha:
        ENV.fetch("SOURCE_SHA"), run_id: ENV.fetch("GITHUB_RUN_ID"), run_attempt:
        ENV.fetch("GITHUB_RUN_ATTEMPT")}))'''
    - name: Publish the verified xcode cache
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: "${{ steps.cache-restore.outputs.cache-primary-key }}"
        path: |-
          .xcode-compilation-cache
          .rolling-seed.json
    - name: Write rolling result
      env:
        GITHUB_TOKEN: "${{ github.token }}"
        RESTORED_CACHE_HIT: "${{ steps.cache-restore.outputs.cache-matched-key !=
          '' }}"
      run: |
        ./scripts/write_phase_result.rb \
          --surface xcode \
          --strategy actions-cache \
          --phase rolling --continuous --cache-hit "$RESTORED_CACHE_HIT" \
          --source-sha "${{ steps.source.outputs.OBS_HEAD_SHA }}" \
          --restore-seconds "${{ steps.restore.outputs.seconds }}" \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --cache-key "${{ steps.cache-restore.outputs.cache-matched-key }}"
    - name: Upload rolling result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-obs-studio-actions-cache-xcode-rolling-commit
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
      if: always()
    if: inputs.cache_tool != 'ccache' && (inputs.runner_label == '' || github.ref_name
      == 'main')
  boringcache-ccache:
    name: BoringCache obs-studio ccache commit
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-26.04' }}"
    timeout-minutes: 120
    env:
      CCACHE_DIR: "${{ github.workspace }}/.boringcache-local-ccache"
      CCACHE_BASEDIR: "${{ github.workspace }}/upstream"
      CCACHE_NOHASHDIR: '1'
      CCACHE_COMPILERCHECK: content
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-26.04' }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare rolling source and matching cache plan
      run: |
        ./scripts/prepare-source.sh rolling
        ruby scripts/scope-case-cache.rb "obs-studio-$CACHE_COHORT"
    - name: Install the upstream Linux build shell
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
        brew install --quiet zsh
    - name: Install the benchmark ccache release
      run: "./scripts/install-ccache.sh"
    - name: Start cache setup timing
      id: restore_start
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore and publish BoringCache ccache
      id: cache
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: publish
        mode: ccache
        working-directory: "./upstream"
    - name: Capture cache setup timing
      id: restore
      run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Build rolling commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/ccache-boringcache-rolling-timing.json -- ruby ./scripts/run-benchmark-plan.rb ccache --working-directory upstream \
          2>&1 | tee benchmark-results/ccache-boringcache-rolling.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/ccache-boringcache-rolling-timing.json >> "$GITHUB_OUTPUT"
    - name: Capture and verify native remote evidence
      run: |
        ccache --print-log-stats --format=json > benchmark-results/ccache-boringcache-rolling-native.json
        ./scripts/verify_ccache_evidence.rb \
          --path benchmark-results/ccache-boringcache-rolling-native.json \
          --phase commit \
          --strategy boringcache
    - name: Write rolling result
      run: |
        ./scripts/write_phase_result.rb \
          --surface ccache \
          --strategy boringcache \
          --phase rolling --continuous --cache-hit "$RESTORED_CACHE_HIT" \
          --source-sha "${{ steps.source.outputs.OBS_HEAD_SHA }}" \
          --restore-seconds "${{ steps.restore.outputs.seconds }}" \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --action-evidence "${{ steps.cache.outputs.evidence-path }}" \
          --native-evidence benchmark-results/ccache-boringcache-rolling-native.json
      env:
        RESTORED_CACHE_HIT: "${{ steps.cache.outputs.cache-hit }}"
    - name: Upload rolling result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-obs-studio-boringcache-ccache-rolling-commit
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
      if: always()
    - name: Retain BoringCache product evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: boringcache-product-ccache-rolling
        path: "${{ steps.cache.outputs.evidence-path }}"
        if-no-files-found: error
        retention-days: 30
      if: always()
    permissions:
      actions: read
      contents: read
      id-token: write
    if: inputs.cache_tool != 'xcode' && (inputs.runner_label == '' || github.ref_name
      == 'main')
  boringcache-xcode:
    name: BoringCache obs-studio xcode commit
    if: inputs.cache_tool != 'ccache' && (inputs.runner_label == '' || github.ref_name
      == 'main')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare rolling source and matching Xcode cohort
      run: |
        ./scripts/prepare-source.sh rolling
        ruby scripts/scope-case-cache.rb "obs-studio-$CACHE_COHORT"
        sudo xcode-select --switch "${{ steps.source.outputs.OBS_XCODE_PATH }}"
    - name: Start cache setup timing
      id: restore_start
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore and publish BoringCache xcode
      id: cache
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        trust-policy: publish
        mode: xcode
        working-directory: "./upstream"
    - name: Capture cache setup timing
      id: restore
      run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Build rolling commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/xcode-boringcache-rolling-timing.json -- ruby ./scripts/run-benchmark-plan.rb xcode --working-directory upstream \
          2>&1 | tee benchmark-results/xcode-boringcache-rolling.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/xcode-boringcache-rolling-timing.json >> "$GITHUB_OUTPUT"
    - name: Require native Xcode build evidence
      run: "./scripts/verify_xcode_build_log.rb benchmark-results/xcode-boringcache-rolling.log"
    - name: Write rolling result
      run: |
        ./scripts/write_phase_result.rb \
          --surface xcode \
          --strategy boringcache \
          --phase rolling --continuous --cache-hit "$RESTORED_CACHE_HIT" \
          --source-sha "${{ steps.source.outputs.OBS_HEAD_SHA }}" \
          --restore-seconds "${{ steps.restore.outputs.seconds }}" \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --action-evidence "${{ steps.cache.outputs.evidence-path }}"
      env:
        RESTORED_CACHE_HIT: "${{ steps.cache.outputs.cache-hit }}"
    - name: Upload rolling result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-obs-studio-boringcache-xcode-rolling-commit
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
      if: always()
    - name: Retain BoringCache product evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: boringcache-product-xcode-rolling
        path: "${{ steps.cache.outputs.evidence-path }}"
        if-no-files-found: error
        retention-days: 30
      if: always()
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: macos-26
  report:
    name: obs-studio rolling report
    needs:
    - actions-cache-ccache
    - actions-cache-xcode
    - boringcache-ccache
    - boringcache-xcode
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
    - name: Download verified phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-obs-studio-*
        path: phase-evidence
    - name: Generate the benchmark report
      env:
        REPORT_TITLE: obs-studio rolling benchmark
      run: ruby scripts/canonical/benchmark-report.rb summarize --title "$REPORT_TITLE"
        --input-dir phase-evidence --output-dir benchmark-results
    - name: Retain actions-cache ccache result
      if: inputs.cache_tool == 'all' || inputs.cache_tool == 'ccache'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-obs-studio-actions-cache-ccache-rolling
        path: benchmark-results/obs-studio-actions-cache-ccache-rolling.json
        if-no-files-found: error
        retention-days: 90
    - name: Retain actions-cache xcode result
      if: inputs.cache_tool == 'all' || inputs.cache_tool == 'xcode'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-obs-studio-actions-cache-xcode-rolling
        path: benchmark-results/obs-studio-actions-cache-xcode-rolling.json
        if-no-files-found: error
        retention-days: 90
    - name: Retain boringcache ccache result
      if: inputs.cache_tool == 'all' || inputs.cache_tool == 'ccache'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-obs-studio-boringcache-ccache-rolling
        path: benchmark-results/obs-studio-boringcache-ccache-rolling.json
        if-no-files-found: error
        retention-days: 90
    - name: Retain boringcache xcode result
      if: inputs.cache_tool == 'all' || inputs.cache_tool == 'xcode'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-obs-studio-boringcache-xcode-rolling
        path: benchmark-results/obs-studio-boringcache-xcode-rolling.json
        if-no-files-found: error
        retention-days: 90
    - name: Retain comparison summary
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: comparison-obs-rolling
        path: benchmark-results/comparison.md
        if-no-files-found: error
        retention-days: 90
