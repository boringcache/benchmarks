---
name: 'obs-studio: OBS Studio Actions Cache benchmark'
run-name: obs-studio / ${{ inputs.cache_tool || 'all' }} / Actions Cache | ${{ startsWith(inputs.cli_version,
  'vcli-canary-') && 'Canary' || 'Stable' }} ${{ inputs.cadence }} | ${{ inputs.series_id
  || github.ref_name }} / sample ${{ inputs.sample || '1' }}
permissions:
  actions: read
  contents: read
env:
  BENCHMARK_EXPECTED_IDENTITY: "${{ inputs.expected_identity }}"
  BENCHMARK_ID: obs-studio-compiler-cache
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  ccache-base:
    name: GitHub Actions OBS ccache cold
    if: inputs.cache_tool != 'xcode' && (inputs.runner_label == '' || github.ref_name
      == 'main')
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-26.04' }}"
    timeout-minutes: 120
    env:
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_BASEDIR: "${{ github.workspace }}/upstream"
      CCACHE_NOHASHDIR: '1'
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: "${{ github.workspace }}/.ccache-stats.log"
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-26.04' }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare base source
      run: "./scripts/prepare-source.sh base"
    - name: Install the upstream Linux build shell
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
        brew install --quiet zsh
    - name: Install the benchmark ccache release
      run: "./scripts/install-ccache.sh"
    - name: Build base commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/ccache-actions-cache-base-timing.json -- ruby ./scripts/run-benchmark-plan.rb ccache --working-directory upstream \
          2>&1 | tee benchmark-results/ccache-actions-cache-base.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/ccache-actions-cache-base-timing.json >> "$GITHUB_OUTPUT"
    - name: Capture and verify ccache evidence
      run: |
        ccache --print-log-stats --format=json > benchmark-results/ccache-actions-cache-base-native.json
        ./scripts/verify_ccache_evidence.rb \
          --path benchmark-results/ccache-actions-cache-base-native.json \
          --phase base \
          --strategy actions-cache
    - name: Save ccache directory
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: gha-obs-studio-ccache-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ".ccache"
    - name: Write base result
      env:
        GITHUB_TOKEN: "${{ github.token }}"
      run: |
        ./scripts/write_phase_result.rb \
          --surface ccache \
          --strategy actions-cache \
          --phase base \
          --source-sha "${{ steps.source.outputs.OBS_BASE_SHA }}" \
          --restore-seconds 0 \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --cache-key "gha-obs-studio-ccache-r${{ github.run_id }}-a${{ github.run_attempt }}" \
          --native-evidence benchmark-results/ccache-actions-cache-base-native.json
    - name: Upload base result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-${{ env.BENCHMARK_ID }}-ccache-actions-cache-base
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
  ccache-rolling:
    name: GitHub Actions OBS ccache commit
    needs: ccache-base
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-26.04' }}"
    timeout-minutes: 120
    env:
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_BASEDIR: "${{ github.workspace }}/upstream"
      CCACHE_NOHASHDIR: '1'
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: "${{ github.workspace }}/.ccache-stats.log"
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-26.04' }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare rolling source
      run: "./scripts/prepare-source.sh rolling"
    - name: Install the upstream Linux build shell
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
        brew install --quiet zsh
    - name: Install the benchmark ccache release
      run: "./scripts/install-ccache.sh"
    - name: Start cache restore timing
      id: restore_start
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore ccache directory
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: gha-obs-studio-ccache-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ".ccache"
        fail-on-cache-miss: true
    - name: Capture cache restore timing
      id: restore
      run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Build rolling commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/ccache-actions-cache-rolling-timing.json -- ruby ./scripts/run-benchmark-plan.rb ccache --working-directory upstream \
          2>&1 | tee benchmark-results/ccache-actions-cache-rolling.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/ccache-actions-cache-rolling-timing.json >> "$GITHUB_OUTPUT"
    - name: Capture and verify ccache evidence
      run: |
        ccache --print-log-stats --format=json > benchmark-results/ccache-actions-cache-rolling-native.json
        ./scripts/verify_ccache_evidence.rb \
          --path benchmark-results/ccache-actions-cache-rolling-native.json \
          --phase rolling \
          --strategy actions-cache
    - name: Write rolling result
      env:
        GITHUB_TOKEN: "${{ github.token }}"
      run: |
        ./scripts/write_phase_result.rb \
          --surface ccache \
          --strategy actions-cache \
          --phase rolling \
          --source-sha "${{ steps.source.outputs.OBS_HEAD_SHA }}" \
          --restore-seconds "${{ steps.restore.outputs.seconds }}" \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --cache-key "gha-obs-studio-ccache-r${{ github.run_id }}-a${{ github.run_attempt }}" \
          --native-evidence benchmark-results/ccache-actions-cache-rolling-native.json
    - name: Upload rolling result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-${{ env.BENCHMARK_ID }}-ccache-actions-cache-rolling
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
  xcode-base:
    name: GitHub Actions OBS Xcode cold
    if: inputs.cache_tool != 'ccache'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODE_CAS_PATH: "${{ github.workspace }}/.xcode-compilation-cache"
      OBS_BASELINE_DERIVED_DATA_PATH: "${{ github.workspace }}/.xcode-derived-data"
      BENCHMARK_RUNNER_CLASS: macos-26
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare base source
      run: "./scripts/prepare-source.sh base"
    - name: Select upstream's pinned Xcode
      run: sudo xcode-select --switch "${{ steps.source.outputs.OBS_XCODE_PATH }}"
    - name: Build base commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/xcode-actions-cache-base-timing.json -- ruby ./scripts/run-benchmark-plan.rb xcode --working-directory upstream \
          2>&1 | tee benchmark-results/xcode-actions-cache-base.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/xcode-actions-cache-base-timing.json >> "$GITHUB_OUTPUT"
    - name: Require a populated Xcode compilation cache
      run: test -n "$(find "$XCODE_CAS_PATH" -type f -print -quit)"
    - name: Save Xcode compilation cache
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: gha-obs-studio-xcode-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ".xcode-compilation-cache"
    - name: Write base result
      env:
        GITHUB_TOKEN: "${{ github.token }}"
      run: |
        ./scripts/write_phase_result.rb \
          --surface xcode \
          --strategy actions-cache \
          --phase base \
          --source-sha "${{ steps.source.outputs.OBS_BASE_SHA }}" \
          --restore-seconds 0 \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --cache-key "gha-obs-studio-xcode-r${{ github.run_id }}-a${{ github.run_attempt }}"
    - name: Upload base result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-${{ env.BENCHMARK_ID }}-xcode-actions-cache-base
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
  xcode-rolling:
    name: GitHub Actions OBS Xcode commit
    needs: xcode-base
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODE_CAS_PATH: "${{ github.workspace }}/.xcode-compilation-cache"
      OBS_BASELINE_DERIVED_DATA_PATH: "${{ github.workspace }}/.xcode-derived-data"
      BENCHMARK_RUNNER_CLASS: macos-26
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: obs-studio
    - name: Read pinned source
      id: source
      run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    - name: Checkout pinned OBS source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        repository: "${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}"
        ref: "${{ steps.source.outputs.OBS_HEAD_SHA }}"
        path: upstream
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false
    - name: Prepare rolling source
      run: "./scripts/prepare-source.sh rolling"
    - name: Start cache restore timing
      id: restore_start
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Restore Xcode compilation cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        key: gha-obs-studio-xcode-r${{ github.run_id }}-a${{ github.run_attempt }}
        path: ".xcode-compilation-cache"
        fail-on-cache-miss: true
    - name: Capture cache restore timing
      id: restore
      run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Select upstream's pinned Xcode
      run: sudo xcode-select --switch "${{ steps.source.outputs.OBS_XCODE_PATH }}"
    - name: Build rolling commit
      id: build
      run: |
        set -euo pipefail
        ruby ./scripts/measure-build.rb --output benchmark-results/xcode-actions-cache-rolling-timing.json -- ruby ./scripts/run-benchmark-plan.rb xcode --working-directory upstream \
          2>&1 | tee benchmark-results/xcode-actions-cache-rolling.log
        ruby -rjson -e 'puts "seconds=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("build_seconds")}"' benchmark-results/xcode-actions-cache-rolling-timing.json >> "$GITHUB_OUTPUT"
    - name: Require native Xcode build evidence
      run: "./scripts/verify_xcode_build_log.rb benchmark-results/xcode-actions-cache-rolling.log"
    - name: Write rolling result
      env:
        GITHUB_TOKEN: "${{ github.token }}"
      run: |
        ./scripts/write_phase_result.rb \
          --surface xcode \
          --strategy actions-cache \
          --phase rolling \
          --source-sha "${{ steps.source.outputs.OBS_HEAD_SHA }}" \
          --restore-seconds "${{ steps.restore.outputs.seconds }}" \
          --build-seconds "${{ steps.build.outputs.seconds }}" \
          --cache-key "gha-obs-studio-xcode-r${{ github.run_id }}-a${{ github.run_attempt }}"
    - name: Upload rolling result
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: phase-${{ env.BENCHMARK_ID }}-xcode-actions-cache-rolling
        path: benchmark-results
        if-no-files-found: error
        retention-days: 30
'on':
  workflow_dispatch:
    inputs:
      expected_identity:
        description: Frozen scheduled harness and case identity; checked before preparation.
        type: string
        required: false
        default: ''
      cache_tool:
        description: Select the tool declared by the evaluation series.
        required: false
        type: choice
        options:
        - all
        - ccache
        - xcode
        default: all
      runner_label:
        description: Optional Linux runner label for a manual main-branch experiment.
        required: false
        default: ''
        type: string
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
  workflow_call:
    inputs:
      expected_identity:
        type: string
        required: false
        default: ''
      cache_tool:
        required: false
        type: string
        default: all
      runner_label:
        required: false
        default: ''
        type: string
      cli_version:
        required: false
        type: string
        default: ''
      series_id:
        type: string
        required: false
        default: ''
      sample:
        type: string
        required: false
        default: '1'
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
