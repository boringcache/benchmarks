---
name: 'posthog: PostHog Fresh'
run-name: "${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' &&
  'Validation' || inputs.cli_version != '' && 'Canary' || 'Fresh', github.event_name
  == 'schedule' && 'Weekly' || github.event_name == 'pull_request' && format('PR #{0}',
  github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name))
  }}"
concurrency:
  group: benchmark-provider-comparisons
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  actions: read
  packages: read
env:
  BORINGCACHE_NO_GIT: 'true'
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  gha-cold:
    name: GitHub Actions amd64 cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    outputs:
      cache_scope: "${{ steps.benchmark.outputs.cache_scope }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - id: benchmark
      uses: "./.github/actions/posthog-docker-benchmark"
      with:
        posthog_sourcemap_api_key: "${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY
          }}"
        strategy: actions-cache
        phase: publish
        cache_lane: fresh
        benchmark_id: "${{ format('posthog{0}', inputs.benchmark_id_suffix) }}"
        platform: linux/amd64
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  gha-warm:
    name: GitHub Actions amd64 warm
    needs: gha-cold
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - uses: "./.github/actions/posthog-docker-benchmark"
      with:
        posthog_sourcemap_api_key: "${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY
          }}"
        strategy: actions-cache
        phase: warm
        cache_lane: fresh
        benchmark_id: "${{ format('posthog{0}', inputs.benchmark_id_suffix) }}"
        platform: linux/amd64
        cache_scope: "${{ needs.gha-cold.outputs.cache_scope }}"
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  boringcache-cold:
    name: BoringCache amd64 cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    outputs:
      cache_scope: "${{ steps.benchmark.outputs.cache_scope }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - id: benchmark
      uses: "./.github/actions/posthog-docker-benchmark"
      with:
        posthog_sourcemap_api_key: "${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY
          }}"
        strategy: boringcache
        phase: publish
        cache_lane: fresh
        benchmark_id: "${{ format('posthog{0}', inputs.benchmark_id_suffix) }}"
        platform: linux/amd64
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  boringcache-warm:
    name: BoringCache amd64 warm
    needs: boringcache-cold
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - uses: "./.github/actions/posthog-docker-benchmark"
      with:
        posthog_sourcemap_api_key: "${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY
          }}"
        strategy: boringcache
        phase: warm
        cache_lane: fresh
        benchmark_id: "${{ format('posthog{0}', inputs.benchmark_id_suffix) }}"
        platform: linux/amd64
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
        cache_scope: "${{ needs.boringcache-cold.outputs.cache_scope }}"
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  boringcache-combined-cold:
    name: BoringCache layer + tool + mount cache amd64 cold
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    outputs:
      cache_scope: "${{ steps.benchmark.outputs.cache_scope }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - id: benchmark
      uses: "./.github/actions/posthog-docker-benchmark"
      with:
        posthog_sourcemap_api_key: "${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY
          }}"
        strategy: boringcache
        phase: publish
        cache_lane: fresh
        benchmark_id: "${{ format('posthog-toolcache-mountcache{0}', inputs.benchmark_id_suffix)
          }}"
        platform: linux/amd64
        docker_tool_cache: 'true'
        docker_mount_cache: 'true'
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  boringcache-combined-warm:
    name: BoringCache layer + tool + mount cache amd64 warm
    needs: boringcache-combined-cold
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-latest' }}"
    timeout-minutes: 180
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - uses: "./.github/actions/posthog-docker-benchmark"
      with:
        posthog_sourcemap_api_key: "${{ secrets.POSTHOG_UPLOAD_SOURCEMAPS_CLI_API_KEY
          }}"
        strategy: boringcache
        phase: warm
        cache_lane: fresh
        benchmark_id: "${{ format('posthog-toolcache-mountcache{0}', inputs.benchmark_id_suffix)
          }}"
        platform: linux/amd64
        docker_tool_cache: 'true'
        docker_mount_cache: 'true'
        cli_version: "${{ inputs.cli_version }}"
        buildkit_image: "${{ inputs.buildkit_image }}"
        cache_scope: "${{ needs.boringcache-combined-cold.outputs.cache_scope }}"
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-latest' }}"
  report:
    name: PostHog Docker fresh report
    needs:
    - gha-warm
    - boringcache-warm
    - boringcache-combined-warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: posthog
    - name: Download the benchmark phase evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-*
        path: phase-evidence
    - name: Publish the PostHog Docker benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "PostHog Docker fresh benchmark" \
          --input-dir phase-evidence \
          --output-dir benchmark-results
    - name: Retain the posthog BoringCache fresh result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-posthog${{ inputs.benchmark_id_suffix }}-boringcache-fresh
        path: benchmark-results/posthog${{ inputs.benchmark_id_suffix }}-boringcache-fresh.json
        if-no-files-found: error
    - name: Retain the posthog GitHub Actions fresh result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-posthog${{ inputs.benchmark_id_suffix }}-actions-cache-fresh
        path: benchmark-results/posthog${{ inputs.benchmark_id_suffix }}-actions-cache-fresh.json
        if-no-files-found: error
    - name: Retain the combined-cache BoringCache fresh result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-posthog-toolcache-mountcache${{ inputs.benchmark_id_suffix
          }}-boringcache-fresh
        path: benchmark-results/posthog-toolcache-mountcache${{ inputs.benchmark_id_suffix
          }}-boringcache-fresh.json
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-latest
'on':
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: Optional managed BoringCache BuildKit image.
        required: false
        type: string
        default: ''
      cli_version:
        description: Optional exact BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      benchmark_id_suffix:
        description: Optional suffix for isolated comparison runs.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
