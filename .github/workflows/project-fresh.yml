---
name: Project fresh
run-name: "${{ inputs.case_id }} ${{ inputs.cadence == 'nightly' && 'Nightly' || 'Fresh' }} | ${{ inputs.cli_version }}"
'on':
  workflow_dispatch:
    inputs:
      case_id:
        type: string
        required: true
      cli_version:
        type: string
        required: true
      selections:
        type: string
        required: true
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
permissions:
  contents: read
  actions: read
  packages: read
  id-token: write
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native_fresh_benchmark: "${{ steps.matrix.outputs.native_fresh_benchmark }}"
      obs_studio_obs_actions_cache: "${{ steps.matrix.outputs.obs_studio_obs_actions_cache
        }}"
      obs_studio_obs_boringcache: "${{ steps.matrix.outputs.obs_studio_obs_boringcache
        }}"
      nix_fresh_benchmark: "${{ steps.matrix.outputs.nix_fresh_benchmark }}"
      zed_zed_cargo_product: "${{ steps.matrix.outputs.zed_zed_cargo_product }}"
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - id: matrix
      env:
        SELECTIONS: "${{ inputs.selections }}"
        CASE_ID: "${{ inputs.case_id }}"
        LANE: fresh
      run: 'ruby -rjson -e ''require_relative "scripts/project-runs"; matrices = ProjectRuns.matrix(JSON.parse(ENV.fetch("SELECTIONS")),
        case_id: ENV.fetch("CASE_ID"), lane: ENV.fetch("LANE")); File.open(ENV.fetch("GITHUB_OUTPUT"),
        "a") { |file| matrices.each { |name, value| file.puts("#{name.delete_suffix(".yml").tr("-",
        "_")}=#{JSON.generate(value)}") } }'''
  native_fresh_benchmark:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.native_fresh_benchmark != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.native_fresh_benchmark) }}"
    uses: "./.github/workflows/native-fresh-benchmark.yml"
    with:
      expected_identity: "${{ matrix.inputs.expected_identity || '' }}"
      job_prefix: "${{ matrix.label }}"
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      case_id: "${{ matrix.inputs.case_id || '' }}"
      variant: "${{ matrix.inputs.variant || '' }}"
      provider: "${{ matrix.inputs.provider || 'both' }}"
      runner_label: "${{ matrix.inputs.runner_label || '' }}"
      benchmark_id_suffix: "${{ matrix.inputs.benchmark_id_suffix || '' }}"
      buildkit_image: "${{ matrix.inputs.buildkit_image || '' }}"
      cadence: "${{ inputs.cadence }}"
  obs_studio_obs_actions_cache:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.obs_studio_obs_actions_cache != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.obs_studio_obs_actions_cache) }}"
    uses: "./.github/workflows/obs-studio-obs-actions-cache.yml"
    with:
      expected_identity: "${{ matrix.inputs.expected_identity || '' }}"
      cache_tool: "${{ matrix.inputs.cache_tool || '' }}"
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      cadence: "${{ inputs.cadence }}"
  obs_studio_obs_boringcache:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.obs_studio_obs_boringcache != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.obs_studio_obs_boringcache) }}"
    uses: "./.github/workflows/obs-studio-obs-boringcache.yml"
    with:
      expected_identity: "${{ matrix.inputs.expected_identity || '' }}"
      cli_version: "${{ inputs.cli_version }}"
      cache_tool: "${{ matrix.inputs.cache_tool || '' }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      cadence: "${{ inputs.cadence }}"
  report:
    name: Project measurements
    if: always()
    needs:
    - native_fresh_benchmark
    - obs_studio_obs_actions_cache
    - obs_studio_obs_boringcache
    - nix_fresh_benchmark
    - zed_zed_cargo_product
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
    - run: bundle install --jobs 4 --retry 2
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-*
        path: project-evidence
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: storage-*
        path: project-evidence
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: zed-cargo-layers-*
        path: project-evidence
    - name: Report all project measurements
      env:
        CASE_ID: "${{ inputs.case_id }}"
        SELECTIONS: "${{ inputs.selections }}"
        LANE: fresh
        GH_TOKEN: "${{ github.token }}"
      run: ruby scripts/project-report.rb
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: project-measurements
        path: project-results/
        if-no-files-found: error
        retention-days: 90
  nix_fresh_benchmark:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.nix_fresh_benchmark != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.nix_fresh_benchmark) }}"
    uses: "./.github/workflows/nix-fresh-benchmark.yml"
    secrets: inherit
    with:
      case_id: "${{ matrix.inputs.case_id || '' }}"
      provider: "${{ matrix.inputs.provider || 'all' }}"
      cachix_cache: "${{ matrix.inputs.cachix_cache || '' }}"
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      expected_identity: "${{ matrix.inputs.expected_identity || '' }}"
      cadence: "${{ inputs.cadence }}"
  zed_zed_cargo_product:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.zed_zed_cargo_product != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.zed_zed_cargo_product) }}"
    uses: "./.github/workflows/zed-zed-cargo-product.yml"
    secrets: inherit
    with:
      cache_layer: "${{ matrix.inputs.cache_layer || '' }}"
      base_sha: "${{ matrix.inputs.base_sha || '' }}"
      head_sha: "${{ matrix.inputs.head_sha || '' }}"
      compiler_cache: "${{ matrix.inputs.compiler_cache || 'sccache' }}"
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      expected_identity: "${{ matrix.inputs.expected_identity || '' }}"
      cadence: "${{ inputs.cadence }}"
