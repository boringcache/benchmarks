---
name: Project rolling
run-name: "${{ inputs.case_id }} Rolling | ${{ inputs.cli_version }}"
'on':
  workflow_dispatch:
    inputs:
      observation:
        description: Seed, identical-source replay, or changed-source build.
        type: string
        default: changed-source
      case_id:
        type: string
        required: true
      cli_version:
        type: string
        required: true
      selections:
        type: string
        required: true
permissions:
  contents: read
  actions: read
  checks: read
  packages: read
  id-token: write
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native_rolling_benchmark: "${{ steps.matrix.outputs.native_rolling_benchmark
        }}"
      nix_rolling_benchmark: "${{ steps.matrix.outputs.nix_rolling_benchmark }}"
      zed_zed_cargo_rolling_auto: "${{ steps.matrix.outputs.zed_zed_cargo_rolling_auto
        }}"
      deno_deno_cargo_rolling_chain: "${{ steps.matrix.outputs.deno_deno_cargo_rolling_chain
        }}"
      reapi_rolling_benchmark: "${{ steps.matrix.outputs.reapi_rolling_benchmark }}"
      grpc_grpc_bazel_benchmark: "${{ steps.matrix.outputs.grpc_grpc_bazel_benchmark
        }}"
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - id: matrix
      env:
        SELECTIONS: "${{ inputs.selections }}"
        CASE_ID: "${{ inputs.case_id }}"
        LANE: rolling
      run: 'ruby -rjson -e ''require_relative "scripts/project-runs"; matrices = ProjectRuns.matrix(JSON.parse(ENV.fetch("SELECTIONS")),
        case_id: ENV.fetch("CASE_ID"), lane: ENV.fetch("LANE")); File.open(ENV.fetch("GITHUB_OUTPUT"),
        "a") { |file| matrices.each { |name, value| file.puts("#{name.delete_suffix(".yml").tr("-",
        "_")}=#{JSON.generate(value)}") } }'''
  native_rolling_benchmark:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.native_rolling_benchmark != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.native_rolling_benchmark) }}"
    uses: "./.github/workflows/native-rolling-benchmark.yml"
    secrets: inherit
    with:
      observation: "${{ matrix.inputs.observation || inputs.observation }}"
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      case_id: "${{ matrix.inputs.case_id || '' }}"
      variant: "${{ matrix.inputs.variant || '' }}"
      cache_scope: "${{ matrix.inputs.cache_scope || '' }}"
      provider: "${{ matrix.inputs.provider || 'both' }}"
      runner_label: "${{ matrix.inputs.runner_label || '' }}"
      benchmark_id_suffix: "${{ matrix.inputs.benchmark_id_suffix || '' }}"
      buildkit_image: "${{ matrix.inputs.buildkit_image || '' }}"
      cli_platform: "${{ matrix.inputs.cli_platform || '' }}"
      expected_identity: "${{ matrix.inputs.expected_identity || '' }}"
  nix_rolling_benchmark:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.nix_rolling_benchmark != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.nix_rolling_benchmark) }}"
    uses: "./.github/workflows/nix-rolling-benchmark.yml"
    secrets: inherit
    with:
      observation: "${{ matrix.inputs.observation || inputs.observation }}"
      cli_version: "${{ inputs.cli_version }}"
      case_id: "${{ matrix.inputs.case_id }}"
      provider: "${{ matrix.inputs.provider || 'all' }}"
      cache_scope: "${{ matrix.inputs.cache_scope || '' }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
  zed_zed_cargo_rolling_auto:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.zed_zed_cargo_rolling_auto != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.zed_zed_cargo_rolling_auto) }}"
    uses: "./.github/workflows/zed-zed-cargo-rolling-auto.yml"
    secrets: inherit
    with:
      provider: "${{ matrix.inputs.provider || 'boringcache' }}"
      runner_label: "${{ matrix.inputs.runner_label || '' }}"
      observation: "${{ matrix.inputs.observation || inputs.observation }}"
      cli_version: "${{ inputs.cli_version }}"
      base_sha: "${{ matrix.inputs.base_sha }}"
      head_sha: "${{ matrix.inputs.head_sha }}"
      source_distance: "${{ matrix.inputs.source_distance }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
  report:
    name: Project measurements
    if: always()
    needs:
    - native_rolling_benchmark
    - nix_rolling_benchmark
    - zed_zed_cargo_rolling_auto
    - deno_deno_cargo_rolling_chain
    - reapi_rolling_benchmark
    - grpc_grpc_bazel_benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
    - run: bundle install --jobs 4 --retry 2
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: phase-*
        path: project-evidence
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: benchmark-zed-cargo-*
        path: project-evidence
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: storage-*
        path: project-evidence
    - name: Report all project measurements
      env:
        CASE_ID: "${{ inputs.case_id }}"
        SELECTIONS: "${{ inputs.selections }}"
        LANE: rolling
        GH_TOKEN: "${{ github.token }}"
      run: ruby scripts/project-report.rb
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: project-measurements
        path: project-results/
        if-no-files-found: error
        retention-days: 90
  deno_deno_cargo_rolling_chain:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.deno_deno_cargo_rolling_chain != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.deno_deno_cargo_rolling_chain) }}"
    uses: "./.github/workflows/deno-deno-cargo-rolling-chain.yml"
    secrets: inherit
    with:
      provider: "${{ matrix.inputs.provider || 'boringcache' }}"
      observation: "${{ matrix.inputs.observation || inputs.observation }}"
      cli_version: "${{ inputs.cli_version }}"
      cache_scope: "${{ matrix.inputs.cache_scope || '' }}"
      base_sha: "${{ matrix.inputs.base_sha || '' }}"
      head_sha: "${{ matrix.inputs.head_sha || '' }}"
      cache_profile: "${{ matrix.inputs.cache_profile || 'cargo-product' }}"
      runner_label: "${{ matrix.inputs.runner_label || '' }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
  reapi_rolling_benchmark:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.reapi_rolling_benchmark != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.reapi_rolling_benchmark) }}"
    uses: "./.github/workflows/reapi-rolling-benchmark.yml"
    secrets: inherit
    with:
      observation: "${{ matrix.inputs.observation || inputs.observation }}"
      case_id: "${{ matrix.inputs.case_id || '' }}"
      provider: "${{ matrix.inputs.provider || 'all' }}"
      runner_label: "${{ matrix.inputs.runner_label || '' }}"
      cli_version: "${{ inputs.cli_version }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
      cache_scope: "${{ matrix.inputs.cache_scope || '' }}"
  grpc_grpc_bazel_benchmark:
    name: "${{ matrix.label }}"
    needs: select
    if: needs.select.outputs.grpc_grpc_bazel_benchmark != ''
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select.outputs.grpc_grpc_bazel_benchmark) }}"
    uses: "./.github/workflows/grpc-grpc-bazel-benchmark.yml"
    secrets: inherit
    with:
      provider: "${{ matrix.inputs.provider || 'all' }}"
      observation: "${{ matrix.inputs.observation || inputs.observation }}"
      cache_scope: "${{ matrix.inputs.cache_scope || '' }}"
      cli_version: "${{ inputs.cli_version }}"
      benchmark_id_suffix: "${{ matrix.inputs.benchmark_id_suffix || '' }}"
      runner_label: "${{ matrix.inputs.runner_label || '' }}"
      series_id: "${{ matrix.inputs.series_id || '' }}"
      sample: "${{ matrix.inputs.sample || '1' }}"
