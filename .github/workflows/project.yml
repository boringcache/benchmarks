name: Project benchmark

on:
  workflow_dispatch:
    inputs:
      tool:
        description: tool, for example Docker, Turbo or Rust/Cargo
        type: string
        required: true
      project:
        description: project, for example Hugo or PostHog
        type: string
        required: true
      mode:
        description: fresh (cold then warm), rolling (next commit), sample (completed GitHub commit), series (cold, warm and three rolling commits on a branch), or preflight (setup probes)
        type: choice
        options: [fresh, series, rolling, sample, preflight]
        default: fresh
      lane:
        description: only these lanes, space separated (optional, for debugging one lane)
        type: string
        required: false
        default: ""
      runner:
        description: fresh, preflight or sample runner keys such as github macos windows (optional)
        type: string
        default: ""
      sha:
        description: sample only, full SHA of a newer upstream first-parent commit (optional)
        type: string
        default: ""
      cli:
        description: CLI release tag instead of the pinned version, for example vcli-canary-<sha> (optional, fresh and preflight only)
        type: string
        required: false
        default: ""
      cli_artifact:
        description: Immutable benchmark workspace CLI artifact for a fresh or series branch run
        type: string
        default: ""
      mounted_budget:
        description: Run a cold Zed mounted trial with automatic sizing or a 6 GiB cap
        type: choice
        options: [series, auto, 6GiB]
        default: series
      step:
        description: rolling only, re-run this recorded step with the current harness for lanes without a passing record (optional)
        type: string
        required: false
        default: ""

run-name: ${{ inputs.tool }} - ${{ inputs.project }}${{ inputs.mode != 'fresh' && format(' ({0})', inputs.mode) || '' }}${{ inputs.step && format(' step {0}', inputs.step) || '' }}${{ inputs.cli && format(' [{0}]', inputs.cli) || '' }}${{ inputs.cli_artifact && format(' [{0}]', inputs.cli_artifact) || '' }}${{ inputs.mounted_budget != 'series' && format(' [cold {0}]', inputs.mounted_budget) || '' }}

env:
  BENCH_BRANCH_SERIES: ${{ inputs.mode == 'series' && 'true' || '' }}
  CANDIDATE_CLI_ARTIFACT: ${{ inputs.cli_artifact }}
  BENCH_ZED_MOUNT_BUDGET: ${{ inputs.mounted_budget != 'series' && inputs.mounted_budget || '' }}

concurrency:
  group: ${{ (inputs.mode == 'rolling' || inputs.mode == 'sample') && format('rolling-{0}-{1}', inputs.tool, inputs.project) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - id: matrix
        env:
          MODE: ${{ inputs.mode }}
          TOOL: ${{ inputs.tool }}
          PROJECT: ${{ inputs.project }}
          ROLLING: ${{ inputs.mode == 'rolling' && 'true' || '' }}
          LANE: ${{ inputs.lane }}
          CLI: ${{ inputs.cli }}
          STEP: ${{ inputs.step }}
          SAMPLE: ${{ inputs.mode == 'sample' && 'true' || '' }}
          RUNNER: ${{ inputs.runner }}
          SHA: ${{ inputs.sha }}
          REF: ${{ github.ref }}
        run: |
          if { [ -n "$ROLLING" ] || [ -n "$SAMPLE" ]; } && [ "$REF" != refs/heads/main ]; then
            echo "::error::Rolling and sample runs continue the series on main: they read its records, publish records only to main and write its cache scopes. Dispatch them with --ref main; this run used $REF."
            exit 1
          fi
          if [ -n "$CANDIDATE_CLI_ARTIFACT" ] && { [ "$REF" = refs/heads/main ] || [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -n "$ROLLING$SAMPLE$CLI" ] || ! [[ "$CANDIDATE_CLI_ARTIFACT" =~ ^art_[0-9a-f]{24}$ ]]; }; then
            echo 'Select a branch, fresh or preflight mode, and an immutable CLI artifact without a release tag.' >&2
            exit 1
          fi
          if [ -n "$BENCH_BRANCH_SERIES" ] && { [ "$REF" = refs/heads/main ] || [[ "$REF" != refs/heads/* ]]; }; then
            echo 'Run a comparison series from a branch other than main.' >&2
            exit 1
          fi
          if [[ "$LANE" == *bazel-mounted* ]] && { [ -z "$CANDIDATE_CLI_ARTIFACT" ] || [ "$MODE" != fresh ]; }; then
            echo 'Select fresh mode and a candidate artifact for the mounted Bazel benchmark.' >&2
            exit 1
          fi
          if [[ "$LANE" == *plus-mounted* ]] && { [ -z "$CANDIDATE_CLI_ARTIFACT" ] || [ -z "$BENCH_BRANCH_SERIES" ]; }; then
            echo 'The mounted Cargo comparison requires a branch series and a candidate artifact.' >&2
            exit 1
          fi
          if [ -n "$BENCH_ZED_MOUNT_BUDGET" ] && { [ "$PROJECT" != zed ] || [ "$LANE" != boringcache-cargo-plus-mounted ] || [ "$RUNNER" != github ]; }; then
            echo 'Select Zed, the mounted Cargo lane and the github runner for the cold disk budget trial.' >&2
            exit 1
          fi
          bash scripts/checkout-records.sh
          if [ -n "$RUNNER" ] && [ -n "$ROLLING" ]; then echo 'rolling runs use every configured runner' >&2; exit 1; fi
          matrix=$(bundle exec bin/bench matrix "$PROJECT" --tool "$TOOL" ${ROLLING:+--rolling} ${BENCH_BRANCH_SERIES:+--series} ${SAMPLE:+--sample} ${RUNNER:+--runner "$RUNNER"} ${SHA:+--sha "$SHA"} ${LANE:+--lane "$LANE"} ${CLI:+--cli "$CLI"} ${STEP:+--step "$STEP"} --results results)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '[]' ]; then
            echo 'No benchmark jobs are due for this selection.' >> "$GITHUB_STEP_SUMMARY"
          fi

  cold:
    needs: plan
    if: ${{ (inputs.mode == 'fresh' || inputs.mode == 'series' || inputs.mode == 'preflight') && needs.plan.outputs.matrix != '[]' }}
    name: "${{ inputs.mode == 'preflight' && 'preflight' || 'cold' }}: ${{ matrix.label }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    permissions: &lane_permissions
      contents: read
      id-token: write
      packages: write
    strategy: &matrix
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env: &secrets
      R2_ENDPOINT: https://efc17f9311838cfc4a3c41ce37b4246b.r2.cloudflarestorage.com
      R2_BUCKET: benchmarks
      BUILDBUDDY_API_KEY: ${{ contains(matrix.secrets, 'BUILDBUDDY_API_KEY') && secrets.BUILDBUDDY_API_KEY || '' }}
      CACHIX_AUTH_TOKEN: ${{ contains(matrix.secrets, 'CACHIX_AUTH_TOKEN') && secrets.CACHIX_AUTH_TOKEN || '' }}
      CACHIX_CACHE: ${{ contains(matrix.secrets, 'CACHIX_CACHE') && vars.CACHIX_CACHE || '' }}
      DEPOT_TOKEN: ${{ contains(matrix.secrets, 'DEPOT_TOKEN') && secrets.DEPOT_TOKEN || '' }}
      DEPOT_ORG_ID: ${{ contains(matrix.secrets, 'DEPOT_ORG_ID') && secrets.DEPOT_ORG_ID || '' }}
      DEPOT_DOCKER_PROJECT_ID: ${{ contains(matrix.secrets, 'DEPOT_DOCKER_PROJECT_ID') && secrets.DEPOT_DOCKER_PROJECT_ID || '' }}
      DEPOT_RUNNERS_PROJECT_ID: ${{ contains(matrix.secrets, 'DEPOT_RUNNERS_PROJECT_ID') && secrets.DEPOT_RUNNERS_PROJECT_ID || '' }}
      HETZNER_SSH_KEY: ${{ contains(matrix.secrets, 'HETZNER_SSH_KEY') && secrets.HETZNER_SSH_KEY || '' }}
      HETZNER_HOST: ${{ contains(matrix.secrets, 'HETZNER_HOST') && secrets.HETZNER_HOST || '' }}
      HETZNER_HOST_KEY: ${{ contains(matrix.secrets, 'HETZNER_HOST_KEY') && secrets.HETZNER_HOST_KEY || '' }}
      SSH_WORKER_KEY: ${{ contains(matrix.secrets, 'SCALEWAY_SSH_KEY') && secrets.SCALEWAY_SSH_KEY || '' }}
      SSH_WORKER_HOST: ${{ contains(matrix.secrets, 'SCALEWAY_HOST') && secrets.SCALEWAY_HOST || '' }}
      SSH_WORKER_HOST_KEY: ${{ contains(matrix.secrets, 'SCALEWAY_HOST_KEY') && secrets.SCALEWAY_HOST_KEY || '' }}
      BITRISE_BUILD_CACHE_AUTH_TOKEN: ${{ contains(matrix.secrets, 'BITRISE_BUILD_CACHE_AUTH_TOKEN') && secrets.BITRISE_BUILD_CACHE_AUTH_TOKEN || '' }}
      BITRISE_BUILD_CACHE_WORKSPACE_ID: ${{ contains(matrix.secrets, 'BITRISE_BUILD_CACHE_WORKSPACE_ID') && vars.BITRISE_BUILD_CACHE_WORKSPACE_ID || '' }}
      TURBO_NAME: ${{ contains(matrix.secrets, 'TURBO_NAME') && secrets.TURBO_NAME || '' }}
      TURBO_TEAM_ID: ${{ contains(matrix.secrets, 'TURBO_TEAM_ID') && secrets.TURBO_TEAM_ID || '' }}
      NX_CLOUD_ID: ${{ contains(matrix.secrets, 'NX_CLOUD_ID') && vars.NX_CLOUD_ID || '' }}
      NX_CLOUD_ACCESS_TOKEN: ${{ contains(matrix.secrets, 'NX_CLOUD_ACCESS_TOKEN') && secrets.NX_RW_TOKEN || '' }}
      NX_CLOUD_READ_ONLY_TOKEN: ${{ contains(matrix.secrets, 'NX_CLOUD_READ_ONLY_TOKEN') && secrets.NX_READ_TOKEN || '' }}
      NATIVELINK_R2_ACCESS_KEY_ID: ${{ contains(matrix.secrets, 'NATIVELINK_R2_ACCESS_KEY_ID') && secrets.NATIVELINK_R2_ACCESS_KEY_ID || '' }}
      NATIVELINK_R2_SECRET_ACCESS_KEY: ${{ contains(matrix.secrets, 'NATIVELINK_R2_SECRET_ACCESS_KEY') && secrets.NATIVELINK_R2_SECRET_ACCESS_KEY || '' }}
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: ./.github/actions/phase
        with:
          case: ${{ matrix.case }}
          lane: ${{ matrix.lane }}
          runner: ${{ matrix.runner }}
          setup: ${{ matrix.setup }}
          phase: ${{ startsWith(github.job, 'roll_') && 'rolling' || (inputs.mode == 'preflight' || inputs.mode == 'sample') && inputs.mode || github.job }}
          run-id: ${{ github.run_id }}
          sha: ${{ matrix.series[github.job].sha || matrix.sha }}
          step: ${{ matrix.series[github.job].step || matrix.step }}
          cache-scope: ${{ inputs.mode == 'series' && format('{0}-{1}-{2}', matrix.lane, matrix.runner, github.run_id) || matrix.cache_scope }}
          cli-release: ${{ matrix.cli }}
          continues: ${{ startsWith(github.job, 'roll_') && 'true' || matrix.continues }}
          cadence: ${{ matrix.cadence }}
          cache-source: ${{ matrix.source }}
          static-cache-auth: ${{ github.ref == 'refs/heads/main' && matrix.case == 'docker/posthog-runners' && matrix.cli == '' && contains(matrix.secrets, 'POSTHOG_REMOTE_RESTORE_TOKEN') }}
          cache-restore-token: ${{ github.ref == 'refs/heads/main' && matrix.case == 'docker/posthog-runners' && matrix.cli == '' && inputs.mode != 'preflight' && contains(matrix.secrets, 'POSTHOG_REMOTE_RESTORE_TOKEN') && secrets.POSTHOG_REMOTE_RESTORE_TOKEN || '' }}
          cache-save-token: ${{ github.ref == 'refs/heads/main' && matrix.case == 'docker/posthog-runners' && matrix.cli == '' && inputs.mode != 'preflight' && github.job != 'warm' && contains(matrix.secrets, 'POSTHOG_REMOTE_SAVE_TOKEN') && secrets.POSTHOG_REMOTE_SAVE_TOKEN || '' }}

  warm:
    needs: [plan, cold]
    if: ${{ !cancelled() && inputs.mounted_budget == 'series' && (!endsWith(inputs.lane, '-mounted') || needs.cold.result == 'success') && (inputs.mode == 'fresh' || inputs.mode == 'series') && needs.plan.outputs.matrix != '[]' }}
    name: "warm: ${{ matrix.label }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    permissions: *lane_permissions
    strategy: *matrix
    env: *secrets
    steps: *steps

  rolling:
    needs: plan
    if: ${{ (inputs.mode == 'rolling' || inputs.mode == 'sample') && needs.plan.outputs.matrix != '[]' }}
    name: "${{ inputs.mode }}: ${{ matrix.label }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    permissions: *lane_permissions
    strategy: *matrix
    env: *secrets
    steps: *steps

  roll_1:
    needs: [plan, warm]
    if: ${{ !cancelled() && (inputs.lane != 'boringcache-cargo-plus-mounted' || needs.warm.result == 'success') && inputs.mode == 'series' && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    name: "rolling 1: ${{ matrix.label }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    permissions: *lane_permissions
    strategy: *matrix
    env: *secrets
    steps: *steps

  roll_2:
    needs: [plan, roll_1]
    if: ${{ !cancelled() && (inputs.lane != 'boringcache-cargo-plus-mounted' || needs.roll_1.result == 'success') && inputs.mode == 'series' && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    name: "rolling 2: ${{ matrix.label }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    permissions: *lane_permissions
    strategy: *matrix
    env: *secrets
    steps: *steps

  roll_3:
    needs: [plan, roll_2]
    if: ${{ !cancelled() && (inputs.lane != 'boringcache-cargo-plus-mounted' || needs.roll_2.result == 'success') && inputs.mode == 'series' && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    name: "rolling 3: ${{ matrix.label }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    permissions: *lane_permissions
    strategy: *matrix
    env: *secrets
    steps: *steps

  collect:
    needs: [plan, cold, warm, rolling, roll_1, roll_2, roll_3]
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.mode != 'preflight' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: bundle exec bin/bench post-job-saves --run-id "$RUN_ID" --results results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recorded-results-${{ github.run_attempt }}
          path: results
          if-no-files-found: error

  publish:
    needs: [plan, collect]
    if: ${{ !cancelled() && needs.collect.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recorded-results-${{ github.run_attempt }}
          path: results
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: bundle exec bin/bench prune-caches --run-id "$RUN_ID" --results results
      - env:
          TITLE: ${{ inputs.tool }} - ${{ inputs.project }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse results
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Record $TITLE $MODE run $RUN_ID"
          for attempt in 1 2 3 4 5; do
            git push --quiet origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase --quiet origin main
          done
          exit 1
      - name: Dispatch PostHog registry transfers
        if: inputs.tool == 'Docker' && inputs.project == 'posthog' && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/dispatch-registry.sh
