name: Osquery cache diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          install: false
          cache: false
      - run: mise install ccache@4.14.1 sccache@0.17.0
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /home/runner/w/ccache/osquery/.ccache
          key: ccache-osquery-gha-github-rolling-1
          fail-on-cache-miss: true
      - name: Read saved GitHub cache statistics
        env:
          CCACHE_DIR: /home/runner/w/ccache/osquery/.ccache
        run: |
          mkdir -p "$RUNNER_TEMP/osquery-diagnostics"
          mise exec ccache@4.14.1 -- ccache --show-stats --verbose
          mise exec ccache@4.14.1 -- ccache --print-stats --format=json > "$RUNNER_TEMP/osquery-diagnostics/gha-step-1-counters.json"
      - name: Prepare pinned upstream build
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y elfutils python3-psutil python3-six python3-wheel linux-headers-generic
          curl -fsSL https://github.com/osquery/osquery-toolchain/releases/download/1.2.0/osquery-toolchain-1.2.0-x86_64.tar.xz -o "$RUNNER_TEMP/toolchain.tar.xz"
          echo '5f9755ea9c7306ada1710674b6e61202252883e01f7adc45a2dc602555c05a87  '"$RUNNER_TEMP/toolchain.tar.xz" | sha256sum --check
          sudo tar -xJf "$RUNNER_TEMP/toolchain.tar.xz" -C /usr/local
          mkdir -p /home/runner/w/ccache/osquery
          git clone --filter=blob:none --no-checkout https://github.com/osquery/osquery.git "/home/runner/w/ccache/osquery/upstream"
          git -C "/home/runner/w/ccache/osquery/upstream" checkout 6b8969bb09ba5d3c01277ad04e55b87b4021f934
      - name: Compare compile commands and cache inputs
        run: mise exec ccache@4.14.1 sccache@0.17.0 -- python3 scripts/osquery-cache-diagnostics.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: osquery-cache-diagnostics
          path: ${{ runner.temp }}/osquery-diagnostics
          retention-days: 14
          if-no-files-found: error
