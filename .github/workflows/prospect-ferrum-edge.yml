name: Prospect ferrum-edge
'on':
  push:
    branches:
    - prospect-validation
    paths:
    - .github/workflows/prospect-ferrum-edge.yml
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release override
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: prospect-ferrum-edge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  github-cold:
    name: GitHub ferrum-edge cold
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SCCACHE_DIR: ${{ github.workspace }}/source/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      RUST_BACKTRACE: '1'
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/ferrum-edge
        ref: 57f9940fbbf088e443d5a8a294636617ce3627fd
        path: source
        submodules: false
        persist-credentials: false
    - uses: ./harness/.github/actions/prospect-ferrum-edge
    - name: GitHub Rust cache
      id: cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: source -> target
        prefix-key: prospect-${{ github.run_id }}-${{ github.run_attempt }}
        shared-key: ferrum-edge
        cache-on-failure: false
        save-if: 'true'
        cache-directories: source/.cache/sccache
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py ferrum-edge github cold
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ferrum-edge-github-cold
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
  github-warm:
    name: GitHub ferrum-edge warm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SCCACHE_DIR: ${{ github.workspace }}/source/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      RUST_BACKTRACE: '1'
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/ferrum-edge
        ref: 57f9940fbbf088e443d5a8a294636617ce3627fd
        path: source
        submodules: false
        persist-credentials: false
    - uses: ./harness/.github/actions/prospect-ferrum-edge
    - name: GitHub Rust cache
      id: cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: source -> target
        prefix-key: prospect-${{ github.run_id }}-${{ github.run_attempt }}
        shared-key: ferrum-edge
        cache-on-failure: false
        save-if: 'false'
        cache-directories: source/.cache/sccache
    - name: Require the GitHub warm cache
      shell: bash
      run: test "$CACHE_HIT" = true
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py ferrum-edge github warm
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ferrum-edge-github-warm
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    needs: github-cold
  boringcache-cold:
    name: BoringCache ferrum-edge cold
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SCCACHE_DIR: ${{ github.workspace }}/source/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      RUST_BACKTRACE: '1'
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/ferrum-edge
        ref: 57f9940fbbf088e443d5a8a294636617ce3627fd
        path: source
        submodules: false
        persist-credentials: false
    - uses: ./harness/.github/actions/prospect-ferrum-edge
    - uses: ./harness/.github/actions/prospect-cli
      with:
        cli-version: ${{ inputs.cli_version }}
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py ferrum-edge boringcache cold
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ferrum-edge-boringcache-cold
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
  boringcache-warm:
    name: BoringCache ferrum-edge warm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SCCACHE_DIR: ${{ github.workspace }}/source/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      RUST_BACKTRACE: '1'
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/ferrum-edge
        ref: 57f9940fbbf088e443d5a8a294636617ce3627fd
        path: source
        submodules: false
        persist-credentials: false
    - uses: ./harness/.github/actions/prospect-ferrum-edge
    - uses: ./harness/.github/actions/prospect-cli
      with:
        cli-version: ${{ inputs.cli_version }}
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py ferrum-edge boringcache warm
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ferrum-edge-boringcache-warm
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    needs: boringcache-cold
