name: Prospect loomarr-compiler
'on':
  push:
    branches:
    - prospect-validation
    paths:
    - .github/workflows/prospect-loomarr-compiler.yml
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release override
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: prospect-loomarr-compiler-${{ github.ref }}
  cancel-in-progress: false
jobs:
  github-cold:
    name: GitHub loomarr-compiler cold
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_DIR: ${{ github.workspace }}/ccache-home
      CCACHE_MAXSIZE: 5G
      GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home
      ANDROID_CI_OUTPUT_DIR: ${{ github.workspace }}/source/.artifacts/android-ci
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/loomarr
        ref: f8d66aef8d0a698b0aa868acd66b6a8c2f43ea65
        path: source
        submodules: false
        persist-credentials: false
    - uses: ./harness/.github/actions/prospect-loomarr
      with:
        compiler-cache: 'true'
    - name: GitHub Gradle and compiler caches
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          ${{ github.workspace }}/gradle-home/caches/build-cache-*
          ${{ github.workspace }}/ccache-home
        key: prospect-loomarr-compiler-${{ github.run_id }}-${{ github.run_attempt }}
        fail-on-cache-miss: false
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py loomarr-compiler github cold
    - name: Publish GitHub Gradle and compiler caches
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          ${{ github.workspace }}/gradle-home/caches/build-cache-*
          ${{ github.workspace }}/ccache-home
        key: prospect-loomarr-compiler-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: loomarr-compiler-github-cold
        path: |-
          ${{ runner.temp }}/prospect-evidence
          source/.artifacts/android-ci/*.json
          source/web/apps/tv/android/build/reports/profile/
          source/web/**/CMakeCache.txt
          source/web/**/build.ninja
          source/web/**/.ninja_log
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
  github-warm:
    name: GitHub loomarr-compiler warm
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_DIR: ${{ github.workspace }}/ccache-home
      CCACHE_MAXSIZE: 5G
      GRADLE_USER_HOME: ${{ github.workspace }}/gradle-home
      ANDROID_CI_OUTPUT_DIR: ${{ github.workspace }}/source/.artifacts/android-ci
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/loomarr
        ref: f8d66aef8d0a698b0aa868acd66b6a8c2f43ea65
        path: source
        submodules: false
        persist-credentials: false
    - uses: ./harness/.github/actions/prospect-loomarr
      with:
        compiler-cache: 'true'
    - name: GitHub Gradle and compiler caches
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |-
          ${{ github.workspace }}/gradle-home/caches/build-cache-*
          ${{ github.workspace }}/ccache-home
        key: prospect-loomarr-compiler-${{ github.run_id }}-${{ github.run_attempt }}
        fail-on-cache-miss: true
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py loomarr-compiler github warm
    - name: Retain benchmark evidence
