name: Loomarr current-main validation
on:
  workflow_dispatch:
    inputs:
      include_baselines:
        description: Run the one- and two-worker baselines as well as the cache trials
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  baseline:
    if: inputs.include_baselines
    strategy:
      fail-fast: false
      matrix:
        workers: ['1', '2']
    uses: ./.github/workflows/prospect-loomarr-current-job.yml
    with:
      provider: baseline
      phase: cold
      workers: ${{ matrix.workers }}
      source: d435fb3f930b457ffa683b9ea5794cdb60bd2e55
  github-cold:
    uses: ./.github/workflows/prospect-loomarr-current-job.yml
    with:
      provider: github
      phase: cold
      source: d435fb3f930b457ffa683b9ea5794cdb60bd2e55
  github-warm:
    needs: github-cold
    strategy:
      fail-fast: false
      matrix:
        phase: [warm-1, warm-2]
    uses: ./.github/workflows/prospect-loomarr-current-job.yml
    with:
      provider: github
      phase: ${{ matrix.phase }}
      source: d435fb3f930b457ffa683b9ea5794cdb60bd2e55
  boringcache-cold:
    uses: ./.github/workflows/prospect-loomarr-current-job.yml
    with:
      provider: boringcache
      phase: cold
      source: d435fb3f930b457ffa683b9ea5794cdb60bd2e55
  boringcache-warm:
    needs: boringcache-cold
    strategy:
      fail-fast: false
      matrix:
        phase: [warm-1, warm-2]
    uses: ./.github/workflows/prospect-loomarr-current-job.yml
    with:
      provider: boringcache
      phase: ${{ matrix.phase }}
      source: d435fb3f930b457ffa683b9ea5794cdb60bd2e55
