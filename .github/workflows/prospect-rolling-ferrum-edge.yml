name: Prospect ferrum-edge rolling
'on':
  push:
    branches:
    - prospect-validation
    paths:
    - .github/workflows/prospect-rolling-ferrum-edge.yml
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release override
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: prospect-rolling-ferrum-edge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seed:
    name: BoringCache ferrum-edge rolling seed
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      CC: sccache cc
      CXX: sccache c++
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/target
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SCCACHE_DIR: ${{ github.workspace }}/source/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      RUST_BACKTRACE: '1'
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/ferrum-edge
        ref: 082107e37ce796e0ea477fd7f5776cb7704ce692
        path: source
        submodules: false
        persist-credentials: false
        fetch-depth: 2
    - uses: ./harness/.github/actions/prospect-ferrum-edge
    - uses: ./harness/.github/actions/prospect-cli
      with:
        cli-version: ${{ inputs.cli_version }}
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py ferrum-edge boringcache seed 0
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ferrum-edge-boringcache-rolling-seed
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
  commit1:
    name: BoringCache ferrum-edge rolling commit1
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1
      CC: sccache cc
      CXX: sccache c++
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/target
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SCCACHE_DIR: ${{ github.workspace }}/source/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: '0'
      RUST_BACKTRACE: '1'
      RUSTC_WRAPPER: sccache
      CARGO_BUILD_RUSTC_WRAPPER: sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        persist-credentials: false
    - name: Checkout pinned prospect validation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: boringcache/ferrum-edge
        ref: d66121cd51a873dbe2488560989e63cc49a6e93d
        path: source
        submodules: false
        persist-credentials: false
        fetch-depth: 2
    - uses: ./harness/.github/actions/prospect-ferrum-edge
    - uses: ./harness/.github/actions/prospect-cli
      with:
        cli-version: ${{ inputs.cli_version }}
    - name: Measure the real workload
      shell: bash
      run: python3 harness/scripts/prospects/measure.py ferrum-edge boringcache commit1 1
    - name: Retain benchmark evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ferrum-edge-boringcache-rolling-commit1
        path: ${{ runner.temp }}/prospect-evidence
        if-no-files-found: error
        retention-days: 14
        include-hidden-files: true
    needs: seed
  commit2:
    name: BoringCache ferrum-edge rolling commit2
