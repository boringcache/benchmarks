name: Prune BuildKit cache

on:
  schedule:
    - cron: "40 */2 * * *"
  workflow_dispatch:
    inputs:
      delete:
        description: delete the stale entries (otherwise list them only)
        type: boolean
        default: false
      max:
        description: most entries to delete in this run
        default: "400"

concurrency:
  group: prune-buildkit
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '400' }}
        run: bundle exec bin/bench prune-buildkit --out "$RUNNER_TEMP/stale.tsv" --max "$MAX" ${{ (github.event_name == 'schedule' || inputs.delete) && '--delete' || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildkit-stale
          path: ${{ runner.temp }}/stale.tsv
          if-no-files-found: ignore
