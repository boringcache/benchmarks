name: Publish Benchmark Index
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-benchmark-index
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: main
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      with:
        bundler-cache: true
    - name: Build canonical series catalog
      run: bin/bench catalog
    - name: Import the latest central monitor receipts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id="$(gh api 'repos/boringcache/benchmarks/actions/workflows/nightly-canaries.yml/runs?branch=main&status=completed&per_page=20' --jq '.workflow_runs | max_by(.created_at) | .id')"
        [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No completed central monitor run" >&2; exit 1; }
        gh run download "$run_id" --repo boringcache/benchmarks --name benchmark-outcomes --dir "$RUNNER_TEMP/outcomes"
        if [[ ! -f "$RUNNER_TEMP/outcomes/benchmark-outcomes-daily.json" || ! -f "$RUNNER_TEMP/outcomes/benchmark-outcomes-weekly.json" || ! -f "$RUNNER_TEMP/outcomes/benchmark-outcomes-rolling.json" ]]; then
          echo "Central cadence observations are not available yet."
          exit 0
        fi
        ruby scripts/publish-current.rb --input "$RUNNER_TEMP/outcomes" --output data/latest/current.json --history data/observations
        cp "$RUNNER_TEMP/outcomes/"*.json data/latest/
    - name: Commit and push index
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/latest
        if [[ -d data/observations ]]; then
          git add data/observations
        fi
        if git diff --cached --quiet; then
          echo "No index changes detected"
          exit 0
        fi

        git commit -m "data: refresh benchmark index"
        git push origin main
'on':
  workflow_dispatch:
  schedule:
  - cron: 30 */4 * * *
  push:
    branches:
    - main
    paths:
    - ".github/workflows/publish-index.yml"
    - ".tool-versions"
    - scripts/**
    - bin/bench
    - results/**
    - migration/evidence.json
