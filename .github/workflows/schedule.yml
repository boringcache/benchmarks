name: Rolling schedule

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: list the projects that would be dispatched without dispatching them
        type: boolean
        default: false

concurrency:
  group: rolling-schedule
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/history
          key: upstream-history-${{ steps.day.outputs.day }}
          restore-keys: upstream-history-
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          bash scripts/checkout-records.sh
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          status=0
          bundle exec bin/bench tick "${args[@]}" > "$RUNNER_TEMP/tick.txt" || status=$?
          cat "$RUNNER_TEMP/tick.txt"
          { echo '```'; cat "$RUNNER_TEMP/tick.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
