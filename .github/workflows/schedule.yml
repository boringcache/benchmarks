name: Rolling schedule

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bundle exec bin/bench rolling-projects | while IFS=$'\t' read -r tool project; do
            gh workflow run project.yml --ref main -f tool="$tool" -f project="$project" -f mode=rolling
            echo "dispatched $tool - $project (rolling)"
          done
