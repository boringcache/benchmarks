name: Seed rolling benchmarks
on:
  workflow_dispatch:
    inputs:
      replay:
        description: Replay the verified seed with identical sources.
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: benchmark-rolling-baseline
  cancel-in-progress: false
jobs:
  seed:
    if: github.ref_name == 'main' && vars.BENCHMARK_CADENCE_ACTIVE == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      - run: bundle install --jobs 4 --retry 2
      - name: Request the declared rolling observation
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY: ${{ inputs.replay }}
        run: |
          args=()
          [[ "$REPLAY" != true ]] || args+=(--replay)
          ruby scripts/seed-rolling.rb --dispatch --output "$RUNNER_TEMP/rolling-plan.json" "${args[@]}"
