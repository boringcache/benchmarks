name: Cache throughput

on:
  workflow_dispatch:
    inputs:
      mode:
        description: run (4 GiB per entry, recorded) or preflight (64 MiB per entry, not recorded)
        type: choice
        options: [run, preflight]
        default: run

run-name: Cache throughput${{ inputs.mode == 'preflight' && ' (preflight)' || '' }}

concurrency:
  group: cache-throughput
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      same: ${{ steps.matrix.outputs.same }}
      produce: ${{ steps.matrix.outputs.produce }}
      consume: ${{ steps.matrix.outputs.consume }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            throughput
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true
      - id: matrix
        env:
          RUN_ID: ${{ github.run_id }}
          PREFLIGHT: ${{ inputs.mode == 'preflight' && 'true' || '' }}
        run: bundle exec ruby scripts/throughput.rb matrix --run-id "$RUN_ID" ${PREFLIGHT:+--preflight} >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/throughput-cleanup
        with:
          prefix: throughput-

  same:
    needs: plan
    name: "same job: ${{ matrix.machine }} · ${{ matrix.lane }} · ${{ matrix.payload }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    permissions: &lane_permissions
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.same) }}
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
      - uses: ./.github/actions/throughput
        with:
          job: ${{ toJSON(matrix) }}

  produce:
    needs: [plan, same]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: "produce: ${{ matrix.machine }} · ${{ matrix.lane }} · ${{ matrix.payload }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    permissions: *lane_permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.produce) }}
    steps: *steps

  consume:
    needs: [plan, produce]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: "consume: ${{ matrix.producer_machine }} → ${{ matrix.machine }} · ${{ matrix.lane }} · ${{ matrix.payload }}"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    permissions: *lane_permissions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.consume) }}
    steps: *steps

  cleanup:
    needs: [plan, same, produce, consume]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
      - uses: ./.github/actions/throughput-cleanup
        with:
          prefix: throughput-${{ github.run_id }}-

  publish:
    needs: [plan, same, produce, consume]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref == 'refs/heads/main' && inputs.mode == 'run' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: throughput-*
          merge-multiple: true
          path: throughput/results/${{ github.run_id }}
      - env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add throughput/results
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Record cache throughput run $RUN_ID"
          for attempt in 1 2 3 4 5; do
            git push --quiet origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase --quiet origin main
          done
          exit 1
