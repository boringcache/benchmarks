name: Weekly fresh benchmarks
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact stable CLI release; empty selects the latest.
        type: string
        default: ''
      dry_run:
        description: Validate the dispatch without starting builds.
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || vars.BENCHMARK_CADENCE_ACTIVE == 'true'
    concurrency:
      group: benchmark-weekly-dispatch
      cancel-in-progress: false
    uses: ./.github/workflows/fresh-cadence.yml
    with:
      channel: stable
      cli_version: ${{ inputs.cli_version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
