name: Fresh benchmarks
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      case_id:
        description: Optional scheduled case ID; empty selects the suite.
        type: string
        default: ''
      cli_version:
        description: Optional exact CLI tag; empty uses the reviewed benchmark pin.
        type: string
        default: ''
      dry_run:
        description: Validate the dispatch without starting builds.
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || vars.BENCHMARK_CADENCE_ACTIVE == 'true' || vars.BENCHMARK_ACTIVE_CASES != '' && vars.BENCHMARK_ACTIVE_CASES != '[]'
    concurrency:
      group: benchmark-weekly-dispatch
      cancel-in-progress: false
    uses: ./.github/workflows/fresh-cadence.yml
    with:
      case_id: ${{ inputs.case_id || '' }}
      active_only: ${{ github.event_name != 'workflow_dispatch' }}
      channel: configured
      cadence: fresh
      cli_version: ${{ inputs.cli_version || '' }}
      dry_run: ${{ inputs.dry_run || false }}
