---
name: 'zed: Zed Cargo layer matrix'
run-name: Zed ${{ inputs.cadence == 'nightly' && 'Nightly' || 'Fresh' }} | ${{ inputs.cli_version }}
permissions:
  actions: read
  contents: read
env:
  BENCHMARK_EXPECTED_IDENTITY: "${{ inputs.expected_identity }}"
  COMPILER_CACHE: "${{ inputs.compiler_cache || 'sccache' }}"
  CARGO_INCREMENTAL: '0'
  ZED_BUNDLE: 'true'
  CC: clang
  CXX: clang++
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
jobs:
  source:
    name: Resolve adjacent Zed source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: "${{ steps.source.outputs.base_sha }}"
      head_sha: "${{ steps.source.outputs.head_sha }}"
      cache_layers: "${{ steps.source.outputs.cache_layers }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Select the reviewed source pair
      id: source
      env:
        INPUT_BASE_SHA: "${{ inputs.base_sha }}"
        INPUT_HEAD_SHA: "${{ inputs.head_sha }}"
        INPUT_CACHE_LAYER: "${{ inputs.cache_layer }}"
      run: |
        set -euo pipefail
        source cargo-layer-source.env
        {
          echo "base_sha=${INPUT_BASE_SHA:-$ZED_BASE_SHA}"
          echo "head_sha=${INPUT_HEAD_SHA:-$ZED_HEAD_SHA}"
          ruby -rjson -e '
            layers = %w[target-only sccache-only combined]
            selected = ENV.fetch("INPUT_CACHE_LAYER", "all")
            abort "Unsupported Zed cache layer" unless selected == "all" || layers.include?(selected)
            puts "cache_layers=#{JSON.generate(selected == "all" ? layers : [selected])}"
          '
        } >> "$GITHUB_OUTPUT"
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-24.04
  cold:
    name: 'Cold: target + ${{ inputs.compiler_cache || ''sccache'' }} seed'
    needs: source
    if: inputs.runner_label == '' || github.ref_name == 'main'
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-24.04' }}"
    timeout-minutes: 240
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Prepare the seed source and release toolchain
      run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.base_sha }}"
    - name: Install retained benchmark candidate
      if: inputs.cli_version == 'vcli-canary-b26bccd2becb'
      env:
        GH_TOKEN: "${{ github.token }}"
      run: ruby scripts/benchmark-candidate.rb "${{ inputs.cli_version }}"
    - name: Install selected compiler cache
      env:
        GH_TOKEN: "${{ github.token }}"
      run: ruby scripts/compiler-cache-setup.rb "$COMPILER_CACHE"
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Require an empty target
      run: test ! -e upstream/target
    - name: Start build and reuse timing
      id: proof_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Select the cold primary CLI plan
      run: ruby ./scripts/activate-cargo-plan.rb cold primary
    - name: Build the primary seed through the combined Cargo plan
      id: primary
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version == 'vcli-canary-b26bccd2becb' && 'skip'
          || inputs.cli_version }}"
        mode: cargo
        trust-policy: publish
        working-directory: upstream
        diagnostics: summary
      env:
        RUSTFLAGS: "-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib"
    - name: Select the cold remote-server CLI plan
      run: ruby ./scripts/activate-cargo-plan.rb cold remote-server
    - name: Build the remote server seed through the combined Cargo plan
      id: remote
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version == 'vcli-canary-b26bccd2becb' && 'skip'
          || inputs.cli_version }}"
        mode: cargo
        trust-policy: publish
        working-directory: upstream
        diagnostics: summary
      env:
        RUSTFLAGS: "-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C
          target-feature=+crt-static"
        CC_x86_64_unknown_linux_musl: musl-gcc
    - name: Capture build and reuse timing
      id: proof_timing
      run: echo "seconds=$(( $(date +%s) - ${{ steps.proof_timer.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Verify Zed release outputs
      run: |
        set -euo pipefail
        test -x upstream/target/x86_64-unknown-linux-gnu/release/zed
        test -x upstream/target/x86_64-unknown-linux-gnu/release/cli
        test -x upstream/target/x86_64-unknown-linux-musl/release/remote_server
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Write verified case records
      env:
        PROOF_SECONDS: "${{ steps.proof_timing.outputs.seconds }}"
        EVIDENCE_PATH: "${{ steps.primary.outputs.evidence-path }}"
        CACHE_HIT: "${{ steps.primary.outputs.cache-hit }}"
        CARGO_LAYER_MATRIX: "${{ needs.source.outputs.cache_layers }}"
      run: |
        set -euo pipefail
        source_sha="$(git -C upstream rev-parse HEAD)"
        mapfile -t variants < <(ruby -rjson -e 'puts JSON.parse(ENV.fetch("CARGO_LAYER_MATRIX"))')
        for variant in "${variants[@]}"; do
          ruby ./scripts/benchmark-report.rb phase \
            --benchmark zed-cargo-layers --strategy boringcache --mode cargo \
            --lane fresh --phase cold --variant "$variant" \
            --build-seconds "$PROOF_SECONDS" --cache-hit "$CACHE_HIT" --verified-output \
            --source-repository "$(git -C upstream remote get-url origin | sed -E 's#https://github.com/##; s#\.git$##')" \
            --source-sha "$source_sha" --evidence "$EVIDENCE_PATH"
        done
    - name: Report cold-layer evidence
      run: |
        ./scripts/summarize-cargo-evidence.rb \
          cold-primary "${{ steps.primary.outputs.evidence-path }}" \
          cold-remote-server "${{ steps.remote.outputs.evidence-path }}"
    - name: Retain cold product evidence
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: zed-cargo-layers-cold
        path: |
          ${{ steps.primary.outputs.evidence-path }}
          ${{ steps.remote.outputs.evidence-path }}

          benchmark-results/*.json
        if-no-files-found: error
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-24.04' }}"
  reuse:
    name: "${{ inputs.compiler_cache || 'sccache' }} ${{ matrix.cache_layer == 'sccache-only'
      && 'compiler-only' || matrix.cache_layer }}: changed source"
    needs:
    - source
    - cold
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-24.04' }}"
    timeout-minutes: 240
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Prepare the adjacent source and release toolchain
      run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{
        needs.source.outputs.base_sha }}"
    - name: Install retained benchmark candidate
      if: inputs.cli_version == 'vcli-canary-b26bccd2becb'
      env:
        GH_TOKEN: "${{ github.token }}"
      run: ruby scripts/benchmark-candidate.rb "${{ inputs.cli_version }}"
    - name: Install selected compiler cache
      env:
        GH_TOKEN: "${{ github.token }}"
      run: ruby scripts/compiler-cache-setup.rb "$COMPILER_CACHE"
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
      if: "${{ matrix.cache_layer != 'target-only' }}"
    - name: Require an empty target
      run: test ! -e upstream/target
    - name: Start build and reuse timing
      id: proof_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Select the primary CLI plan
      run: ruby ./scripts/activate-cargo-plan.rb "$CARGO_LAYER" primary
    - name: Build primary with the selected Cargo plan
      id: primary
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version == 'vcli-canary-b26bccd2becb' && 'skip'
          || inputs.cli_version }}"
        mode: cargo
        trust-policy: restore
        working-directory: upstream
        diagnostics: summary
      env:
        RUSTFLAGS: "-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib"
    - name: Select the remote-server CLI plan
      run: ruby ./scripts/activate-cargo-plan.rb "$CARGO_LAYER" remote-server
    - name: Build remote server with the selected Cargo plan
      id: remote
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version == 'vcli-canary-b26bccd2becb' && 'skip'
          || inputs.cli_version }}"
        mode: cargo
        trust-policy: restore
        working-directory: upstream
        diagnostics: summary
      env:
        RUSTFLAGS: "-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib -C
          target-feature=+crt-static"
        CC_x86_64_unknown_linux_musl: musl-gcc
    - name: Capture build and reuse timing
      id: proof_timing
      run: echo "seconds=$(( $(date +%s) - ${{ steps.proof_timer.outputs.started_at
        }} ))" >> "$GITHUB_OUTPUT"
    - name: Verify Zed release outputs
      run: |
        set -euo pipefail
        test -x upstream/target/x86_64-unknown-linux-gnu/release/zed
        test -x upstream/target/x86_64-unknown-linux-gnu/release/cli
        test -x upstream/target/x86_64-unknown-linux-musl/release/remote_server
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Write verified case records
      env:
        PROOF_SECONDS: "${{ steps.proof_timing.outputs.seconds }}"
        EVIDENCE_PATH: "${{ steps.primary.outputs.evidence-path }}"
        CACHE_HIT: "${{ steps.primary.outputs.cache-hit }}"
      run: |
        set -euo pipefail
        source_sha="$(git -C upstream rev-parse HEAD)"
        ruby ./scripts/benchmark-report.rb phase \
          --benchmark zed-cargo-layers --strategy boringcache --mode cargo \
          --lane rolling --phase commit --variant "$CARGO_LAYER" \
          --build-seconds "$PROOF_SECONDS" --cache-hit "$CACHE_HIT" --verified-output \
          --source-repository "$(git -C upstream remote get-url origin | sed -E 's#https://github.com/##; s#\.git$##')" \
          --source-sha "$source_sha" --evidence "$EVIDENCE_PATH"
    - name: Verify restore and report layer evidence
      run: |
        set -euo pipefail
        if [[ "$CARGO_LAYER" != sccache-only ]]; then
          test "$CACHE_HIT" = true
        fi
        ./scripts/summarize-cargo-evidence.rb \
          "$CARGO_LAYER-primary" "${{ steps.primary.outputs.evidence-path }}" \
          "$CARGO_LAYER-remote-server" "${{ steps.remote.outputs.evidence-path }}"
      env:
        CACHE_HIT: "${{ steps.primary.outputs.cache-hit }}"
    - name: Retain selected product evidence
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: zed-cargo-layers-${{ matrix.cache_layer }}
        path: |
          ${{ steps.primary.outputs.evidence-path }}
          ${{ steps.remote.outputs.evidence-path }}

          benchmark-results/*.json
        if-no-files-found: error
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-24.04' }}"
      CARGO_LAYER: "${{ matrix.cache_layer }}"
    strategy:
      fail-fast: false
      matrix:
        cache_layer: "${{ fromJSON(needs.source.outputs.cache_layers) }}"
  report:
    name: Compare Cargo layers
    needs:
    - cold
    - reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Download every lane's product evidence
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: zed-cargo-layers-*
        path: layer-evidence
    - name: Publish the independent layer report
      run: |
        set -euo pipefail
        mkdir -p benchmark-results
        args=()
        while IFS= read -r evidence; do
          label="$(basename "$(dirname "$evidence")")/$(basename "$evidence")"
          args+=("$label" "$evidence")
        done < <(find layer-evidence -type f -name '*.json' -print | sort)
        test "${#args[@]}" -gt 0
        ./scripts/summarize-cargo-evidence.rb "${args[@]}" |
          tee benchmark-results/zed-cargo-layer-matrix.md
    - name: Retain the layer report
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-zed-cargo-layer-matrix
        path: benchmark-results/zed-cargo-layer-matrix.md
        if-no-files-found: error
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-24.04
'on':
  workflow_dispatch:
    inputs:
      expected_identity:
        description: Frozen scheduled harness and case identity; checked before preparation.
        type: string
        required: false
        default: ''
      compiler_cache:
        description: Compiler cache engine for this qualification
        type: choice
        default: sccache
        options:
        - sccache
        - kache
        - mbx
      cli_version:
        description: Optional exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      base_sha:
        description: Seed commit. Defaults to cargo-layer-source.env.
        required: false
        type: string
        default: ''
      head_sha:
        description: Adjacent commit built by every warm lane. Defaults to cargo-layer-source.env.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
      cache_layer:
        description: Restore variant; all runs the diagnostic layer matrix
        required: false
        type: choice
        default: all
        options:
        - all
        - target-only
        - sccache-only
        - combined
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
  workflow_call:
    inputs:
      expected_identity:
        description: Frozen scheduled harness and case identity; checked before preparation.
        type: string
        required: false
        default: ''
      compiler_cache:
        description: Compiler cache engine for this qualification
        type: string
        default: sccache
      cli_version:
        description: Optional exact immutable BoringCache CLI release tag.
        required: false
        type: string
        default: ''
      base_sha:
        description: Seed commit. Defaults to cargo-layer-source.env.
        required: false
        type: string
        default: ''
      head_sha:
        description: Adjacent commit built by every warm lane. Defaults to cargo-layer-source.env.
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner label for a manual main-branch experiment.
        required: false
        type: string
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
      cache_layer:
        description: Restore variant; all runs the diagnostic layer matrix
        required: false
        type: string
        default: all
      cadence:
        type: string
        default: fresh
        description: Fresh or nightly scheduling; measured phases retain the fresh
          lane.
