      run: ruby .harness/bin/bench prepare "$BENCHMARK_CASE_ID" --directory "$GITHUB_WORKSPACE"
    - name: Prepare the adjacent source and release toolchain
      run: ./scripts/prepare-zed-lane.sh "${{ needs.source.outputs.head_sha }}" "${{
        needs.source.outputs.base_sha }}"
    - name: Require an empty target
      run: test ! -e upstream/target
    - name: Start build and reuse timing
      id: proof_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Select the target-only primary CLI plan
      run: ruby ./scripts/activate-cargo-plan.rb target-only primary
    - name: Build primary with the target-only Cargo plan
      id: primary
      uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1.33.0
      with:
        cli-version: "${{ inputs.cli_version }}"
        mode: cargo
        trust-policy: restore
        working-directory: upstream
        fail-on-cache-error: true
        diagnostics: summary
      env:
        RUSTFLAGS: "-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib"
    - name: Select the target-only remote-server CLI plan
      run: ruby ./scripts/activate-cargo-plan.rb target-only remote-server
    - name: Build remote server with the target-only Cargo plan
      id: remote
      uses: boringcache/one@f0fb9b2d926a32b10c543e92093ba00c5a291b79 # v1.33.0
      with:
        cli-version: "${{ inputs.cli_version }}"
        mode: cargo
