  report:
    name: Compare Cargo layers
    needs:
    - cold
    - target-only
    - sccache-only
    - combined
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Set up benchmark Ruby
