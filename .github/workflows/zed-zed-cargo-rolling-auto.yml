---
name: 'zed: Zed Cargo rolling run'
run-name: "zed Rolling | ${{ inputs.cli_version }}"
permissions:
  actions: read
  checks: read
  contents: read
concurrency:
  group: benchmark-zed-cargo-rolling-chain
  cancel-in-progress: false
  queue: max
jobs:
  source:
    name: Resolve Zed source
    runs-on: ubuntu-24.04
    outputs:
      base_sha: "${{ steps.source.outputs.ZED_BASE_SHA }}"
      head_sha: "${{ steps.source.outputs.ZED_HEAD_SHA }}"
      source_repository: "${{ steps.source.outputs.ZED_SOURCE_REPOSITORY }}"
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Read pinned source
      id: source
      env:
        INPUT_BASE_SHA: "${{ inputs.base_sha }}"
      run: |
        set -euo pipefail
        source benchmark-source.env
        test "$INPUT_BASE_SHA" = "$ZED_HEAD_SHA"
        sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"
    env:
      BENCHMARK_RUNNER_CLASS: ubuntu-24.04
  advance:
    name: "${{ inputs.provider }} Zed Cargo commit"
    needs: source
    runs-on: "${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
      && inputs.runner_label || 'ubuntu-24.04' }}"
    timeout-minutes: 240
    env:
      DEPOT_TOKEN: ${{ inputs.provider == 'depot-cache' && secrets.DEPOT_TOKEN || '' }}
      RESOLVED_BASE_SHA: "${{ inputs.base_sha }}"
      RESOLVED_HEAD_SHA: "${{ inputs.head_sha }}"
      RESOLVED_SOURCE_DISTANCE: "${{ inputs.source_distance }}"
      BENCHMARK_RUNNER_CLASS: "${{ github.event_name == 'workflow_dispatch' && github.ref_name
        == 'main' && inputs.runner_label || 'ubuntu-24.04' }}"
    steps:
    - name: Start the workflow timer
      id: workflow_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Checkout the selected Zed source
      run: |
        set -euo pipefail
        git submodule sync --recursive
        git -c protocol.version=2 submodule update --init --depth 2 --recommend-shallow --jobs 4 upstream
        if [[ ! "$RESOLVED_SOURCE_DISTANCE" =~ ^[0-9]+$ ]]; then
          echo "Invalid source distance: $RESOLVED_SOURCE_DISTANCE" >&2
          exit 1
        fi
        fetch_depth=$((RESOLVED_SOURCE_DISTANCE + 1))
        git -C upstream fetch --no-tags --depth "$fetch_depth" origin "$RESOLVED_HEAD_SHA"
        git -C upstream checkout --detach "$RESOLVED_HEAD_SHA"
        test "$(git -C upstream rev-parse HEAD)" = "$RESOLVED_HEAD_SHA"
        git -C upstream merge-base --is-ancestor "$RESOLVED_BASE_SHA" "$RESOLVED_HEAD_SHA"
        test "$(git -C upstream rev-list --count "${RESOLVED_BASE_SHA}..${RESOLVED_HEAD_SHA}")" = "$RESOLVED_SOURCE_DISTANCE"
        git -C upstream clean -fdx
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Install Zed's release toolchain
      run: "./scripts/install-zed-toolchain.sh"
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
    - name: Free runner disk space
      run: "./scripts/free-runner-disk.sh"
    - name: Require an empty destination
      run: test ! -e upstream/target
    - name: Start the build timer
      id: build_timer
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Run the released Cargo product
      id: cache
      if: inputs.provider != 'depot-cache'
      uses: "./.github/actions/boringcache"
      with:
        cli-version: "${{ inputs.cli_version }}"
        mode: cargo
        trust-policy: publish
        working-directory: upstream
    - name: Build with the native Depot compiler cache
      id: depot_cargo
      if: inputs.provider == 'depot-cache'
      uses: ./.github/actions/remote-compiler-cache
      env:
        DENO_SNAPSHOT_MINIFY_SOURCES: '1'

    - name: Capture the build timing
      id: build_timing
      env:
        BUILD_STARTED_AT: "${{ steps.build_timer.outputs.started_at }}"
      run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
    - name: Verify the Zed build
      run: |
        set -euo pipefail
        test -x upstream/target/release/zed
        test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
    - name: Write the benchmark phase evidence
      env:
        CACHE_PROVIDER: ${{ inputs.provider }}
        WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
        BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
        CACHE_HIT: "${{ steps.cache.outputs.cache-hit || steps.depot_cargo.outputs.cache-hit }}"
        EVIDENCE_PATH: "${{ steps.cache.outputs.evidence-path }}"
        GITHUB_TOKEN: "${{ github.token }}"
        SOURCE_REPOSITORY: "${{ needs.source.outputs.source_repository }}"
        SOURCE_SHA: "${{ env.RESOLVED_HEAD_SHA }}"
      run: |
        set -euo pipefail
        ruby ./scripts/benchmark-report.rb phase \
          --benchmark zed-cargo \
          --strategy "$CACHE_PROVIDER" \
          --lane rolling \
          --phase commit \
          --mode cargo \
          --build-seconds "$BUILD_SECONDS" --verified-output \
          --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
          --cache-hit "$CACHE_HIT" \
          --source-repository "$SOURCE_REPOSITORY" \
          --source-sha "$SOURCE_SHA" \
          --evidence "$EVIDENCE_PATH"
    - name: Retain the original Cargo rolling phase
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: phase-zed-cargo-${{ inputs.provider }}-rolling-commit
        path: benchmark-results/
        if-no-files-found: error
    - name: Publish the Zed Cargo rolling benchmark report
      run: |
        ruby ./scripts/benchmark-report.rb summarize \
          --title "Zed Cargo rolling benchmark" \
          --input-dir benchmark-results \
          --output-dir benchmark-results
    - name: Retain the Zed Cargo rolling result
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark-zed-cargo-${{ inputs.provider }}-rolling
        path: benchmark-results/zed-cargo-${{ inputs.provider }}-rolling.json
        if-no-files-found: error
    - name: Publish rolling run summary
      run: |
        {
          echo "## Zed Cargo rolling run"
          echo
          echo "- Cache provider: ${{ inputs.provider }}"
          echo "- CLI: \`${{ inputs.cli_version }}\`"
          echo "- Source: \`${RESOLVED_BASE_SHA}\` → \`${RESOLVED_HEAD_SHA}\`"
          echo "- Commit distance: \`${RESOLVED_SOURCE_DISTANCE}\`"
          echo "- Product target available before the source build: \`${{ steps.cache.outputs.cache-hit }}\`"
          echo "- Native compiler hit observed: \`${{ steps.depot_cargo.outputs.cache-hit }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Retain product evidence
      if: inputs.provider != 'depot-cache'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: zed-cargo-rolling-${{ env.RESOLVED_HEAD_SHA }}
        path: "${{ steps.cache.outputs.evidence-path }}"
        if-no-files-found: error
    - name: Retain Depot compiler evidence
      if: always() && inputs.provider == 'depot-cache'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: compiler-zed-depot-cache-rolling
        path: |
          benchmark-results/sccache/
          .depot-cache/configuration.json
        if-no-files-found: warn
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
  publish-source:
    name: Publish the verified Zed source
    needs:
    - source
    - advance
    if: inputs.provider != 'depot-cache' && needs.advance.result == 'success' && inputs.observation != 'seed' && inputs.observation != 'replay'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE_SHA: "${{ inputs.base_sha }}"
      EXPECTED_HEAD_SHA: "${{ inputs.head_sha }}"
      BENCHMARK_RUNNER_CLASS: ubuntu-24.04
    steps:
    - name: Checkout benchmark definitions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: ".harness"
        persist-credentials: false
    - name: Prepare declared case
      uses: "./.harness/.github/actions/prepare-case"
      with:
        case-id: zed
    - name: Advance the verified source pair
      id: source
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        ./scripts/advance-source-pair.sh benchmark-source.env ZED check_dependencies "$EXPECTED_HEAD_SHA"
        source benchmark-source.env
        test "$ZED_BASE_SHA" = "$EXPECTED_BASE_SHA"
        test "$ZED_HEAD_SHA" = "$EXPECTED_HEAD_SHA"
    - name: Prepare the verified source proposal
      run: ruby .harness/bin/bench update-source zed --directory "$GITHUB_WORKSPACE"
    - name: Retain the verified source proposal
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: zed-verified-source-proposal
        path: |-
          .harness/cases/zed/case.json
          .harness/cases/zed/payload/benchmark-source.env
        if-no-files-found: error
'on':
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [boringcache, depot-cache]
        default: boringcache
      observation:
        description: Seed, identical-source replay, or changed-source build.
        type: string
        default: changed-source
      base_sha:
        description: Source commit currently represented by the published target.
        required: true
        type: string
      head_sha:
        description: Dependency-verified descendant to build and publish as the next
          seed.
        required: true
        type: string
      source_distance:
        description: Number of first-parent commits from the published seed to the
          selected source.
        required: true
        type: string
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        required: false
        type: string
        default: ''
      runner_label:
        description: Optional runner for a main-branch experiment
        type: string
        required: false
        default: ''
      series_id:
        description: Predeclared series ID; empty for legacy diagnostics
        type: string
        required: false
        default: ''
      sample:
        description: Observation number in the predeclared series
        type: string
        required: false
        default: '1'
  workflow_call:
    inputs:
      provider:
        type: string
        default: boringcache
      observation:
        description: Seed, identical-source replay, or changed-source build.
        type: string
        default: changed-source
      base_sha:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      source_distance:
        type: string
        required: true
      cli_version:
        type: string
        default: ''
      runner_label:
        type: string
        default: ''
      series_id:
        type: string
        default: ''
      sample:
        type: string
        default: '1'
env:
  BENCHMARK_OBSERVATION: "${{ inputs.observation || 'changed-source' }}"
  BENCHMARK_SERIES_ID: "${{ inputs.series_id }}"
  BENCHMARK_SAMPLE: "${{ inputs.sample }}"
