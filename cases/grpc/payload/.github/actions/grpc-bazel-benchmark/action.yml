name: Run gRPC Bazel benchmark phase
description: Runs one gRPC Bazel cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  r2_access_key_id:
    required: false
    default: ''
  r2_secret_access_key:
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Checkout pinned gRPC source
    shell: bash
    run: |
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
  - name: Verify the bounded benchmark plan
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean gRPC source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
    run: |
      set -euo pipefail
      cohort="$(ruby ./scripts/benchmark-phase.rb scope)"
      gha_prefix="ac-${cohort}-"
      if [[ "$CACHE_LANE" == "rolling" ]]; then
        gha_key="${gha_prefix}r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
      else
        gha_key="${gha_prefix}cold"
      fi
      ruby ./scripts/scope-case-cache.rb "$cohort"
      {
        echo "cohort=${cohort}"
        echo "gha_prefix=${gha_prefix}"
        echo "gha_key=${gha_key}"
        echo "buildbuddy_instance=${cohort}"
      } >> "$GITHUB_OUTPUT"
      source_url="$(git config -f .gitmodules submodule.upstream.url)"
      echo "source_repository=$(printf '%s' "${source_url#https://github.com/}" | sed 's/\.git$//')" >> "$GITHUB_OUTPUT"
      echo "source_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  - name: Start the provider setup timer
    id: setup_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Install pinned NativeLink
    if: inputs.strategy == 'nativelink'
    shell: bash
    run: ruby ./scripts/nativelink-cache.rb install
  - name: Start NativeLink with R2 storage
    if: inputs.strategy == 'nativelink'
    shell: bash
    env:
      AWS_ACCESS_KEY_ID: "${{ inputs.r2_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "${{ inputs.r2_secret_access_key }}"
      NATIVELINK_INSTANCE: "${{ steps.scope.outputs.cohort }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      PHASE: "${{ inputs.phase }}"
      NATIVELINK_ARTIFACT: "nativelink-${{ inputs.benchmark_id }}-${{ inputs.cache_lane }}-${{ inputs.phase }}"
    run: ruby ./scripts/nativelink-cache.rb start
  - name: Restore the GitHub Actions cache
    if: inputs.strategy == 'actions-cache'
    uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ env.BAZEL_DISK_CACHE }}"
      key: "${{ steps.scope.outputs.gha_key }}"
      restore-keys: "${{ inputs.cache_lane == 'rolling' && steps.scope.outputs.gha_prefix
        || '' }}"
      fail-on-cache-miss: "${{ inputs.phase == 'warm' }}"
    id: actions_cache_0
  - name: Configure BoringCache publish
    id: publish
    if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
    uses: ./.github/actions/boringcache
    with:
      cli-version: "${{ inputs.cli_version }}"
      mode: bazel
      trust-policy: publish
      working-directory: upstream
  - name: Configure BoringCache restore
    id: restore
    if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
    uses: ./.github/actions/boringcache
    with:
      cli-version: "${{ inputs.cli_version }}"
      mode: bazel
      trust-policy: restore
      working-directory: upstream
      fail-on-cache-miss: true
  - name: Start the build timer
    id: build_timer
    shell: bash
    env:
      SETUP_STARTED_AT: "${{ steps.setup_timer.outputs.started_at }}"
    run: |
      set -euo pipefail
      now="$(date +%s)"
      echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      echo "started_at=${now}" >> "$GITHUB_OUTPUT"
  - name: Build the gRPC target
    shell: bash
    env:
      NATIVELINK_INSTANCE: "${{ steps.scope.outputs.cohort }}"
      NATIVELINK_PHASE: "${{ inputs.phase }}"
      BAZEL_CACHE_STRATEGY: "${{ inputs.strategy }}"
      BUILDBUDDY_REMOTE_INSTANCE_NAME: "${{ steps.scope.outputs.buildbuddy_instance
        }}"
      BUILDBUDDY_REMOTE_UPLOAD_LOCAL_RESULTS: "${{ inputs.phase == 'warm' && 'false'
        || 'true' }}"
    run: |
      set -euo pipefail
      mkdir -p benchmark-results/bazel
      if [[ "$BAZEL_CACHE_STRATEGY" == "nativelink" ]]; then
        ruby ./scripts/run-grpc-bazel-build.rb 2>&1 | tee benchmark-results/nativelink/build.log benchmark-results/bazel/build.log
      else
        ruby ./scripts/run-grpc-bazel-build.rb 2>&1 | tee benchmark-results/bazel/build.log
      fi
  - name: Capture the build timing
    id: build_timing
    shell: bash
    env:
      BUILD_STARTED_AT: "${{ steps.build_timer.outputs.started_at }}"
    run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
  - name: Record native Bazel cache reuse
    id: native_cache
    shell: bash
    env:
      PHASE: "${{ inputs.phase }}"
    run: ruby ./scripts/grpc-bazel-evidence.rb benchmark-results/bazel/build.log
  - name: Retain native Bazel cache evidence
    if: always()
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: bazel-cache-${{ inputs.strategy }}-${{ inputs.phase }}
      path: benchmark-results/bazel/cache-evidence.json
      if-no-files-found: warn
      retention-days: 90
  - name: Verify the gRPC binaries
    id: output_verification
    shell: bash
    run: |
      set -euo pipefail
      for binary in upstream/bazel-bin/examples/cpp/csm/csm_greeter_{client,server}; do
        test -s "$binary"
        test -x "$binary"
        file "$binary"
      done
  - name: Verify NativeLink reuse and measure R2 storage
    id: nativelink
    if: inputs.strategy == 'nativelink'
    shell: bash
    env:
      AWS_ACCESS_KEY_ID: "${{ inputs.r2_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "${{ inputs.r2_secret_access_key }}"
      NATIVELINK_INSTANCE: "${{ steps.scope.outputs.cohort }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      PHASE: "${{ inputs.phase }}"
      NATIVELINK_ARTIFACT: "nativelink-${{ inputs.benchmark_id }}-${{ inputs.cache_lane }}-${{ inputs.phase }}"
    run: ruby ./scripts/nativelink-cache.rb finish
  - name: Save the GitHub Actions cache
    if: inputs.strategy == 'actions-cache' && inputs.phase == 'publish'
    uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ env.BAZEL_DISK_CACHE }}"
      key: "${{ steps.scope.outputs.gha_key }}"
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase
        == 'warm' && 'warm' || 'cold' }}"
      WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
      SETUP_SECONDS: "${{ steps.build_timer.outputs.setup_seconds }}"
      BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
      CACHE_HIT: "${{ steps.native_cache.outputs.cache_hit }}"
      EVIDENCE_PATH: "${{ steps.publish.outputs.evidence-path || steps.restore.outputs.evidence-path
        }}"
      STORAGE_KEY: "${{ steps.scope.outputs.gha_key }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_REPOSITORY: "${{ steps.scope.outputs.source_repository }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
    run: |
      set -euo pipefail
      ruby ./scripts/benchmark-report.rb phase \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --mode bazel \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository "$SOURCE_REPOSITORY" \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH" \
        --verified-output
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane
        }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm'
        && 'warm' || 'cold' }}
      path: benchmark-results/*.json
      if-no-files-found: error
  - name: Stop NativeLink
    if: always() && inputs.strategy == 'nativelink'
    shell: bash
    run: ruby ./scripts/nativelink-cache.rb stop
  - name: Retain NativeLink diagnostics
    if: always() && inputs.strategy == 'nativelink'
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: nativelink-${{ inputs.benchmark_id }}-${{ inputs.cache_lane }}-${{ inputs.phase }}
      path: benchmark-results/nativelink/
      if-no-files-found: warn
