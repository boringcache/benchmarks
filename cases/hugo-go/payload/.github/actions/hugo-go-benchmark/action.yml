---
name: Run Hugo Go benchmark phase
description: Runs one Hugo Go cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  go_version:
    required: true
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Checkout pinned Hugo source
    shell: bash
    run: |
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
  - name: Verify the upstream benchmark recipe
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean Hugo source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      CACHE_LANE: "${{ inputs.cache_lane }}"
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
    run: |
      set -euo pipefail
      cache_scope="$(ruby ./scripts/benchmark-phase.rb scope)"
      ruby ./scripts/scope-case-cache.rb "$cache_scope"
      source_sha="$(git rev-parse HEAD:upstream)"
      echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      echo "cache_key=go-${cache_scope}-${source_sha}" >> "$GITHUB_OUTPUT"
      echo "source_repository=gohugoio/hugo" >> "$GITHUB_OUTPUT"
      echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
  - name: Set up Go
    uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
    with:
      go-version: "${{ inputs.go_version }}"
      cache: false
  - name: Start the provider setup timer
    id: setup_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Restore the GitHub Actions cache
    if: inputs.strategy == 'actions-cache' && inputs.phase == 'publish'
    uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ github.workspace }}/.go/build-cache"
      key: "${{ steps.scope.outputs.cache_key }}"
      restore-keys: 'go-${{ steps.scope.outputs.cache_scope }}-

        '
    id: actions_cache_0
  - name: Restore the exact GitHub Actions cache
    if: inputs.strategy == 'actions-cache' && inputs.phase == 'warm'
    uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
    with:
      path: "${{ github.workspace }}/.go/build-cache"
      key: "${{ steps.scope.outputs.cache_key }}"
      fail-on-cache-miss: true
    id: actions_cache_1
  - name: Publish with BoringCache
    id: boringcache-publish
    if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
    uses: "./.github/actions/boringcache"
    with:
      cli-version: "${{ inputs.cli_version }}"
      mode: go
      trust-policy: publish
      working-directory: upstream
    env:
      GOCACHE: "${{ github.workspace }}/.go/build-cache"
  - name: Restore with BoringCache
    id: boringcache-restore
    if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
    uses: "./.github/actions/boringcache"
    with:
      cli-version: "${{ inputs.cli_version }}"
      mode: go
      trust-policy: restore
      working-directory: upstream
      fail-on-cache-miss: true
    env:
      GOCACHE: "${{ github.workspace }}/.go/build-cache"
  - name: Start the build timer
    id: build_timer
    shell: bash
    env:
      SETUP_STARTED_AT: "${{ steps.setup_timer.outputs.started_at }}"
    run: |
      set -euo pipefail
      now="$(date +%s)"
      echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      echo "started_at=${now}" >> "$GITHUB_OUTPUT"
  - name: Build Hugo
    shell: bash
    env:
      GOCACHE: "${{ github.workspace }}/.go/build-cache"
    run: ruby ./scripts/run-benchmark-plan.rb go --working-directory upstream
  - name: Capture the build timing
    id: build_timing
    shell: bash
    env:
      BUILD_STARTED_AT: "${{ steps.build_timer.outputs.started_at }}"
    run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
  - name: Verify the Hugo build
    shell: bash
    run: |
      set -euo pipefail
      artifact="$(go env GOPATH)/bin/dragonfly_amd64/hugo"
      test -x "$artifact"
      test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase
        == 'warm' && 'warm' || 'cold' }}"
      WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
      SETUP_SECONDS: "${{ steps.build_timer.outputs.setup_seconds }}"
      BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
      CACHE_HIT: "${{ steps.boringcache-publish.outputs.cache-hit || steps.boringcache-restore.outputs.cache-hit
        || steps.actions_cache_0.outputs.cache-hit || steps.actions_cache_1.outputs.cache-hit
        }}"
      EVIDENCE_PATH: "${{ steps.boringcache-publish.outputs.evidence-path || steps.boringcache-restore.outputs.evidence-path
        }}"
      STORAGE_KEY: "${{ steps.scope.outputs.cache_key }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_REPOSITORY: "${{ steps.scope.outputs.source_repository }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
    run: |
      set -euo pipefail
      ruby ./scripts/benchmark-report.rb phase --verified-output \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --mode go \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository "$SOURCE_REPOSITORY" \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH"
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane
        }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm'
        && 'warm' || 'cold' }}
      path: benchmark-results/
      if-no-files-found: error
