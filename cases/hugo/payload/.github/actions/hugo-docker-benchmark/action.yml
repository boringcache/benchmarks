name: Run Hugo Docker benchmark phase
description: Runs one Hugo Docker cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  push_image:
    required: false
    default: 'false'
  load_image:
    required: false
    default: 'false'
  cli_version:
    required: false
    default: ''
  cli_platform:
    required: false
    default: ''
  buildkit_image:
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Checkout pinned Hugo source
    shell: bash
    run: |
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
  - name: Verify the upstream benchmark recipe
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean Hugo source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
    run: |
      set -euo pipefail
      ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
      ref_slug="${ref_slug#-}"
      ref_slug="${ref_slug%-}"
      ref_slug="${ref_slug:-main}"
      if [[ "$CACHE_LANE" == "rolling" ]]; then cache_scope="${BENCHMARK_ID}-rolling-${ref_slug}"; else cache_scope="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"; fi
      if [[ -n "${BENCHMARK_SERIES_ID:-}" ]]; then
        [[ "$BENCHMARK_SERIES_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 1
        [[ "${BENCHMARK_SAMPLE:-}" =~ ^[1-9][0-9]*$ ]] || exit 1
        if [[ "$CACHE_LANE" == "rolling" ]]; then
          cache_scope="${BENCHMARK_ID:-benchmark}-series-${BENCHMARK_SERIES_ID}"
        else
          cache_scope="${BENCHMARK_ID:-benchmark}-series-${BENCHMARK_SERIES_ID}-s${BENCHMARK_SAMPLE}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
        fi
      fi
      ruby ./scripts/scope-case-cache.rb "$cache_scope"
      echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      source_url="$(git config -f .gitmodules submodule.upstream.url)"
      echo "source_repository=$(printf '%s' "${source_url#https://github.com/}" | sed 's/\.git$//')" >> "$GITHUB_OUTPUT"
      echo "source_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  - name: Activate the BoringCache Docker plan
    if: inputs.strategy == 'boringcache'
    shell: bash
    env:
      LOAD_IMAGE: "${{ inputs.load_image }}"
      PUSH_IMAGE: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main'
        }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/hugo-benchmark:boringcache
    run: ruby ./scripts/activate-docker-plan.rb --push "$PUSH_IMAGE" --image "$IMAGE" --load "$LOAD_IMAGE"
  - name: Log in to the GitHub Container Registry
    if: inputs.push_image == 'true' && github.ref == 'refs/heads/main'
    uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
    with:
      registry: ghcr.io
      username: "${{ github.actor }}"
      password: "${{ github.token }}"
  - name: Start the provider setup timer
    id: setup_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Set up Buildx for the GitHub Actions comparison
    if: inputs.strategy == 'actions-cache'
    uses: ./.github/actions/setup-docker
  - name: Start the build timer
    id: build_timer
    shell: bash
    env:
      SETUP_STARTED_AT: "${{ steps.setup_timer.outputs.started_at }}"
    run: |
      set -euo pipefail
      now="$(date +%s)"
      echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
      echo "started_at=${now}" >> "$GITHUB_OUTPUT"
  - name: Build with the GitHub Actions cache
    if: inputs.strategy == 'actions-cache'
    uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    with:
      context: upstream
      file: upstream/Dockerfile
      tags: ghcr.io/${{ github.repository_owner }}/hugo-benchmark:actions-cache
      push: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}"
      load: "${{ inputs.load_image == 'true' }}"
      build-args: HUGO_BUILD_TAGS=extended,withdeploy
      provenance: "${{ inputs.load_image != 'true' && 'mode=max' || 'false' }}"
      sbom: "${{ inputs.load_image != 'true' }}"
      cache-from: type=gha,scope=${{ steps.scope.outputs.cache_scope }}
      cache-to: type=gha,scope=${{ steps.scope.outputs.cache_scope }},mode=max
  - name: Publish with BoringCache
    id: publish
    if: inputs.strategy == 'boringcache' && inputs.phase == 'publish'
    uses: ./.github/actions/boringcache
    env:
      BORINGCACHE_MANAGED_BUILDKIT_IMAGE: "${{ inputs.buildkit_image }}"
    with:
      cli-version: "${{ inputs.cli_version }}"
      cli-platform: "${{ inputs.cli_platform }}"
      mode: docker
      trust-policy: publish
  - name: Restore with BoringCache
    id: restore
    if: inputs.strategy == 'boringcache' && inputs.phase == 'warm'
    uses: ./.github/actions/boringcache
    env:
      BORINGCACHE_MANAGED_BUILDKIT_IMAGE: "${{ inputs.buildkit_image }}"
    with:
      cli-version: "${{ inputs.cli_version }}"
      cli-platform: "${{ inputs.cli_platform }}"
      mode: docker
      trust-policy: restore
      fail-on-cache-miss: true
  - name: Capture the build timing
    id: build_timing
    shell: bash
    env:
      BUILD_STARTED_AT: "${{ steps.build_timer.outputs.started_at }}"
    run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"
  - name: Verify the Docker output
    id: output_verification
    shell: bash
    env:
      STRATEGY: "${{ inputs.strategy }}"
      LOAD_IMAGE: "${{ inputs.load_image }}"
      PUSH_IMAGE: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/hugo-benchmark:actions-cache
    run: ruby ./scripts/verify-docker-output.rb --strategy "$STRATEGY" --load "$LOAD_IMAGE" --push "$PUSH_IMAGE" --image "$IMAGE"
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      OUTPUT_VERIFIED: "${{ steps.output_verification.outputs.verified }}"
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase
        == 'warm' && 'warm' || 'cold' }}"
      WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
      SETUP_SECONDS: "${{ steps.build_timer.outputs.setup_seconds }}"
      BUILD_SECONDS: "${{ steps.build_timing.outputs.build_seconds }}"
      CACHE_HIT: "${{ steps.publish.outputs.cache-hit || steps.restore.outputs.cache-hit
        }}"
      EVIDENCE_PATH: "${{ steps.publish.outputs.evidence-path || steps.restore.outputs.evidence-path
        }}"
      STORAGE_KEY: "${{ steps.scope.outputs.cache_scope }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_REPOSITORY: "${{ steps.scope.outputs.source_repository }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
    run: |
      set -euo pipefail
      verification=()
      [[ "$OUTPUT_VERIFIED" != 'true' ]] || verification=(--verified-output)
      ruby ./scripts/benchmark-report.rb phase "${verification[@]}" \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --mode docker \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository "$SOURCE_REPOSITORY" \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH"
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane
        }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm'
        && 'warm' || 'cold' }}
      path: benchmark-results/
      if-no-files-found: error
