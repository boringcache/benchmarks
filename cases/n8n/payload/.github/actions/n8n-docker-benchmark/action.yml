---
name: Run n8n Docker benchmark phase
description: Runs one n8n Docker cache provider, image case, and phase.
inputs:
  benchmark_id:
    required: true
  push_image:
    required: false
    default: 'false'
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  cli_version:
    required: false
    default: ''
  buildkit_image:
    required: false
    default: ''
  dockerfile_path:
    required: true
  image:
    required: true
  node_version:
    required: true
  report_variant:
    required: false
    default: ''
    description: Declared series workload variant.
  load_image:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Validate benchmark strategy
    shell: bash
    env:
      STRATEGY: "${{ inputs.strategy }}"
    run: |
      case "$STRATEGY" in
        actions-cache|boringcache) ;;
        *)
          echo "Unsupported benchmark strategy: $STRATEGY" >&2
          exit 1
          ;;
      esac
  - name: Checkout pinned n8n source
    shell: bash
    run: |
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
  - name: Verify the upstream benchmark recipe
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean n8n source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
    run: |
      set -euo pipefail
      cache_scope="$(ruby ./scripts/benchmark-phase.rb scope)"
      ruby ./scripts/scope-case-cache.rb "$cache_scope"
      echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      source_url="$(git config -f .gitmodules submodule.upstream.url)"
      echo "source_repository=$(printf '%s' "${source_url#https://github.com/}" | sed 's/\.git$//')" >> "$GITHUB_OUTPUT"
      echo "source_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  - name: Activate the BoringCache Docker plan
    if: inputs.strategy == 'boringcache'
    shell: bash
    env:
      DOCKERFILE: "${{ inputs.dockerfile_path }}"
      NODE_VERSION: "${{ inputs.node_version }}"
      PUSH_IMAGE: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main'
        }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:boringcache
      LOAD_IMAGE: "${{ inputs.load_image }}"
    run: ruby ./scripts/activate-docker-plan.rb --dockerfile "$DOCKERFILE" --node-version
      "$NODE_VERSION" --push "$PUSH_IMAGE" --image "$IMAGE" --load "$LOAD_IMAGE"
  - name: Set up Node.js
    uses: "./.github/actions/setup-node"
    with:
      node-version: "${{ inputs.node_version }}"
  - name: Enable the pinned pnpm release
    shell: bash
    working-directory: upstream
    run: |
      corepack enable
      corepack install
  - name: Install n8n dependencies
    shell: bash
    working-directory: upstream
    env:
      CI: '1'
      GITHUB_TOKEN: "${{ github.token }}"
    run: corepack pnpm install --frozen-lockfile
  - name: Build n8n source
    shell: bash
    working-directory: upstream
    env:
      CI: '1'
      N8N_SKIP_LICENSES: 'true'
    run: corepack pnpm build:n8n
  - name: Verify the n8n build context
    shell: bash
    run: test -s upstream/packages/cli/dist/index.js
  - name: Log in to the GitHub Container Registry
    if: inputs.push_image == 'true' && github.ref == 'refs/heads/main'
    uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
    with:
      registry: ghcr.io
      username: "${{ github.actor }}"
      password: "${{ github.token }}"
  - name: Build with the declared cache provider
    id: provider_build
    uses: "./.github/actions/docker-benchmark"
    with:
      context: upstream
      file: "${{ inputs.dockerfile_path }}"
      platforms: linux/amd64
      tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:actions-cache
      push: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}"
      build-args: |
        NODE_VERSION=${{ inputs.node_version }}
        N8N_VERSION=snapshot
        N8N_RELEASE_TYPE=dev
      provenance: 'false'
      sbom: 'false'
      load: "${{ inputs.load_image == 'true' }}"
      strategy: "${{ inputs.strategy == 'runs-on-cache' && 'actions-cache' || inputs.strategy
        }}"
      phase: "${{ inputs.phase }}"
      cache-scope: "${{ steps.scope.outputs.cache_scope }}"
      cli-version: "${{ inputs.cli_version }}"
      buildkit-image: "${{ inputs.buildkit_image }}"
  - name: Verify the Docker output
    id: output_verification
    shell: bash
    env:
      STRATEGY: "${{ inputs.strategy }}"
      LOAD_IMAGE: "${{ inputs.load_image }}"
      PUSH_IMAGE: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main'
        }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:actions-cache
    run: ruby ./scripts/verify-docker-output.rb --strategy "$STRATEGY" --load "$LOAD_IMAGE"
      --push "$PUSH_IMAGE" --image "$IMAGE"
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase
        == 'warm' && 'warm' || 'cold' }}"
      WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
      SETUP_SECONDS: "${{ steps.provider_build.outputs.setup-seconds }}"
      BUILD_SECONDS: "${{ steps.provider_build.outputs.build-seconds }}"
      CACHE_HIT: "${{ steps.provider_build.outputs.cache-hit }}"
      EVIDENCE_PATH: "${{ steps.provider_build.outputs.evidence-path }}"
      STORAGE_KEY: "${{ steps.scope.outputs.cache_scope }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_REPOSITORY: "${{ steps.scope.outputs.source_repository }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
      REPORT_VARIANT: "${{ inputs.report_variant }}"
      OUTPUT_VERIFIED: "${{ steps.output_verification.outputs.verified }}"
    run: |
      set -euo pipefail
      verification=()
      [[ "$OUTPUT_VERIFIED" != 'true' ]] || verification=(--verified-output)
      ruby ./scripts/benchmark-report.rb phase "${verification[@]}" \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --variant "$REPORT_VARIANT" --mode docker \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository "$SOURCE_REPOSITORY" \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH"
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane
        }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm'
        && 'warm' || 'cold' }}
      path: benchmark-results/
      if-no-files-found: error
