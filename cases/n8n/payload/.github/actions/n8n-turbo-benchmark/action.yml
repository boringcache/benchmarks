---
name: Run n8n Turbo benchmark phase
description: Runs one n8n Turbo cache provider and phase.
inputs:
  benchmark_id:
    required: true
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  cli_version:
    required: false
    default: ''
  node_version:
    required: true
  report_variant:
    required: false
    default: ''
    description: Declared series workload variant.
runs:
  using: composite
  steps:
  - id: source
    uses: "./.github/actions/prepare-native"
    with:
      phase: "${{ inputs.phase }}"
  - name: Set up Node.js
    uses: "./.github/actions/setup-node"
    with:
      node-version: "${{ inputs.node_version }}"
  - name: Enable the pinned pnpm release
    shell: bash
    working-directory: upstream
    run: |
      corepack enable
      corepack install
  - id: cache
    uses: "./.github/actions/native-cache-benchmark"
    with:
      benchmark_id: "${{ inputs.benchmark_id }}"
      strategy: "${{ inputs.strategy }}"
      cache_lane: "${{ inputs.cache_lane }}"
      phase: "${{ inputs.phase }}"
      cli_version: "${{ inputs.cli_version }}"
      report_variant: "${{ inputs.report_variant }}"
      mode: turbo
      cache_path: upstream/.turbo
      workflow_started_at: "${{ steps.source.outputs.workflow_started_at }}"
      prepare_script: "./scripts/prepare-native-build.rb"
      dependency_token: "${{ github.token }}"
    env:
      CI: '1'
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.cache.outputs.cache_scope }}"
