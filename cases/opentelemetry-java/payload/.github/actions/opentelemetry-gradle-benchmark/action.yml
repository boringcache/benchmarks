---
name: Run OpenTelemetry Gradle benchmark phase
description: Runs one OpenTelemetry Java Gradle cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  java_version:
    required: true
runs:
  using: composite
  steps:
  - id: source
    uses: "./.github/actions/prepare-native"
    with:
      phase: "${{ inputs.phase }}"
  - name: Set up Java for tests
    id: setup_java_test
    uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
    with:
      distribution: zulu
      java-version: "${{ inputs.java_version }}"
  - name: Set up Java for build
    uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
    with:
      distribution: temurin
      java-version: '25'
  - id: cache
    uses: "./.github/actions/native-cache-benchmark"
    with:
      strategy: "${{ inputs.strategy }}"
      cache_lane: "${{ inputs.cache_lane }}"
      phase: "${{ inputs.phase }}"
      benchmark_id: "${{ inputs.benchmark_id }}"
      cli_version: "${{ inputs.cli_version }}"
      mode: gradle
      cache_path: ".gradle-user-home/caches/build-cache-*"
      workflow_started_at: "${{ steps.source.outputs.workflow_started_at }}"
      configure_script: "./scripts/configure-gradle-cache.sh"
    env:
      DISABLE_REMOTE_BUILD_CACHE: 'true'
      GRADLE_USER_HOME: "${{ github.workspace }}/.gradle-user-home"
      TEST_JAVA_HOME: "${{ steps.setup_java_test.outputs.path }}"
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.cache.outputs.cache_scope }}"
