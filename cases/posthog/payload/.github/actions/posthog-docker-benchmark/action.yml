---
name: Run PostHog Docker benchmark phase
description: Runs one PostHog cache provider and phase through the public product
  path.
inputs:
  strategy:
    description: actions-cache, runs-on-cache, or boringcache
    required: true
  phase:
    description: publish or warm
    required: true
  report_phase:
    description: Override the phase name used in the report.
    required: false
    default: ''
  cache_lane:
    description: rolling or fresh
    required: true
  benchmark_id:
    required: true
  push_image:
    required: false
    default: 'false'
  image_tag:
    description: Optional image tag for a pushed image.
    required: false
    default: ''
  load_image:
    description: Load the completed image into the runner's Docker engine.
    required: false
    default: 'false'
  publish_on_warm:
    description: Publish the cache after a warm build.
    required: false
    default: 'false'
  platform:
    required: true
  docker_tool_cache:
    required: false
    default: 'false'
  docker_mount_cache:
    required: false
    default: 'false'
  docker_apt_mount_cache:
    description: Render persistent apt package and index cache mounts.
    required: false
    default: 'false'
  no_cache:
    description: Disable Docker layer-cache reuse while preserving tool and mount
      caches.
    required: false
    default: 'false'
  posthog_sourcemap_api_key:
    description: Optional PostHog personal API key used by the upstream sourcemap
      upload stage.
    required: false
    default: ''
  cli_version:
    required: false
    default: ''
  buildkit_image:
    required: false
    default: ''
  upstream_ref:
    required: false
    default: ''
  cache_scope:
    description: Exact published cohort used by a warm phase.
    required: false
    default: ''
  report_variant:
    required: false
    default: ''
    description: Declared series workload variant.
outputs:
  cache_scope:
    description: Published cache cohort.
    value: "${{ steps.scope.outputs.cache_scope }}"
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Free runner disk space
    shell: bash
    run: "./scripts/free-runner-disk.sh"
  - name: Checkout pinned PostHog source
    shell: bash
    env:
      UPSTREAM_REF: "${{ inputs.upstream_ref }}"
    run: |
      set -euo pipefail
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
      if [[ -n "$UPSTREAM_REF" ]]; then
        git -C upstream fetch --depth 1 origin "$UPSTREAM_REF"
        git -C upstream checkout --detach FETCH_HEAD
      fi
  - name: Verify the upstream benchmark recipe
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean PostHog source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
  - name: Configure the native Depot task cache for the container
    if: inputs.strategy == 'depot-cache'
    shell: bash
    env:
      CACHE_PROVIDER: depot-cache
      CACHE_MODE: turbo
      CACHE_PHASE: ${{ inputs.phase }}
      DEPOT_CONTAINER_TOOL_CACHE: turbo
    run: ruby ./scripts/depot-cache.rb
  - name: Prepare the product Dockerfile
    id: dockerfile
    shell: bash
    env:
      DOCKER_TOOL_CACHE: "${{ inputs.docker_tool_cache }}"
      DOCKER_APT_MOUNT_CACHE: "${{ inputs.docker_apt_mount_cache }}"
    run: |
      set -euo pipefail
      if [[ "$DOCKER_TOOL_CACHE" == "true" ]]; then
        mkdir -p .benchmark
        ./scripts/render-posthog-toolcache-dockerfile.sh .benchmark/PostHog.Dockerfile
        echo "path=.benchmark/PostHog.Dockerfile" >> "$GITHUB_OUTPUT"
      else
        echo "path=upstream/Dockerfile" >> "$GITHUB_OUTPUT"
      fi
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      PHASE: "${{ inputs.phase }}"
      PUBLISHED_SCOPE: "${{ inputs.cache_scope }}"
      PLATFORM: "${{ inputs.platform }}"
    run: |
      set -euo pipefail
      cache_scope="$(ruby ./scripts/benchmark-phase.rb scope --require-published)"
      ruby ./scripts/scope-case-cache.rb "$cache_scope"
      echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      source_url="$(git config -f .gitmodules submodule.upstream.url)"
      echo "source_repository=$(printf '%s' "${source_url#https://github.com/}" | sed 's/\.git$//')" >> "$GITHUB_OUTPUT"
      echo "source_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      if [[ "$PLATFORM" == "linux/amd64" ]]; then
        echo "variant=" >> "$GITHUB_OUTPUT"
        echo "variant_suffix=" >> "$GITHUB_OUTPUT"
      else
        echo "variant=${PLATFORM}" >> "$GITHUB_OUTPUT"
        echo "variant_suffix=-$(printf '%s' "$PLATFORM" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      fi
  - name: Activate the BoringCache Docker plan
    if: inputs.strategy == 'boringcache'
    shell: bash
    env:
      DOCKERFILE: "${{ steps.dockerfile.outputs.path }}"
      PLATFORM: "${{ inputs.platform }}"
      TOOL_CACHE: "${{ inputs.docker_tool_cache }}"
      MOUNT_CACHE: "${{ inputs.docker_mount_cache }}"
      NO_CACHE: "${{ inputs.no_cache }}"
      SOURCEMAP_SECRET: "${{ inputs.posthog_sourcemap_api_key != '' }}"
      PUSH_IMAGE: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main'
        }}"
      LOAD_IMAGE: "${{ inputs.load_image }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/posthog-benchmark:${{ inputs.image_tag
        || 'boringcache' }}
    run: ruby ./scripts/activate-docker-plan.rb --dockerfile "$DOCKERFILE" --platform
      "$PLATFORM" --tool-cache "$TOOL_CACHE" --mount-cache "$MOUNT_CACHE" --no-cache
      "$NO_CACHE" --sourcemap-secret "$SOURCEMAP_SECRET" --push "$PUSH_IMAGE" --load
      "$LOAD_IMAGE" --image "$IMAGE"
  - name: Log in to the GitHub Container Registry
    if: inputs.push_image == 'true' && github.ref == 'refs/heads/main'
    uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
    with:
      registry: ghcr.io
      username: "${{ github.actor }}"
      password: "${{ github.token }}"
  - name: Build with the declared cache provider
    id: provider_build
    uses: "./.github/actions/docker-benchmark"
    with:
      context: upstream
      file: "${{ steps.dockerfile.outputs.path }}"
      platforms: "${{ inputs.platform }}"
      tags: ghcr.io/${{ github.repository_owner }}/posthog-benchmark:${{ inputs.image_tag
        || 'actions-cache' }}
      push: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main' }}"
      load: "${{ inputs.load_image == 'true' }}"
      provenance: 'false'
      secrets: "${{ inputs.posthog_sourcemap_api_key != '' && format('posthog_upload_sourcemaps_cli_api_key={0}',
        inputs.posthog_sourcemap_api_key) || '' }}"
      tool-cache-env: ${{ inputs.strategy == 'depot-cache' && '.depot-cache/tool-cache-env' || '' }}
      strategy: "${{ inputs.strategy == 'runs-on-cache' && 'actions-cache' || inputs.strategy
        }}"
      phase: "${{ inputs.phase }}"
      cache-scope: "${{ steps.scope.outputs.cache_scope }}"
      cli-version: "${{ inputs.cli_version }}"
      buildkit-image: "${{ inputs.buildkit_image }}"
      publish-on-warm: "${{ inputs.publish_on_warm }}"
      no-cache: "${{ inputs.no_cache }}"
    env:
      POSTHOG_SOURCEMAP_API_KEY: "${{ inputs.posthog_sourcemap_api_key }}"
  - name: Verify the Docker output
    id: output_verification
    shell: bash
    env:
      STRATEGY: "${{ inputs.strategy == 'runs-on-cache' && 'actions-cache' || inputs.strategy
        }}"
      LOAD_IMAGE: "${{ inputs.load_image }}"
      PUSH_IMAGE: "${{ inputs.push_image == 'true' && github.ref == 'refs/heads/main'
        }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/posthog-benchmark:${{ inputs.image_tag
        || 'actions-cache' }}
    run: ruby ./scripts/verify-docker-output.rb --strategy "$STRATEGY" --load "$LOAD_IMAGE"
      --push "$PUSH_IMAGE" --image "$IMAGE"
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.report_phase || inputs.cache_lane == 'rolling' &&
        'commit' || inputs.phase == 'warm' && 'warm' || 'cold' }}"
      REPORT_VARIANT: "${{ inputs.report_variant || steps.scope.outputs.variant }}"
      WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
      SETUP_SECONDS: "${{ steps.provider_build.outputs.setup-seconds }}"
      BUILD_SECONDS: "${{ steps.provider_build.outputs.build-seconds }}"
      CACHE_HIT: "${{ steps.provider_build.outputs.cache-hit }}"
      EVIDENCE_PATH: "${{ steps.provider_build.outputs.evidence-path }}"
      STORAGE_KEY: "${{ steps.scope.outputs.cache_scope }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_REPOSITORY: "${{ steps.scope.outputs.source_repository }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
      OUTPUT_VERIFIED: "${{ steps.output_verification.outputs.verified }}"
    run: |
      set -euo pipefail
      verification=()
      [[ "$OUTPUT_VERIFIED" != 'true' ]] || verification=(--verified-output)
      ruby ./scripts/benchmark-report.rb phase "${verification[@]}" \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --mode docker \
        --variant "$REPORT_VARIANT" \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository "$SOURCE_REPOSITORY" \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH"
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}${{ steps.scope.outputs.variant_suffix
        }}-${{ inputs.cache_lane }}-${{ inputs.report_phase || inputs.cache_lane ==
        'rolling' && 'commit' || inputs.phase == 'warm' && 'warm' || 'cold' }}
      path: benchmark-results/
      if-no-files-found: error
