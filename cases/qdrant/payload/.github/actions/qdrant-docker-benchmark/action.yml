---
name: Run Qdrant Docker benchmark phase
description: Runs one Qdrant Docker cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  push_image:
    required: false
    default: 'false'
  cli_version:
    required: false
    default: ''
  buildkit_image:
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Start the workflow timer
    id: workflow_timer
    shell: bash
    run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
  - name: Checkout pinned Qdrant source
    shell: bash
    run: |
      git submodule sync --recursive
      git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream
  - name: Verify the upstream benchmark recipe
    shell: bash
    run: ruby ./scripts/verify-upstream-recipe.rb
  - name: Prepare clean Qdrant source
    shell: bash
    env:
      PREPARE_PHASE: "${{ inputs.phase == 'warm' && 'warm1' || 'base' }}"
    run: ruby ./scripts/prepare-source.rb "$PREPARE_PHASE"
  - name: Select the cache cohort
    id: scope
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
    run: |
      set -euo pipefail
      cache_scope="$(ruby ./scripts/benchmark-phase.rb scope)"
      ruby ./scripts/scope-case-cache.rb "$cache_scope"
      echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
      echo "source_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  - name: Build with the declared cache provider
    id: provider_build
    uses: "./.github/actions/docker-benchmark"
    with:
      context: upstream
      file: upstream/Dockerfile
      tags: qdrant/qdrant:e2e-tests
      push: 'false'
      build-args: |
        PROFILE=ci
        FEATURES=data-consistency-check,staging
      load: 'true'
      provenance: 'false'
      strategy: "${{ inputs.strategy == 'runs-on-cache' && 'actions-cache' || inputs.strategy
        }}"
      phase: "${{ inputs.phase }}"
      cache-scope: "${{ steps.scope.outputs.cache_scope }}"
      cli-version: "${{ inputs.cli_version }}"
      buildkit-image: "${{ inputs.buildkit_image }}"
  - name: Verify the Qdrant image
    shell: bash
    run: docker image inspect qdrant/qdrant:e2e-tests >/dev/null
  - name: Write the benchmark phase evidence
    shell: bash
    env:
      BENCHMARK_ID: "${{ inputs.benchmark_id }}"
      STRATEGY: "${{ inputs.strategy }}"
      CACHE_LANE: "${{ inputs.cache_lane }}"
      REPORT_PHASE: "${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase
        == 'warm' && 'warm' || 'cold' }}"
      WORKFLOW_STARTED_AT: "${{ steps.workflow_timer.outputs.started_at }}"
      SETUP_SECONDS: "${{ steps.provider_build.outputs.setup-seconds }}"
      BUILD_SECONDS: "${{ steps.provider_build.outputs.build-seconds }}"
      CACHE_HIT: "${{ steps.provider_build.outputs.cache-hit }}"
      EVIDENCE_PATH: "${{ steps.provider_build.outputs.evidence-path }}"
      STORAGE_KEY: "${{ steps.scope.outputs.cache_scope }}"
      GITHUB_TOKEN: "${{ github.token }}"
      SOURCE_SHA: "${{ steps.scope.outputs.source_sha }}"
    run: |
      set -euo pipefail
      ruby ./scripts/benchmark-report.rb phase --verified-output \
        --benchmark "$BENCHMARK_ID" \
        --strategy "$STRATEGY" \
        --lane "$CACHE_LANE" \
        --phase "$REPORT_PHASE" \
        --mode docker \
        --restore-or-setup-seconds "$SETUP_SECONDS" \
        --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
        --build-seconds "$BUILD_SECONDS" \
        --cache-hit "$CACHE_HIT" \
        --source-repository qdrant/qdrant \
        --source-sha "$SOURCE_SHA" \
        --storage-key "$STORAGE_KEY" \
        --evidence "$EVIDENCE_PATH"
  - name: Retain the benchmark phase evidence
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane
        }}-${{ inputs.cache_lane == 'rolling' && 'commit' || inputs.phase == 'warm'
        && 'warm' || 'cold' }}
      path: benchmark-results/
      if-no-files-found: error
