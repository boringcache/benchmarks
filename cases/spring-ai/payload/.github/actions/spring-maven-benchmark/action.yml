---
name: Run Spring AI Maven benchmark phase
description: Runs one Spring AI Maven cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  java_version:
    required: true
runs:
  using: composite
  steps:
  - id: source
    uses: "./.github/actions/prepare-native"
    with:
      phase: "${{ inputs.phase }}"
  - name: Set up Java
    uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
    with:
      distribution: liberica
      java-version: "${{ inputs.java_version }}"
      overwrite-settings: "${{ inputs.strategy != 'depot-cache' }}"
  - id: cache
    uses: "./.github/actions/native-cache-benchmark"
    with:
      strategy: "${{ inputs.strategy }}"
      cache_lane: "${{ inputs.cache_lane }}"
      phase: "${{ inputs.phase }}"
      benchmark_id: "${{ inputs.benchmark_id }}"
      cli_version: "${{ inputs.cli_version }}"
      mode: maven
      cache_path: ".maven-build-cache"
      workflow_started_at: "${{ steps.source.outputs.workflow_started_at }}"
      configure_script: "./scripts/configure-native-cache.sh"
    env: {}
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.cache.outputs.cache_scope }}"
