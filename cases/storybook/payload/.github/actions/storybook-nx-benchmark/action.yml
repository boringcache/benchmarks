---
name: Run Storybook Nx benchmark phase
description: Runs one Storybook Nx cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  workload:
    default: sandbox
  report_variant:
    default: ''
  node_version:
    required: true
runs:
  using: composite
  steps:
  - id: source
    uses: "./.github/actions/prepare-native"
    with:
      phase: "${{ inputs.phase }}"
  - name: Set up Node.js
    uses: "./.github/actions/setup-node"
    with:
      node-version: "${{ inputs.node_version }}"
  - name: Enable the pinned Yarn release
    shell: bash
    working-directory: upstream
    run: |
      corepack enable
      corepack install
  - name: Select the reviewed upstream workload
    shell: bash
    env:
      STORYBOOK_WORKLOAD: ${{ inputs.workload }}
    run: |
      ruby scripts/configure-nx-cache.rb
      if [[ "$STORYBOOK_WORKLOAD" == nx ]]; then
        cp plans/nx.toml .boringcache.toml
      elif [[ "$STORYBOOK_WORKLOAD" != sandbox ]]; then
        echo "Select sandbox or nx" >&2
        exit 1
      fi
  - id: cache
    uses: "./.github/actions/native-cache-benchmark"
    with:
      strategy: "${{ inputs.strategy }}"
      cache_lane: "${{ inputs.cache_lane }}"
      phase: "${{ inputs.phase }}"
      benchmark_id: "${{ inputs.benchmark_id }}"
      cli_version: "${{ inputs.cli_version }}"
      mode: ${{ inputs.workload == 'nx' && 'nx' || 'archive' }}
      report_variant: ${{ inputs.report_variant }}
      cache_path: |
        upstream/.nx/cache
        upstream/.nx/workspace-data
      workflow_started_at: "${{ steps.source.outputs.workflow_started_at }}"
      prepare_script: "./scripts/prepare-native-build.rb"
      command_mode: nx
      working_directory: "."
      cache_profiles: ${{ inputs.workload == 'sandbox' && 'storybook-nx' || '' }}
    env:
      STORYBOOK_WORKLOAD: ${{ inputs.workload }}
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      NX_SKIP_REMOTE_CACHE: ${{ inputs.workload != 'nx' || (inputs.strategy != 'boringcache' && inputs.strategy != 'depot-cache') }}
      NX_NATIVE_FILE_LOGGING: nx::native::cache=trace
      NX_CACHE_DIRECTORY: .nx/cache
      BENCHMARK_NX_PHASE: ${{ inputs.phase }}
      BENCHMARK_NX_PROVIDER: ${{ inputs.strategy }}
      BENCHMARK_NX_LANE: ${{ inputs.cache_lane }}
  - name: Retain Nx task and cache diagnostics
    if: always() && inputs.workload == 'nx'
    uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
    with:
      name: nx-diagnostics-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.cache_lane }}-${{ inputs.phase }}
      path: |
        upstream/.nx/cache/run.json
        upstream/.nx/workspace-data/nx.log
      if-no-files-found: warn
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.cache.outputs.cache_scope }}"
