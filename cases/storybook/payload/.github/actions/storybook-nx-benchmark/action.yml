---
name: Run Storybook Nx benchmark phase
description: Runs one Storybook Nx cache provider and phase.
inputs:
  strategy:
    required: true
  cache_lane:
    required: true
  phase:
    required: true
  benchmark_id:
    required: true
  cli_version:
    required: false
    default: ''
  node_version:
    required: true
runs:
  using: composite
  steps:
  - id: source
    uses: "./.github/actions/prepare-native"
    with:
      phase: "${{ inputs.phase }}"
  - name: Set up Node.js
    uses: "./.github/actions/setup-node"
    with:
      node-version: "${{ inputs.node_version }}"
  - name: Enable the pinned Yarn release
    shell: bash
    working-directory: upstream
    run: |
      corepack enable
      corepack install
  - id: cache
    uses: "./.github/actions/native-cache-benchmark"
    with:
      strategy: "${{ inputs.strategy }}"
      cache_lane: "${{ inputs.cache_lane }}"
      phase: "${{ inputs.phase }}"
      benchmark_id: "${{ inputs.benchmark_id }}"
      cli_version: "${{ inputs.cli_version }}"
      mode: archive
      cache_path: |
        upstream/.nx/cache
        upstream/.nx/workspace-data
      workflow_started_at: "${{ steps.source.outputs.workflow_started_at }}"
      prepare_script: "./scripts/prepare-native-build.rb"
      command_mode: nx
      working_directory: "."
      cache_profiles: storybook-nx
    env: {}
outputs:
  cache_scope:
    description: Published cache cohort
    value: "${{ steps.cache.outputs.cache_scope }}"
