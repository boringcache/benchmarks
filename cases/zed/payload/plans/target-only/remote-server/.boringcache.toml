workspace = "boringcache/benchmarks"

[entries.cargo-registry]
tag = "zed-cargo-layers-local-registry"

[entries.cargo-git]
tag = "zed-cargo-layers-local-git"

[entries.zed-target]
kind = "cargo-target"
tag = "zed-cargo-layers-local-target"
path = "target"

[profiles.cargo-product]
entries = ["cargo-registry", "cargo-git", "zed-target"]

[adapters.cargo]
tag = "zed-cargo-layers-local-cargo"
profiles = ["cargo-product"]
compiler-cache = "none"
no-git = true
metadata-hints = ["benchmark=zed-cargo-layers", "lane=target-only", "phase=remote-server"]
command = [
  "cargo",
  "build",
  "--config",
  ".cargo/bundle-config.toml",
  "--release",
  "--target",
  "x86_64-unknown-linux-musl",
  "--package",
  "remote_server",
]
