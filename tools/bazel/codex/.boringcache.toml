workspace = "boringcache/benchmarks"

[adapters.bazel]
fail-on-cache-error = true
tag = "codex-bazel"
no-platform = true
no-git = true
metadata-hints = ["benchmark=codex", "workload=workspace-tests"]
command = [
  "../bazel",
  "--bazelrc=../bench.bazelrc",
  "--noexperimental_remote_repo_contents_cache",
  "test",
  "--test_env=INSTA_UPDATE=no",
  "--test_tag_filters=-argument-comment-lint",
  "--test_verbose_timeout_warnings",
  "--execution_log_compact_file=../execution-log.zst",
  "--build_event_json_file=../build-events.json",
  "--",
  "//...",
  "-//third_party/v8:all",
]
