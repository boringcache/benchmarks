provider = "nativelink"
level = "base"
runners = ["github"]
secrets = ["NATIVELINK_R2_ACCESS_KEY_ID", "NATIVELINK_R2_SECRET_ACCESS_KEY"]
setup = ["nativelink"]
probe = ["ruby \"$BENCH_ROOT/scripts/r2-check.rb\" \"nativelink/$BENCH_CASE\" && curl --fail --silent --show-error --output /dev/null http://127.0.0.1:50051/status"]

[env]
BAZEL_LANE_RC = """
build --remote_cache=grpc://127.0.0.1:50051
build --remote_instance_name=main
"""

[warm.env]
BAZEL_PHASE_RC = "build --remote_upload_local_results=false"
