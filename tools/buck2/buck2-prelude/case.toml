repo = "facebook/buck2"
branch = "main"
start_sha = "21e9db5494860ad26f9b3e0b7dcf8b8c3c2aad9f"
directory = "upstream/examples/with_prelude"
prepare = [
  "mise trust && mise install",
  "cp -R overlay/benchmark-platform upstream/examples/with_prelude/benchmark-platform",
  'printf "[build]\n  execution_platforms = root//benchmark-platform:local\n[benchmark]\n  cache_uploads = %s\n%s\n" "${BUCK2_CACHE_UPLOADS:-true}" "${BUCK2_LANE_CONFIG:-}" > upstream/examples/with_prelude/.buckconfig.local',
]
check = "find upstream/examples/with_prelude/buck-out -type f -perm -u+x -path '*/rust/__main__/main' | grep -q . && find upstream/examples/with_prelude/buck-out -type f -perm -u+x -path '*/cpp/hello_world/__main__/main' | grep -q ."

[runs]
boringcache-buck2 = ["github", "local"]
nativelink = ["github"]
