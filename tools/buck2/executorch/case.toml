repo = "pytorch/executorch"
branch = "main"
start_sha = "defd9cae1b37b3edd1a4ae60b171f9a4bd7b1526"
directory = "upstream"
prepare = [
  "mise trust && mise install",
  "git -C upstream submodule update --init --recursive",
  "git -C upstream/third-party/prelude fetch --depth 1 origin cb8b34f660977893418853c0001b319cc9314798",
  "git -C upstream/third-party/prelude checkout --detach cb8b34f660977893418853c0001b319cc9314798",
  "git -C upstream/third-party/prelude apply ../../../overlay/cache.patch",
  "cp -R overlay/benchmark-platform upstream/benchmark-platform",
  "python3 -m pip install PyYAML==6.0.3",
  "python3 -m pip install --no-deps 'https://download-r2.pytorch.org/whl/cpu/torch-2.14.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl#sha256=673dbf5c9bbadfffab7a386b6dd7a0c219f1408a328b7b4e86d0ae551cdafa42'",
  'printf "[build]\n  execution_platforms = root//benchmark-platform:local\n[benchmark]\n  cache_uploads = %s\n%s\n" "${BUCK2_CACHE_UPLOADS:-true}" "${BUCK2_LANE_CONFIG:-}" > upstream/.buckconfig.local',
]
check = 'python3 -c "import glob,os; paths=[p for p in glob.glob(\"upstream/buck-out/**/executor_runner\",recursive=True) if os.path.isfile(p)]; assert paths and all(os.access(p,os.X_OK) and open(p,\"rb\").read(4)==b\"\\x7fELF\" for p in paths)"'

[runs]
boringcache-buck2 = ["github"]
nativelink = ["github"]
