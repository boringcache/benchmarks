provider = "nativelink"
level = "base"
runners = ["github"]
secrets = ["NATIVELINK_R2_ACCESS_KEY_ID", "NATIVELINK_R2_SECRET_ACCESS_KEY"]
setup = ["nativelink"]
probe = ["ruby \"$BENCH_ROOT/scripts/r2-check.rb\" \"nativelink/$BENCH_CASE\" && curl --fail --silent --show-error --output /dev/null http://127.0.0.1:50051/status"]

[env]
BUCK2_LANE_CONFIG = """
[buck2_re_client]
engine_address = 127.0.0.1:50051
action_cache_address = 127.0.0.1:50051
cas_address = 127.0.0.1:50051
tls = false
instance_name = main
"""

[warm.env]
BUCK2_CACHE_UPLOADS = "false"
