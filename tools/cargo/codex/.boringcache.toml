workspace = "boringcache/benchmarks"

[profiles.compiler-only]
entries = []

[adapters.sccache]
fail-on-cache-error = true
tag = "codex-sccache"
no-git = true

[adapters.cargo]
fail-on-cache-error = true
tag = "codex-cargo"
profiles = ["compiler-only"]
compiler-cache = "sccache"
no-git = true
metadata-hints = ["benchmark=codex", "workload=workspace-test-build"]
command = ["cargo", "test", "--workspace", "--locked", "--no-run"]
