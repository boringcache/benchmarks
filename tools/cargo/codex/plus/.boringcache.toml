workspace = "boringcache/benchmarks"

[entries.cargo-registry-cache]
tag = "codex-cargo-registry-cache"

[entries.cargo-registry-index]
tag = "codex-cargo-registry-index"

[entries.cargo-git-db]
tag = "codex-cargo-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "codex-cargo-target"
path-env = "CARGO_TARGET_DIR"

[profiles.cargo-product]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[adapters.sccache]
fail-on-cache-error = true
tag = "codex-sccache"
no-git = true

[adapters.cargo]
fail-on-cache-error = true
tag = "codex-cargo"
profiles = ["cargo-product"]
compiler-cache = "sccache"
target-budget = "55GiB"
no-git = true
metadata-hints = ["benchmark=codex", "workload=workspace-test-build"]
command = ["cargo", "test", "--workspace", "--locked", "--no-run"]
