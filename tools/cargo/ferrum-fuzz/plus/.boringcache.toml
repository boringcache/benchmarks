workspace = "boringcache/benchmarks"

[entries.cargo-registry-cache]
tag = "ferrum-fuzz-cargo-registry-cache"

[entries.cargo-registry-index]
tag = "ferrum-fuzz-cargo-registry-index"

[entries.cargo-git-db]
tag = "ferrum-fuzz-cargo-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "ferrum-fuzz-cargo-target"
path-env = "CARGO_TARGET_DIR"
exclude = ["x86_64-unknown-linux-gnu/release/build/ferrum-edge-fuzz/", "x86_64-unknown-linux-gnu/release/traceparent", "x86_64-unknown-linux-gnu/release/config_decode", "x86_64-unknown-linux-gnu/release/proxy_protocol", "x86_64-unknown-linux-gnu/release/mesh_udp_frame", "x86_64-unknown-linux-gnu/release/k8s_crd", "x86_64-unknown-linux-gnu/release/plugin_config", "x86_64-unknown-linux-gnu/release/ocsp_response", "x86_64-unknown-linux-gnu/release/jwt_svid", "x86_64-unknown-linux-gnu/release/tls_material", "x86_64-unknown-linux-gnu/release/datagram_client_address", "x86_64-unknown-linux-gnu/release/deps/traceparent-*", "x86_64-unknown-linux-gnu/release/deps/config_decode-*", "x86_64-unknown-linux-gnu/release/deps/proxy_protocol-*", "x86_64-unknown-linux-gnu/release/deps/mesh_udp_frame-*", "x86_64-unknown-linux-gnu/release/deps/k8s_crd-*", "x86_64-unknown-linux-gnu/release/deps/plugin_config-*", "x86_64-unknown-linux-gnu/release/deps/ocsp_response-*", "x86_64-unknown-linux-gnu/release/deps/jwt_svid-*", "x86_64-unknown-linux-gnu/release/deps/tls_material-*", "x86_64-unknown-linux-gnu/release/deps/datagram_client_address-*"]

[profiles.cargo-product]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[profiles.compiler-only]
entries = []

[adapters.cargo]
fail-on-cache-error = true
tag = "ferrum-fuzz-cargo"
profiles = ["cargo-product"]
compiler-cache = "sccache"
target-budget = "25GiB"
no-git = true
metadata-hints = ["benchmark=ferrum-fuzz", "lane=cargo-product"]
