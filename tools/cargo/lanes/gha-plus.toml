provider = "github-actions-cache"
level = "plus"
actions_only = true
runners = ["github", "namespace-8"]
finish = ["sccache --show-stats"]
setup = ["actions-runtime"]
paths = ["~/.cargo/registry/index", "~/.cargo/registry/cache", "~/.cargo/git/db", "upstream/target"]

[env]
SCCACHE_GHA_ENABLED = "true"
SCCACHE_GHA_VERSION = "${BENCH_SCOPE}"
RUSTC_WRAPPER = "sccache"
SCCACHE_IDLE_TIMEOUT = "0"

[warm.env]
SCCACHE_GHA_RW_MODE = "READ_ONLY"
