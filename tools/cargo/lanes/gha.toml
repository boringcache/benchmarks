provider = "github-actions-cache"
level = "base"
actions_only = true
runners = ["github", "github-26", "macos", "windows", "namespace-8", "incredibuild"]
finish = ["sccache --show-stats"]
setup = ["actions-runtime"]
probe = ['bash "$BENCH_ROOT/tools/cargo/codex/probe-runner.sh"']

[env]
SCCACHE_GHA_ENABLED = "true"
SCCACHE_GHA_VERSION = "${BENCH_SCOPE}"
RUSTC_WRAPPER = "sccache"
SCCACHE_IDLE_TIMEOUT = "0"

[warm.env]
SCCACHE_GHA_RW_MODE = "READ_ONLY"
