provider = "kache"
level = "base"
actions_only = true
runners = ["github", "namespace-8"]
secrets = ["NATIVELINK_R2_ACCESS_KEY_ID", "NATIVELINK_R2_SECRET_ACCESS_KEY"]
setup = ["kache"]
probe = ["ruby \"$BENCH_ROOT/scripts/r2-check.rb\" \"kache/$BENCH_CASE\""]

[cold]
finish = ["kache save-manifest", "kache sync --push"]
