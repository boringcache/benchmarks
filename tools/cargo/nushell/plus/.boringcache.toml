workspace = "boringcache/benchmarks"

[entries.cargo-registry-cache]
tag = "nu-cargo-registry-cache"

[entries.cargo-registry-index]
tag = "nu-cargo-registry-index"

[entries.cargo-git-db]
tag = "nu-cargo-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "nu-cargo-target"
path = "upstream/target"

[profiles.cargo-product]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[adapters.sccache]
fail-on-cache-error = true
tag = "nu-sccache"
no-git = true

[adapters.cargo]
fail-on-cache-error = true
tag = "nu-cargo"
profiles = ["cargo-product"]
compiler-cache = "sccache"
target-budget = "20GiB"
no-git = true
metadata-hints = ["benchmark=nushell", "upstream-job=root"]
command = ["cargo", "--config", ".cargo/ci.toml", "build", "--workspace", "--all-targets", "--profile", "ci"]
