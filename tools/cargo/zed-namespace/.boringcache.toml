workspace = "boringcache/benchmarks"

[entries.cargo-registry]
tag = "zed-namespace-cargo-registry"

[entries.cargo-git]
tag = "zed-namespace-cargo-git"

[entries.zed-target]
kind = "cargo-target"
tag = "zed-namespace-target"
path = "upstream/target"

[profiles.cargo-product]
entries = ["cargo-registry", "cargo-git", "zed-target"]

[profiles.compiler-only]
entries = []

[adapters.sccache]
fail-on-cache-error = true
tag = "zed-namespace-sccache"
no-git = true
metadata-hints = ["benchmark=zed-namespace", "layer=compiler"]

[adapters.cargo]
fail-on-cache-error = true
tag = "zed-namespace-cargo"
profiles = ["compiler-only"]
compiler-cache = "sccache"
no-git = true
metadata-hints = ["benchmark=zed-namespace", "lane=compiler-only"]
command = ["cargo", "build", "--release", "--locked", "--timings"]
