repo = "zed-industries/zed"
branch = "main"
start_sha = "eb466341a6b4306604cffef466cfdf9b1aafcecc"
rolling_stride = 3
directory = "upstream"
prepare = [
  "df -h / && if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi && df -h /",
  "mise trust && mise install",
  "cd upstream && ./script/linux",
]
check = "test -x upstream/target/release/zed && test -z \"$(git -C upstream status --porcelain=v1 --untracked-files=all)\""

[env]
CARGO_TERM_COLOR = "always"
CARGO_INCREMENTAL = "0"
ZED_BUNDLE = "true"
CC = "clang"
CXX = "clang++"

[runs]
boringcache-cargo = ["namespace-8"]
boringcache-cargo-plus = ["namespace-8"]
depot-cache = ["namespace-8"]
namespace-cache = ["namespace-8-cache"]
