workspace = "boringcache/benchmarks"

[entries.cargo-registry-cache]
tag = "zed-namespace-cargo-registry-cache"

[entries.cargo-registry-index]
tag = "zed-namespace-cargo-registry-index"

[entries.cargo-git-db]
tag = "zed-namespace-cargo-git-db"

[entries.zed-target]
kind = "cargo-target"
tag = "zed-namespace-target"
path = "upstream/target"

[profiles.cargo-product]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "zed-target"]

[profiles.compiler-only]
entries = []

[adapters.sccache]
fail-on-cache-error = true
tag = "zed-namespace-sccache"
no-git = true
metadata-hints = ["benchmark=zed-namespace", "layer=compiler"]

[adapters.cargo]
compiler-cache = "none"
fail-on-cache-error = true
profiles = ["cargo-product"]
target-budget = "25GiB"
no-git = true
metadata-hints = ["benchmark=zed-namespace", "lane=cargo-product"]
command = ["cargo", "build", "--release", "--locked", "--timings"]
