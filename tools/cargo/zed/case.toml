repo = "zed-industries/zed"
branch = "main"
start_sha = "40180d9c40e2d20eb63d388bff920818f2910b53"
rolling_stride = 3
directory = "upstream"
prepare = [
  "df -h / && if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi && df -h /",
  "mise trust && mise install",
  "cd upstream && ./script/linux",
]
check = "test -x upstream/target/release/zed && test -z \"$(git -C upstream status --porcelain=v1 --untracked-files=all)\""

[env]
CARGO_TERM_COLOR = "always"
CARGO_INCREMENTAL = "0"
ZED_BUNDLE = "true"
CC = "clang"
CXX = "clang++"

[runs]
boringcache-sccache-017 = ["github"]
boringcache-sccache-018 = ["github"]
boringcache-sccache-019 = ["github"]
boringcache-sccache-019-client = ["github"]
boringcache-cargo = ["github", "local"]
boringcache-cargo-plus = ["github", "local"]
gha = ["github"]
gha-plus = ["github"]
depot-cache = ["github"]
kache = ["github"]
mbx = ["github"]
boringcache-cargo-plus-reader = ["github", "namespace-4x16"]
namespace-cache = ["namespace-4x16-cache"]

[samples]
boringcache-cargo-plus-reader = ["github", "namespace-4x16"]
namespace-cache = ["namespace-4x16-cache"]
