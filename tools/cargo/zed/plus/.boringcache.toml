workspace = "boringcache/benchmarks"

[entries.cargo-registry-cache]
tag = "zed-cargo-registry-cache"

[entries.cargo-registry-index]
tag = "zed-cargo-registry-index"

[entries.cargo-git-db]
tag = "zed-cargo-git-db"

[entries.zed-target]
kind = "cargo-target"
tag = "zed-target"
path = "upstream/target"

[profiles.cargo-product]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "zed-target"]

[profiles.compiler-only]
entries = []

[adapters.sccache]
tag = "zed-sccache"
no-git = true
metadata-hints = ["benchmark=zed", "layer=compiler"]

[adapters.cargo]
tag = "zed-cargo"
profiles = ["cargo-product"]
compiler-cache = "sccache"
no-git = true
metadata-hints = ["benchmark=zed", "lane=cargo-product"]
command = ["cargo", "build", "--release", "--locked"]
