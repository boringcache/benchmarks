workspace = "boringcache/benchmarks"

[entries.cargo-registry]
tag = "zed-cargo-registry"

[entries.cargo-git]
tag = "zed-cargo-git"

[entries.zed-target]
kind = "cargo-target"
tag = "zed-target"
path = "upstream/target"

[profiles.cargo-product]
entries = ["cargo-registry", "cargo-git", "zed-target"]

[profiles.compiler-only]
entries = []

[adapters.sccache]
tag = "zed-sccache"
no-git = true
metadata-hints = ["benchmark=zed", "layer=compiler"]

[adapters.cargo]
tag = "zed-cargo"
profiles = ["cargo-product"]
compiler-cache = "sccache"
no-git = true
metadata-hints = ["benchmark=zed", "lane=cargo-product"]
command = ["cargo", "build", "--release", "--locked"]
