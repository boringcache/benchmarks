workspace = "boringcache/benchmarks"

[adapters.ccache]
fail-on-cache-error = true
tag = "llvm-ccache"
no-git = true
metadata-hints = ["benchmark=llvm-compiler-cache", "tool=ccache", "upstream-job=premerge-linux"]
command = ["bash", "-c", "cmake -S llvm -B ../build -G Ninja -DLLVM_ENABLE_PROJECTS=clang -DLLVM_TARGETS_TO_BUILD=X86 -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=ON -DLLVM_ENABLE_LLD=ON -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON && ninja -C ../build"]
