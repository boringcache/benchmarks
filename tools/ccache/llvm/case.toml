repo = "llvm/llvm-project"
branch = "main"
start_sha = "b611c15f2d6a6b98989b6272ac61ce9b514a03ae"
rolling_stride = 20
directory = "upstream"
prepare = [
  "sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-22 lld-22",
  "mise trust && mise install",
]
check = "test -x build/bin/clang && build/bin/clang --version"

[env]
CCACHE_DIR = "${BENCH_DIR}/.ccache"

[runs]
boringcache-ccache = ["github-26"]
gha = ["github-26"]
