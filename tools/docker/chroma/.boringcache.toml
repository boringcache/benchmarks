workspace = "boringcache/benchmarks"

[adapters.docker]
tag = "chroma-docker"
no-git = true
metadata-hints = ["benchmark=chroma", "upstream-job=build-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/rust/Dockerfile",
  "--target", "cli",
  "--platform", "linux/amd64",
  "--build-arg", "RELEASE_MODE=1",
  "--tag", "chroma-benchmark:local",
  "--load",
  "upstream",
]
