workspace = "boringcache/benchmarks"

[adapters.docker]
tag = "discourse-docker"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=discourse", "upstream-job=base", "arch=amd64"]
command = [
  "docker", "buildx", "bake",
  "base-runtime-deps",
  "base-slim",
  "base-web-only",
  "base-release",
  "test-release",
  "--load",
]
