workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "dspace-docker"
no-git = true
metadata-hints = ["benchmark=dspace", "upstream-job=dspace"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--build-arg", "DOCKER_REGISTRY=ghcr.io",
  "--tag", "dspace-benchmark:local",
  "--load",
  "upstream",
]
