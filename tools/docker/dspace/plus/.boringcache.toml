workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "dspace-docker"
no-git = true
metadata-hints = ["benchmark=dspace", "upstream-job=dspace"]
tool-cache = ["maven:dspace-maven"]
command = [
  "docker", "buildx", "build",
  "--file", "overlay/dspace-maven.Dockerfile",
  "--tag", "dspace-benchmark:local",
  "--load",
  "upstream",
]
