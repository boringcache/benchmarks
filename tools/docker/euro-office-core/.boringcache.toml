workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "euro-office-core-docker"
no-git = true
metadata-hints = ["benchmark=euro-office-core", "upstream-job=core"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/core/.docker/core.bake.Dockerfile",
  "--target", "core",
  "--build-arg", "BUILD_ROOT=/package",
  "--tag", "euro-office-core-benchmark:local",
  "--load",
  "upstream",
]
