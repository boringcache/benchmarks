workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "gram-code-runner-docker"
no-git = true
metadata-hints = ["benchmark=gram-code-runner", "upstream-job=validate"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/agents/code-runner/Dockerfile",
  "--tag", "gram-code-runner:test",
  "--load",
  "upstream",
]
