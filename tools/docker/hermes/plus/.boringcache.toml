workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "hermes-slim-docker"
no-git = true
metadata-hints = ["benchmark=hermes-slim", "upstream-job=docker-slim"]
mount-cache = true
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--build-arg", "HERMES_BOT_DESKTOP=0",
  "--tag", "hermes-slim-benchmark:local",
  "--load",
  "upstream",
]
