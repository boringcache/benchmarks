workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "honeybeepf-llm-docker"
no-git = true
metadata-hints = ["benchmark=honeybeepf-llm", "upstream-job=docker"]
mount-cache = true
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--provenance", "false",
  "--tag", "honeybeepf-llm-benchmark:local",
  "--load",
  "upstream",
]
