workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "infisical-docker"
no-git = true
metadata-hints = ["benchmark=infisical", "upstream-job=standalone-docker"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile.standalone-infisical",
  "--tag", "infisical-benchmark:local",
  "--load",
  "upstream",
]
