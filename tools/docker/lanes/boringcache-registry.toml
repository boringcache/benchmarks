provider = "boringcache-registry"
level = "base"
actions_only = true
runners = ["github", "github-arm"]
secrets = ["BORINGCACHE_REGISTRY_TOKEN"]
setup = ["buildx", "boringcache-registry"]
probe = ["printf 'FROM scratch\\nCOPY probe /probe\\n' > Dockerfile.probe && date > probe && docker buildx build --file Dockerfile.probe --cache-to type=registry,ref=registry.boringcache.com/boringcache/benchmarks/docker-cache:probe,mode=max . && docker buildx build --file Dockerfile.probe --cache-from type=registry,ref=registry.boringcache.com/boringcache/benchmarks/docker-cache:probe ."]
args = ["--cache-from", "type=registry,ref=registry.boringcache.com/boringcache/benchmarks/docker-cache:${BENCH_SCOPE}", "--cache-to", "type=registry,ref=registry.boringcache.com/boringcache/benchmarks/docker-cache:${BENCH_SCOPE},mode=max"]

[warm]
args = ["--cache-from", "type=registry,ref=registry.boringcache.com/boringcache/benchmarks/docker-cache:${BENCH_SCOPE}"]
