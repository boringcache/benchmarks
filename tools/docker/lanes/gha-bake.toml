provider = "github-actions-cache"
level = "base"
actions_only = true
runners = ["github", "github-arm"]
setup = ["buildx", "actions-runtime"]
args = ["--set=*.cache-from=type=gha,scope=${BENCH_SCOPE}", "--set=*.cache-to=type=gha,scope=${BENCH_SCOPE},mode=max"]

[warm]
args = ["--set=*.cache-from=type=gha,scope=${BENCH_SCOPE}"]
