workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "mastodon-docker"
no-git = true
metadata-hints = ["benchmark=mastodon", "upstream-job=build-image-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--build-arg", "MASTODON_VERSION_PRERELEASE=nightly.2026-09-30",
  "--build-arg", "MASTODON_VERSION_METADATA=",
  "--build-arg", "SOURCE_COMMIT=9b97c67be3c67e992c184167bd7425502aad12da",
  "--tag", "mastodon-server-benchmark:local",
  "--load",
  "upstream",
]
