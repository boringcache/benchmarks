workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "n8n-docker"
no-git = true
metadata-hints = ["benchmark=n8n-docker", "upstream-job=build-and-push-docker-image-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/docker/images/n8n/Dockerfile",
  "--build-arg", "NODE_VERSION=26.7.0",
  "--build-arg", "N8N_VERSION=snapshot",
  "--build-arg", "N8N_RELEASE_TYPE=dev",
  "--provenance", "false",
  "--sbom", "false",
  "--tag", "n8n-benchmark:local",
  "--load",
  "upstream",
]
