workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "opensovd-docker"
no-git = true
metadata-hints = ["benchmark=opensovd", "upstream-job=build_and_test"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/testcontainer/cda/Dockerfile",
  "--build-arg", "RUST_VERSION=1.88.0",
  "--provenance", "false",
  "--tag", "opensovd-benchmark:local",
  "--load", "upstream",
]
