workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "outline-base-docker"
no-git = true
metadata-hints = ["benchmark=outline-base", "upstream-job=docker-base"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile.base",
  "--tag", "outline-base-benchmark:local",
  "--load",
  "upstream",
]
