repo = "outline/outline"
branch = "main"
start_sha = "2fb1503d3548262c9d9fb4302276d2bed2a713e4"
prepare = [
  'if [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ]; then bash "$BENCH_ROOT/tools/shared/swap.sh"; fi',
]
check = "docker image inspect outline-base-benchmark:local"

[runs]
boringcache-docker = ["github", "github-arm", "blacksmith-8", "local"]
gha = ["github", "github-arm"]
ghcr = ["github", "github-arm"]
blacksmith-builder = ["blacksmith-8"]
