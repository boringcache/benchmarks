repo = "PostHog/posthog"
branch = "master"
start_sha = "08ea5803ec5e1ef5c7789e9fd094c2c4c52f5d42"
rolling_stride = 20
rolling_series = 4
setup = ["ghcr"]
prepare = [
  "bash \"$BENCH_ROOT/tools/docker/shared/posthog/prepare.sh\"",
  "ruby \"$BENCH_ROOT/tools/docker/shared/image-publication.rb\" prepare posthog-runners",
]
check = "ruby \"$BENCH_ROOT/tools/docker/shared/image-publication.rb\" check linux/arm64"

[runs]
boringcache-docker-plus = ["blacksmith-8-arm"]
blacksmith-builder-plus = ["blacksmith-8-arm"]
