workspace = "boringcache/benchmarks"

[adapters.docker]
tag = "posthog-docker"
no-git = true
metadata-hints = ["benchmark=posthog", "upstream-job=build-image-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/Dockerfile",
  "--provenance", "false",
  "--tag", "posthog-benchmark:local",
  "--load",
  "upstream",
]
