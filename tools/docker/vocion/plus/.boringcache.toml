workspace = "boringcache/benchmarks"

[adapters.docker]
fail-on-cache-error = true
tag = "vocion-docker"
no-git = true
metadata-hints = ["benchmark=vocion", "upstream-job=push-app-image"]
mount-cache = true
command = [
  "docker", "buildx", "build",
  "--file", "overlay/Dockerfile",
  "--build-arg", "NEXT_PUBLIC_APP_URL=https://example.com",
  "--provenance", "false",
  "--tag", "vocion-benchmark:local",
  "--load", "upstream",
]
