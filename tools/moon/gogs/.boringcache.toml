workspace = "boringcache/benchmarks"

[entries.pnpm-store]
tag = "gogs-pnpm-store"
path-env = "PNPM_CONFIG_STORE_DIR"

[profiles.deps]
entries = ["pnpm-store"]

[adapters.moon]
fail-on-cache-error = true
tag = "gogs-moon"
profiles = ["deps"]
no-git = true
no-platform = true
command = ["bash", "-c", "pnpm install --frozen-lockfile && moon run web:build"]
