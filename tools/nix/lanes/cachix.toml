provider = "cachix"
level = "base"
actions_only = true
runners = ["github", "depot-4"]
secrets = ["CACHIX_AUTH_TOKEN", "CACHIX_CACHE"]
setup = ["cachix"]
probe = ["printf %s \"$BENCH_SCOPE\" > preflight && cachix push \"$CACHIX_CACHE\" \"$(nix-store --add preflight)\""]

[cold]
wrap = ["cachix", "watch-exec", "${CACHIX_CACHE}", "--"]

[rolling]
wrap = ["cachix", "watch-exec", "${CACHIX_CACHE}", "--"]
