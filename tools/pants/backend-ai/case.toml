repo = "lablup/backend.ai"
branch = "main"
start_sha = "1bbdd38b729cade706ca39c2682a8fd15a1e738f"
directory = "upstream"
prepare = [
  "mise trust && mise install",
  "mkdir -p \"$BENCH_DIR/.bin\" && ln -sf \"$(mise which scie-pants)\" \"$BENCH_DIR/.bin/pants\"",
  "cd upstream && PANTS_NAMED_CACHES_DIR=\"$(mktemp -d)\" PANTS_LOCAL_STORE_DIR=\"$(mktemp -d)\" pants --version",
]
check = "test -s upstream/.pants.d/workdir/pants.log"
shared = [".pants-named-caches"]

[env]
PATH = "${BENCH_DIR}/.bin:${PATH}"
PANTS_CONFIG_FILES = "pants.ci.toml"
PANTS_NAMED_CACHES_DIR = "${BENCH_DIR}/.pants-named-caches"
PANTS_LOCAL_STORE_DIR = "${BENCH_DIR}/.pants-local-store"
PANTS_PYTHON_BOOTSTRAP_SEARCH_PATH = "[\"${HOME}/.local/share/mise/installs/python/3.13.7/bin\"]"

[runs]
boringcache-pants = ["github", "local"]
depot-cache = ["github", "local"]
nativelink = ["github"]
