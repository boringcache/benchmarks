workspace = "boringcache/benchmarks"

[entries.pants-named-caches]
tag = "pants-jvm-pants-named-caches"
path-env = "PANTS_NAMED_CACHES_DIR"

[profiles.deps]
entries = ["pants-named-caches"]

[adapters.pants]
fail-on-cache-error = true
tag = "pants-jvm-pants"
profiles = ["deps"]
no-git = true
no-platform = true
command = ["pants", "--stats-log", "check", "test", "package", "::"]
