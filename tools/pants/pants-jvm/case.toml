repo = "pantsbuild/example-jvm"
branch = "main"
start_sha = "675ee75d36f2c1b096b0def51efcfffd02bd1251"
directory = "upstream"
prepare = [
  "upstream/get-pants.sh --bin-dir \"$BENCH_DIR/.bin\" --version 0.13.2",
  "cd upstream && pants --version",
]
check = "test -s upstream/dist/src.jvm.org.pantsbuild.example.app/bin.jar"
shared = [".pants-named-caches"]

[env]
PATH = "${BENCH_DIR}/.bin:${PATH}"
PANTS_NAMED_CACHES_DIR = "${BENCH_DIR}/.pants-named-caches"
PANTS_LOCAL_STORE_DIR = "${BENCH_DIR}/.pants-local-store"

[runs]
boringcache-pants = ["github", "local"]
depot-cache = ["github", "local"]
nativelink = ["github"]
