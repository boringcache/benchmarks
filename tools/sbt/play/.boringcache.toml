workspace = "boringcache/benchmarks"

[entries.coursier-cache]
tag = "play-coursier-cache"
path-env = "COURSIER_CACHE"

[entries.sbt-boot]
tag = "play-sbt-boot"
path = ".sbt/boot"

[profiles.deps]
entries = ["coursier-cache", "sbt-boot"]

[adapters.sbt]
fail-on-cache-error = true
tag = "play-sbt"
profiles = ["deps"]
no-platform = true
no-git = true
command = ["sbt", "test"]
