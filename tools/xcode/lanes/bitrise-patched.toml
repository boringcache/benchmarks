provider = "bitrise-patched"
level = "base"
experimental = true
actions_only = true
runners = ["macos"]
secrets = ["BITRISE_BUILD_CACHE_AUTH_TOKEN", "BITRISE_BUILD_CACHE_WORKSPACE_ID"]
setup = ["bitrise-patched"]
probe = ["bitrise-build-cache activate xcode --cache --cache-push=false && bitrise-build-cache doctor"]

[env]
BITRISE_BUILD_CACHE_BENCHMARK_PHASE_XCODE = "established"

[cold]
prepare = ["bitrise-build-cache activate xcode --cache --cache-push=true"]

[warm]
prepare = ["bitrise-build-cache activate xcode --cache --cache-push=false"]

[rolling]
prepare = ["bitrise-build-cache activate xcode --cache --cache-push=true"]
